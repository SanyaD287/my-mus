<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SpotiSanya • Mobile Edition</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

:root{
  --ac:#ff2d75;
  --ac2:#ff6b4a;
  --ac-soft:rgba(255,45,117,.13);
  --ac-glow:rgba(255,45,117,.35);
  --grad:linear-gradient(135deg,var(--ac) 0%,var(--ac2) 100%);

  --bg:#0a0710;
  --bg-nav:#0e0a14;
  --panel:#150f1d;
  --card:#1b1424;
  --card-2:#221a2d;
  --card-hi:#2a2036;

  --line:rgba(255,255,255,.055);
  --line-2:rgba(255,255,255,.1);

  --tx:#f3eff8;
  --tx-mid:#9a90a8;
  --tx-dim:#655d73;
  --star:#ffc93c;

  --nav-w:260px;
  --bar-h:90px;
  --r:16px;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%; width:100%; overflow:hidden}
body{
  background:var(--bg);
  color:var(--tx);
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  font-size:14px;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(720px 420px at 12% -6%, rgba(255,45,117,.10), transparent 70%),
    radial-gradient(680px 460px at 88% 4%, rgba(120,80,255,.10), transparent 70%),
    radial-gradient(600px 400px at 60% 100%, rgba(255,107,74,.06), transparent 70%);
}

button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
ul{list-style:none}

.sb{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.13) transparent}
.sb::-webkit-scrollbar{width:6px;height:6px}
.sb::-webkit-scrollbar-thumb{background:rgba(255,255,255,.11);border-radius:99px}

/* SHELL & LAYOUT */
.shell{
  position:relative;z-index:1;
  height:100vh;height:100dvh;
  display:flex;
  flex-direction:column;
  padding-bottom:var(--bar-h);
}

.top{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;
  background:var(--bg-nav);
  border-bottom:1px solid var(--line);
  z-index:10;
}
.burger{
  width:40px;height:40px;border-radius:10px;background:var(--card);
  border:1px solid var(--line-2);font-size:18px;display:grid;place-items:center;flex-shrink:0;
}
.search{
  flex:1;position:relative;
  display:flex;align-items:center;gap:8px;
  background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:0 10px;height:40px;
}
.search .si{color:var(--tx-dim);font-size:13px}
.search input{
  flex:1;background:none;border:none;outline:none;color:var(--tx);
  font-size:13px;height:100%;
}
.search input::placeholder{color:var(--tx-dim)}

/* SIDEBAR / DRAWER */
.nav{
  position:fixed;top:0;left:0;bottom:0;width:var(--nav-w);
  background:var(--bg-nav);border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  padding:20px 14px;
  z-index:100;
  transform:translateX(-105%);
  transition:transform .3s cubic-bezier(.4,0,.2,1);
}
.nav.open{transform:none;box-shadow:40px 0 80px rgba(0,0,0,.8)}
.nav-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:95;
  display:none;backdrop-filter:blur(4px);
}
.nav-overlay.open{display:block}

.brand{display:flex;align-items:center;gap:10px;padding:0 4px 20px}
.brand-mark{
  width:32px;height:32px;border-radius:10px;background:var(--grad);
  display:grid;place-items:center;font-size:16px;
  box-shadow:0 4px 15px var(--ac-glow);flex-shrink:0;
}
.brand-name{font-size:18px;font-weight:800;letter-spacing:-.5px}
.brand-sub{font-size:8px;font-weight:700;color:var(--tx-dim);letter-spacing:2px}

.nav-h{
  font-size:9px;font-weight:800;color:var(--tx-dim);letter-spacing:1.5px;
  padding:0 8px;margin:14px 0 6px;
  display:flex;align-items:center;justify-content:space-between;
}
.nav-list{display:flex;flex-direction:column;gap:2px}
.nav-i{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:10px;
  font-size:13px;font-weight:600;color:var(--tx-mid);
  cursor:pointer;user-select:none;
}
.nav-i.on{background:var(--ac-soft);color:var(--ac)}
.nav-i .ic{width:16px;text-align:center;font-size:13px}
.nav-i .lbl{flex:1}
.nav-i .n{font-size:11px;font-weight:700;color:var(--tx-dim)}
.dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,.6)}

/* MAIN CONTENT */
.mid{
  flex:1;overflow-y:auto;
  padding:14px;
  display:flex;flex-direction:column;gap:14px;
}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.hi h1{font-size:20px;font-weight:800;letter-spacing:-.5px}
.hi p{font-size:12px;color:var(--tx-mid);margin-top:3px}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{
  background:var(--card-2);border:1px solid var(--line);border-radius:12px;
  padding:12px;display:flex;gap:10px;align-items:center;
}
.stat .si{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-size:14px;flex-shrink:0}
.stat .sl{font-size:10px;color:var(--tx-mid)}
.stat .sv{font-size:15px;font-weight:800;margin-top:1px}

/* ADD BLOCK */
.add-wrap{padding:14px}
.blk-h{font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--tx-mid);margin-bottom:10px}
.add-row{display:flex;flex-direction:column;gap:8px}
.field{
  display:flex;align-items:center;gap:8px;
  background:var(--card-2);border:1px solid var(--line);border-radius:10px;
  padding:0 12px;height:42px;
}
.field input{flex:1;background:none;border:none;outline:none;color:var(--tx);font-size:13px}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;height:42px;
  border-radius:10px;font-size:13px;font-weight:700;
  background:var(--grad);color:#fff;
  box-shadow:0 4px 15px var(--ac-glow);width:100%;
}

/* TABLE / LIST OF TRACKS */
.tbl-wrap{padding:14px}
.tbl-top{display:flex;align-items:center;justify-content:between;margin-bottom:12px}
.tbl-title{font-size:13px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
.tbody{display:flex;flex-direction:column;gap:6px}
.trow{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;border-radius:10px;background:var(--card-2);
  border:1px solid transparent;
}
.trow.on{background:var(--ac-soft);border-color:rgba(255,45,117,.3)}
.tart{width:36px;height:36px;border-radius:8px;background:var(--grad);display:grid;place-items:center;font-size:14px;flex-shrink:0}
.tinfo{flex:1;min-width:0}
.tt{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ts{font-size:11px;color:var(--tx-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tplay-btn{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:12px}

/* BOTTOM FIXED PLAYER BAR */
.bar-bottom{
  position:fixed;left:0;right:0;bottom:0;height:var(--bar-h);z-index:90;
  background:rgba(14,10,20,.95);backdrop-filter:blur(20px);
  border-top:1px solid var(--line);
  display:flex;flex-direction:column;justify-content:space-between;
  padding:8px 16px;
}
.bb-main{display:flex;align-items:center;gap:12px;min-width:0}
.bb-art{width:40px;height:40px;border-radius:8px;background:var(--grad);display:grid;place-items:center;font-size:16px;flex-shrink:0}
.bb-txt{flex:1;min-width:0}
.bb-t{font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bb-s{font-size:10.5px;color:var(--tx-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.bb-controls{display:flex;align-items:center;gap:16px}
.cb{font-size:18px;color:var(--tx-mid);background:none;border:none}
.cb.play-main{
  width:36px;height:36px;border-radius:50%;background:var(--grad);color:#fff;
  display:grid;place-items:center;font-size:14px;box-shadow:0 4px 12px var(--ac-glow);
}

/* PROGRESS BAR */
.seek{display:flex;align-items:center;gap:8px;width:100%}
.tm{font-size:9.5px;color:var(--tx-dim);min-width:28px}
.bar{flex:1;height:12px;display:flex;align-items:center;cursor:pointer}
.bar-t{width:100%;height:3px;background:rgba(255,255,255,.15);border-radius:99px;position:relative}
.bar-f{height:100%;background:var(--grad);border-radius:99px;width:0}

/* TOAST NOTIFICATIONS */
.toasts{
  position:fixed;left:50%;bottom:calc(var(--bar-h) + 10px);transform:translateX(-50%);
  z-index:200;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:90%;max-width:320px;
}
.toast{
  background:rgba(26,19,36,.95);border:1px solid var(--line-2);
  padding:10px 14px;border-radius:10px;font-size:12px;font-weight:600;
  box-shadow:0 10px 30px rgba(0,0,0,.8);text-align:center;color:#ffa6c2;
}
</style>
</head>
<body>

<div class="nav-overlay" id="nav-overlay"></div>

<!-- SIDEBAR -->
<aside class="nav sb" id="nav">
  <div class="brand">
    <div class="brand-mark">⚡</div>
    <div>
      <div class="brand-name">SpotiSanya</div>
      <div class="brand-sub">MOBILE EDITION</div>
    </div>
  </div>

  <div class="nav-h">МЕНЮ</div>
  <div class="nav-list">
    <div class="nav-i on" data-v="all"><span class="ic">🎵</span><span class="lbl">Всі треки</span><span class="n" id="n-all">0</span></div>
    <div class="nav-i" data-v="fav"><span class="ic">⭐</span><span class="lbl">Улюблені</span><span class="n" id="n-fav">0</span></div>
  </div>
</aside>

<div class="shell">
  <!-- TOPBAR -->
  <header class="top">
    <button class="burger" id="burger">☰</button>
    <div class="search">
      <span class="si">🔍</span>
      <input type="text" id="q" placeholder="Пошук треків...">
    </div>
  </header>

  <!-- CENTER CONTENT -->
  <main class="mid sb" id="mid">
    <div class="card hi">
      <h1>Привіт, Sanya 👋</h1>
      <p>Твоя музика завжди з тобою.</p>
      <div class="stats">
        <div class="stat">
          <div class="si" style="background:rgba(255,45,117,.15);color:var(--ac)">🎵</div>
          <div>
            <div class="sl">Треків у базі</div>
            <div class="sv" id="s-count">0</div>
          </div>
        </div>
        <div class="stat">
          <div class="si" style="background:rgba(34,197,94,.15);color:#22c55e"><span class="dot"></span></div>
          <div>
            <div class="sl">Статус</div>
            <div class="sv" style="font-size:12px;margin-top:2px">Онлайн</div>
          </div>
        </div>
      </div>
    </div>

    <div class="card add-wrap">
      <div class="blk-h">ДОДАТИ ТРЕК</div>
      <div class="add-row">
        <div class="field"><input type="text" id="in-title" placeholder="Назва треку..."></div>
        <div class="field"><input type="text" id="in-url" placeholder="Пряме посилання на MP3..."></div>
        <button class="btn" id="add-btn">Додати в колекцію</button>
      </div>
    </div>

    <div class="card tbl-wrap">
      <div class="tbl-top">
        <div class="tbl-title">Плейлист</div>
      </div>
      <div class="tbody" id="track-list"></div>
    </div>
  </main>

  <!-- BOTTOM PLAYER -->
  <div class="bar-bottom">
    <div class="seek">
      <span class="tm" id="cur-time">0:00</span>
      <div class="bar" id="seek-bar"><div class="bar-t"><div class="bar-f" id="seek-progress"></div></div></div>
      <span class="tm" id="dur-time">0:00</span>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;width:100%">
      <div class="bb-main">
        <div class="bb-art">🎵</div>
        <div class="bb-txt">
          <div class="bb-t" id="bb-title">Нічого не грає</div>
          <div class="bb-s" id="bb-artist">Обери трек</div>
        </div>
      </div>
      <div class="bb-controls">
        <button class="cb" id="prev-btn">⏮</button>
        <button class="cb play-main" id="play-btn">▶</button>
        <button class="cb" id="next-btn">⏭</button>
      </div>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<!-- АУДІО ЕЛЕМЕНТ З playsinline ТА preload -->
<audio id="audio" preload="auto" playsinline></audio>

<script>
let tracks = JSON.parse(localStorage.getItem('spoti_tracks')) || [
  {title: "Приклад треку", artist: "SpotiSanya", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"}
];

let currentIndex = 0;
let isPlaying = false;

const audio = document.getElementById('audio');
audio.setAttribute('playsinline', '');

const playBtn = document.getElementById('play-btn');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const bbTitle = document.getElementById('bb-title');
const bbArtist = document.getElementById('bb-artist');
const trackList = document.getElementById('track-list');
const curTimeEl = document.getElementById('cur-time');
const durTimeEl = document.getElementById('dur-time');
const seekProgress = document.getElementById('seek-progress');
const seekBar = document.getElementById('seek-bar');
const burger = document.getElementById('burger');
const nav = document.getElementById('nav');
const navOverlay = document.getElementById('nav-overlay');

function showToast(msg) {
  const container = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  container.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

function renderTracks(filter = '') {
  trackList.innerHTML = '';
  const filtered = tracks.filter(t => t.title.toLowerCase().includes(filter.toLowerCase()));
  
  document.getElementById('n-all').textContent = tracks.length;
  document.getElementById('s-count').textContent = tracks.length;

  if(filtered.length === 0) {
    trackList.innerHTML = '<div style="text-align:center;color:var(--tx-dim);padding:20px;font-size:12px">Треків немає</div>';
    return;
  }

  filtered.forEach((t, index) => {
    const realIndex = tracks.indexOf(t);
    const row = document.createElement('div');
    row.className = `trow ${realIndex === currentIndex ? 'on' : ''}`;
    row.innerHTML = `
      <div class="tart">🎵</div>
      <div class="tinfo">
        <div class="tt">${t.title}</div>
        <div class="ts">${t.artist || 'SpotiSanya'}</div>
      </div>
      <button class="tplay-btn">${realIndex === currentIndex && isPlaying ? '⏸' : '▶'}</button>
    `;
    row.onclick = () => {
      currentIndex = realIndex;
      playTrack();
    };
    trackList.appendChild(row);
  });
}

function loadTrack(index) {
  if(tracks.length === 0) return;
  currentIndex = (index + tracks.length) % tracks.length;
  const t = tracks[currentIndex];
  audio.src = t.url;
  bbTitle.textContent = t.title;
  bbArtist.textContent = t.artist || 'SpotiSanya';
  renderTracks(document.getElementById('q').value);
  updateMediaSession();
}

function playTrack() {
  if(tracks.length === 0) return;
  if(!audio.src || audio.src === window.location.href) {
    loadTrack(currentIndex);
  }
  audio.play().then(() => {
    isPlaying = true;
    playBtn.textContent = '⏸';
    renderTracks(document.getElementById('q').value);
  }).catch(e => {
    showToast('Помилка відтворення аудіо');
  });
}

function pauseTrack() {
  audio.pause();
  isPlaying = false;
  playBtn.textContent = '▶';
  renderTracks(document.getElementById('q').value);
}

playBtn.onclick = () => {
  if(isPlaying) pauseTrack();
  else playTrack();
};

nextBtn.onclick = () => {
  loadTrack(currentIndex + 1);
  playTrack();
};

prevBtn.onclick = () => {
  loadTrack(currentIndex - 1);
  playTrack();
};

audio.onended = () => {
  loadTrack(currentIndex + 1);
  playTrack();
};

audio.ontimeupdate = () => {
  if(audio.duration) {
    const p = (audio.currentTime / audio.duration) * 100;
    seekProgress.style.width = p + '%';
    curTimeEl.textContent = formatTime(audio.currentTime);
    durTimeEl.textContent = formatTime(audio.duration);
  }
};

seekBar.onclick = (e) => {
  const rect = seekBar.getBoundingClientRect();
  const pos = (e.clientX - rect.left) / rect.width;
  if(audio.duration) audio.currentTime = pos * audio.duration;
};

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s < 10 ? '0' : ''}${s}`;
}

// Керування на заблокованому екрані (Media Session API)
function updateMediaSession() {
  if ('mediaSession' in navigator && tracks[currentIndex]) {
    const current = tracks[currentIndex];
    navigator.mediaSession.metadata = new MediaMetadata({
      title: current.title,
      artist: current.artist || 'SpotiSanya',
      album: 'SpotiSanya Mobile',
      artwork: [{ src: 'https://images.unsplash.com/photo-1614680376593-902f749f7ffc', sizes: '512x512', type: 'image/jpeg' }]
    });

    navigator.mediaSession.setActionHandler('play', () => playTrack());
    navigator.mediaSession.setActionHandler('pause', () => pauseTrack());
    navigator.mediaSession.setActionHandler('previoustrack', () => { prevBtn.click(); });
    navigator.mediaSession.setActionHandler('nexttrack', () => { nextBtn.click(); });
  }
}

// Додавання нового треку
document.getElementById('add-btn').onclick = () => {
  const titleInput = document.getElementById('in-title');
  const urlInput = document.getElementById('in-url');
  const title = titleInput.value.trim();
  const url = urlInput.value.trim();

  if(!title || !url) {
    showToast('Введи назву та посилання!');
    return;
  }

  tracks.push({title, artist: 'SpotiSanya', url});
  localStorage.setItem('spoti_tracks', JSON.stringify(tracks));
  titleInput.value = '';
  urlInput.value = '';
  renderTracks();
  showToast('Трек успішно додано!');
};

document.getElementById('q').oninput = (e) => {
  renderTracks(e.target.value);
};

// Відкриття/закриття мобільного меню
burger.onclick = () => {
  nav.classList.add('open');
  navOverlay.classList.add('open');
};
navOverlay.onclick = () => {
  nav.classList.remove('open');
  navOverlay.classList.remove('open');
};

// Ініціалізація
renderTracks();
if(tracks.length > 0) loadTrack(0);
</script>
</body>
</html>
