<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Локальний Музичний Плеєр</title>
    <style>
        body { 
            background: #121212; 
            color: white; 
            font-family: sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .box { 
            width: 350px; 
            background: #1e1e1e; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
        }
        input, button { 
            width: 100%; 
            margin-top: 10px; 
            padding: 10px; 
            border-radius: 6px; 
            border: 1px solid #333; 
            background: #2a2a2a; 
            color: #fff; 
            box-sizing: border-box; 
        }
        button { 
            background: #1db954; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
        }
        button:hover { 
            background: #1aa34a; 
        }
        ul { 
            list-style: none; 
            padding: 0; 
            max-height: 150px; 
            overflow-y: auto; 
            margin-top: 15px; 
        }
        li { 
            padding: 8px 0; 
            border-bottom: 1px solid #333; 
            cursor: pointer; 
            font-size: 14px; 
        }
        li:hover {
            color: #1db954;
        }
    </style>
</head>
<body>

<div class="box">
    <h3>Мій Плейлист</h3>
    <audio id="player" controls style="width: 100%; margin-top: 10px;"></audio>
    
    <div style="margin-top: 15px;">
        <input type="text" id="title" placeholder="Назва пісні">
        <input type="file" id="file" accept="audio/*">
        <button id="add-btn">Додати у плейлист</button>
    </div>

    <ul id="list"></ul>
</div>

<script>
    let db;

    // Створюємо або відкриваємо локальну базу даних у браузері
    const request = indexedDB.open('LocalMusicDB', 1);

    request.onerror = (event) => {
        console.error('Помилка бази даних:', event.target.error);
    };

    request.onupgradeneeded = (event) => {
        db = event.target.result;
        if (!db.objectStoreNames.contains('songs')) {
            db.createObjectStore('songs', { keyPath: 'id', autoIncrement: true });
        }
    };

    request.onsuccess = (event) => {
        db = event.target.result;
        loadSongs();
    };

    // Функція завантаження списку пісень із бази браузера
    function loadSongs() {
        const list = document.getElementById('list');
        list.innerHTML = '';

        const transaction = db.transaction(['songs'], 'readonly');
        const store = transaction.objectStore('songs');
        const request = store.getAll();

        request.onsuccess = () => {
            const songs = request.result;
            if (!songs || songs.length === 0) {
                list.innerHTML = '<li style="color: #888; text-align: center; cursor: default;">Плейлист порожній</li>';
                return;
            }

            songs.forEach(song => {
                const li = document.createElement('li');
                li.textContent = song.title;
                
                // При кліку створюємо локальне посилання на файл і відтворюємо
                li.onclick = () => {
                    const player = document.getElementById('player');
                    const blobUrl = URL.createObjectURL(song.fileBlob);
                    player.src = blobUrl;
                    player.play();
                };
                
                list.appendChild(li);
            });
        };
    }

    // Обробник натискання на кнопку додавання
    document.getElementById('add-btn').addEventListener('click', () => {
        const fileInput = document.getElementById('file');
        const titleInput = document.getElementById('title');
        
        const file = fileInput.files[0];
        const title = titleInput.value.trim();

        if (!file || !title) {
            alert('Виберіть файл і введіть назву пісні!');
            return;
        }

        const transaction = db.transaction(['songs'], 'readwrite');
        const store = transaction.objectStore('songs');

        const songData = {
            title: title,
            fileBlob: file, // Зберігаємо сам аудіофайл у пам'яті браузера
            createdAt: Date.now()
        };

        const request = store.add(songData);

        request.onsuccess = () => {
            alert('Пісню успішно додано!');
            fileInput.value = '';
            titleInput.value = '';
            loadSongs(); // Оновлюємо список на екрані
        };

        request.onerror = (event) => {
            console.error('Помилка збереження:', event.target.error);
            alert('Не вдалося зберегти пісню.');
        };
    });
</script>
</body>
</html>
