<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpotiSanya — Ваша музика</title>
    <style>
        :root {
            --accent: #1ed760;
            --accent-hover: #1faa50;
            --bg-main: #0a0a0a;
            --bg-card: #121212;
            --bg-card-hover: #1a1a1a;
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #a7a7a7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .app-layout {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        .main-content {
            padding: 32px 40px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding-bottom: 140px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        .app-title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(45deg, #1ed760, #1db954);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        .add-card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 16px;
            display: flex;
            gap: 12px;
            align-items: center;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            flex-wrap: wrap;
        }

        input[type="text"] {
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: #181818;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            flex: 1;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus { border-color: var(--accent); }

        button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 500px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }
        button:hover { background: var(--accent-hover); transform: scale(1.02); }
        button:active { transform: scale(0.98); }

        .secondary-btn {
            background: #242424;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }
        .secondary-btn:hover { background: #2a2a2a; }

        .drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            background: rgba(255,255,255,0.01);
            transition: border-color 0.2s, background 0.2s;
        }
        .drop-zone:hover {
            border-color: var(--accent);
            background: rgba(30, 215, 96, 0.02);
        }

        .playlist-header {
            display: grid;
            grid-template-columns: 48px 1fr 120px;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 0 20px 10px 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 12px;
        }

        ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        li {
            display: grid;
            grid-template-columns: 48px 1fr 120px;
            align-items: center;
            padding: 12px 20px;
            border-radius: 12px;
            background: var(--bg-card);
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: background 0.2s, border-color 0.2s;
        }
        li:hover { 
            background: var(--bg-card-hover); 
            border-color: rgba(255,255,255,0.15);
        }
        li.active {
            background: rgba(30, 215, 96, 0.08);
            border-color: rgba(30, 215, 96, 0.3);
        }
        li.active .song-name { color: var(--accent); font-weight: 700; }
        
        .song-index { color: var(--text-muted); font-size: 14px; font-weight: 500; }
        .song-name {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 15px;
        }
        
        .action-btns {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        li:hover .action-btns { opacity: 1; }

        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 13px;
            padding: 6px 8px;
            border-radius: 6px;
            transform: none !important;
        }
        .action-btn:hover { background: rgba(255,255,255,0.1); color: var(--text-main); }
        .del-btn:hover { color: #ff5555 !important; }

        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #080808;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 32px;
            gap: 20px;
            z-index: 10;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
        }

        .current-info {
            width: 25%;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-center {
            width: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .ctrl-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 16px;
            cursor: pointer;
            padding: 4px;
            transition: color 0.2s, transform 0.1s;
        }
        .ctrl-btn:hover { color: var(--text-main); transform: scale(1.1); }

        .play-pause-btn {
            width: 40px;
            height: 40px;
            background: var(--text-main);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 14px;
            font-weight: bold;
            transition: transform 0.1s, background 0.2s;
        }
        .play-pause-btn:hover { background: var(--accent); transform: scale(1.05); }

        .progress-container {
            width: 100%;
            max-width: 500px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: var(--text-main);
            border-radius: 3px;
            width: 0%;
            transition: background 0.2s;
        }
        .progress-container:hover .progress-bar { background: var(--accent); }

        .volume-wrapper {
            width: 25%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
        }
        .volume-slider {
            width: 100px;
            height: 4px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .player-bar { flex-direction: column; gap: 12px; padding: 16px; }
            .current-info, .player-center, .volume-wrapper { width: 100%; justify-content: center; text-align: center; }
            .main-content { padding: 16px; padding-bottom: 200px; }
        }
    </style>
</head>
<body>

<div class="app-layout">
    <div class="main-content">
        <div class="header-top">
            <div class="app-title">🎵 SpotiSanya</div>
        </div>

        <div>
            <div class="section-title">Додати трек або посилання</div>
            <div class="add-card">
                <input type="text" id="title" placeholder="Назва треку">
                <input type="text" id="url" placeholder="Посилання на MP3, SoundCloud або YouTube плейлист">
                <button id="add-btn">Додати</button>
                <input type="file" id="folder-input" webkitdirectory directory multiple style="display: none;">
                <button id="folder-btn" class="secondary-btn">📂 Папка</button>
            </div>
        </div>

        <div class="drop-zone" id="drop-zone">
            📥 Перетягніть MP3 файли сюди для швидкого додавання
        </div>

        <div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <div class="section-title" style="margin-bottom: 0;">Плейлист</div>
                <input type="text" id="search-input" placeholder="🔍 Пошук..." style="max-width: 240px; padding: 8px 12px; font-size: 13px;">
            </div>
            <div class="playlist-header">
                <div>#</div>
                <div>Назва</div>
                <div style="text-align: right;">Дії</div>
            </div>
            <ul id="list"></ul>
        </div>
    </div>

    <div class="player-bar">
        <div class="current-info" id="current-song-title">Нічого не вибрано</div>
        
        <div class="player-center">
            <div class="player-controls">
                <button class="ctrl-btn" id="prev-btn" title="Попередній">⏮</button>
                <button class="ctrl-btn play-pause-btn" id="play-pause-btn" title="Грати / Пауза">▶</button>
                <button class="ctrl-btn" id="next-btn" title="Наступний">⏭</button>
            </div>
            <div class="progress-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>

        <div class="volume-wrapper">
            <span>🔊</span>
            <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="1">
        </div>
    </div>
</div>

<audio id="player" preload="auto" playsinline></audio>

<script>
    const BIN_ID = '6a7c3536da38895dfed9948e'; 
    const API_KEY = '$2a$10$RZSWlrF3nSMRAsv5Jlk1MOHs4qBWJ6ItuOqlU9rE1KSeii4Ck2XFu'; 
    const urlAPI = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    let currentSongs = [];
    let currentIndex = 0;
    let searchQuery = '';

    const player = document.getElementById('player');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const progressBar = document.getElementById('progress-bar');
    const progressContainer = document.getElementById('progress-container');
    const currentSongTitle = document.getElementById('current-song-title');
    const volumeSlider = document.getElementById('volume-slider');
    const searchInput = document.getElementById('search-input');

    volumeSlider.oninput = (e) => { 
        player.volume = e.target.value; 
        localStorage.setItem('spotisanya_volume', player.volume);
    };

    const savedVol = localStorage.getItem('spotisanya_volume');
    if (savedVol !== null) {
        player.volume = parseFloat(savedVol);
        volumeSlider.value = savedVol;
    }

    async function loadSongs() {
        loadFromCache();
        try {
            const response = await fetch(urlAPI, { headers: { 'X-Master-Key': API_KEY }});
            if (!response.ok) throw new Error('Помилка завантаження з хмари');
            const result = await response.json();
            const cloudSongs = result.record.songs;

            if (Array.isArray(cloudSongs)) {
                currentSongs = cloudSongs;
                localStorage.setItem('spotisanya_cache', JSON.stringify(currentSongs));
            }
        } catch (err) {
            console.warn('Використовуємо локальний кеш через помилку мережі:', err);
        }
        renderList();
    }

    function loadFromCache() {
        const cached = localStorage.getItem('spotisanya_cache');
        if (cached) {
            try { currentSongs = JSON.parse(cached); } catch(e) {}
        }
    }
    loadSongs();

    async function syncCloud() {
        localStorage.setItem('spotisanya_cache', JSON.stringify(currentSongs));
        try {
            await fetch(urlAPI, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify({ songs: currentSongs })
            });
        } catch(err) {
            console.error('Не вдалося синхронізувати з хмарою:', err);
        }
    }

    function renderList() {
        const list = document.getElementById('list');
        list.innerHTML = '';
        
        const filteredSongs = currentSongs.map((song, originalIndex) => ({ ...song, originalIndex }))
            .filter(song => song.title.toLowerCase().includes(searchQuery.toLowerCase()));

        if (filteredSongs.length === 0) {
            list.innerHTML = '<li style="color: var(--text-muted); justify-content: center; display: flex; text-align: center; padding: 20px; background: transparent; border: none;">Список порожній або нічого не знайдено</li>';
            return;
        }

        filteredSongs.forEach((song) => {
            const li = document.createElement('li');
            if (song.originalIndex === currentIndex) li.classList.add('active');

            li.innerHTML = `
                <span class="song-index">${song.originalIndex + 1}</span>
                <span class="song-name" title="${song.title}">${song.title}</span>
                <div class="action-btns">
                    <button class="action-btn" onclick="renameSong(event, ${song.originalIndex})" title="Редагувати">✏️</button>
                    <button class="action-btn del-btn" onclick="deleteSong(event, ${song.originalIndex})" title="Видалити">✕</button>
                </div>
            `;
            li.onclick = () => playSong(song.originalIndex);
            list.appendChild(li);
        });
    }

    searchInput.oninput = (e) => {
        searchQuery = e.target.value;
        renderList();
    };

    function playSong(index) {
        if (index < 0 || index >= currentSongs.length) return;
        currentIndex = index;
        const song = currentSongs[currentIndex];
        
        player.src = song.url;
        player.load();
        player.play().then(() => {
            playPauseBtn.textContent = '❚❚';
        }).catch(() => {
            playPauseBtn.textContent = '▶';
        });
        
        currentSongTitle.textContent = song.title;
        renderList();
    }

    playPauseBtn.onclick = () => {
        if (currentSongs.length === 0) return;
        if (player.paused) {
            if (!player.src) playSong(0);
            else player.play().then(() => { playPauseBtn.textContent = '❚❚'; });
        } else {
            player.pause();
            playPauseBtn.textContent = '▶';
        }
    };

    document.getElementById('next-btn').onclick = () => {
        if (currentSongs.length > 0) playSong((currentIndex + 1) % currentSongs.length);
    };
    document.getElementById('prev-btn').onclick = () => {
        if (currentSongs.length > 0) playSong((currentIndex - 1 + currentSongs.length) % currentSongs.length);
    };

    player.ontimeupdate = () => {
        if (player.duration) {
            progressBar.style.width = ((player.currentTime / player.duration) * 100) + '%';
        }
    };

    progressContainer.onclick = (e) => {
        if (player.duration) {
            player.currentTime = (e.offsetX / progressContainer.clientWidth) * player.duration;
        }
    };

    player.onended = () => {
        if (currentSongs.length > 0) playSong((currentIndex + 1) % currentSongs.length);
    };

    document.getElementById('add-btn').onclick = async () => {
        const titleInput = document.getElementById('title');
        const urlInput = document.getElementById('url');
        const title = titleInput.value.trim();
        const url = urlInput.value.trim();

        if (!url) return alert('Введіть посилання!');

        if (!title) {
            currentSongs.push({ title: url.split('/').pop() || 'Трек', url });
        } else {
            currentSongs.push({ title, url });
        }

        titleInput.value = ''; 
        urlInput.value = '';
        renderList();
        await syncCloud();
    };

    const dropZoneEl = document.getElementById('drop-zone');
    dropZoneEl.ondragover = (e) => { e.preventDefault(); };
    dropZoneEl.ondrop = async (e) => {
        e.preventDefault();
        if (e.dataTransfer.files.length > 0) {
            const file = e.dataTransfer.files[0];
            if (file.type.includes('audio') || file.name.endsWith('.mp3')) {
                currentSongs.push({ title: file.name.replace(/\.[^/.]+$/, ""), url: URL.createObjectURL(file) });
                renderList();
                playSong(currentSongs.length - 1);
                await syncCloud();
            }
        }
    };

    const folderBtn = document.getElementById('folder-btn');
    const folderInput = document.getElementById('folder-input');
    folderBtn.onclick = () => folderInput.click();
    folderInput.onchange = async (e) => {
        let added = 0;
        for (let file of e.target.files) {
            if (file.name.endsWith('.mp3') || file.name.endsWith('.wav')) {
                currentSongs.push({ title: file.name.replace(/\.[^/.]+$/, ""), url: URL.createObjectURL(file) });
                added++;
            }
        }
        if (added > 0) {
            renderList();
            if (!player.src) playSong(currentSongs.length - added);
            await syncCloud();
        }
        folderInput.value = '';
    };

    async function renameSong(event, index) {
        event.stopPropagation();
        const newTitle = prompt("Нова назва:", currentSongs[index].title);
        if (!newTitle || !newTitle.trim()) return;
        currentSongs[index].title = newTitle.trim();
        renderList();
        if (index === currentIndex) currentSongTitle.textContent = newTitle.trim();
        await syncCloud();
    }

    async function deleteSong(event, index) {
        event.stopPropagation();
        if (!confirm("Видалити трек?")) return;
        currentSongs.splice(index, 1);
        renderList();
        await syncCloud();
    }
</script>
</body>
</html>
