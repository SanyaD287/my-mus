<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хмарний Плейлист</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }
        .player-container {
            width: 100%;
            max-width: 400px;
            background: #181818;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }
        h3 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 20px;
            text-align: center;
            letter-spacing: 0.5px;
        }
        audio {
            width: 100%;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #242424;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #e50914;
        }
        button#add-btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: #e50914;
            color: #fff;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button#add-btn:hover {
            background: #b20710;
        }
        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .playlist-title {
            font-size: 14px;
            color: #b3b3b3;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 220px;
            overflow-y: auto;
        }
        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            margin-bottom: 6px;
            background: #222;
            border-radius: 8px;
            transition: background 0.2s;
        }
        li:hover {
            background: #282828;
        }
        .song-info {
            cursor: pointer;
            flex-grow: 1;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-right: 10px;
        }
        .artist {
            color: #e50914;
            font-weight: bold;
        }
        .song-info:hover {
            opacity: 0.8;
        }
        .del-btn {
            background: transparent;
            color: #888;
            border: none;
            padding: 6px 10px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
            transition: color 0.2s, background 0.2s;
        }
        .del-btn:hover {
            color: #fff;
            background: #e50914;
        }
    </style>
</head>
<body>

<div class="player-container">
    <h3>Мій Хмарний Плейлист</h3>
    
    <audio id="player" controls></audio>
    
    <div class="input-group">
        <input type="text" id="title" placeholder="Приклад: LOBODA - Парень">
        <input type="text" id="url" placeholder="Пряме посилання на MP3">
        <button id="add-btn">Додати у плейлист</button>
    </div>

    <div class="playlist-header">
        <span class="playlist-title">Черга (А-Я / A-Z)</span>
    </div>
    <ul id="list"></ul>
</div>

<script>
    const BIN_ID = '6a7c3536da38895dfed9948e'; 
    const API_KEY = '$2a$10$RZSWlrF3nSMRAsv5Jlk1MOHs4qBWJ6ItuOqlU9rE1KSeii4Ck2XFu'; 
    const urlAPI = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    async function loadSongs() {
        try {
            const response = await fetch(urlAPI, { headers: { 'X-Master-Key': API_KEY }});
            const result = await response.json();
            let songs = result.record.songs || [];
            
            const list = document.getElementById('list');
            list.innerHTML = '';
            
            if (songs.length === 0) {
                list.innerHTML = '<li style="color: #777; justify-content: center; cursor: default;">Плейлист порожній</li>';
                return;
            }

            // Розумне сортування: враховує і українську (А-Я), і англійську (A-Z) мови одночасно
            songs.sort((a, b) => {
                return a.title.localeCompare(b.title, ['uk', 'en'], { 
                    sensitivity: 'base', 
                    numeric: true 
                });
            });

            songs.forEach((song) => {
                const li = document.createElement('li');
                
                let displayName = song.title;
                if (song.title.includes(' - ')) {
                    const parts = song.title.split(' - ');
                    const artist = parts[0];
                    const track = parts.slice(1).join(' - ');
                    displayName = `<span class="artist">${artist}</span> - ${track}`;
                }

                li.innerHTML = `
                    <span class="song-info" title="${song.title}">${displayName}</span>
                    <button class="del-btn">✕</button>
                `;
                
                li.querySelector('.song-info').onclick = () => {
                    const player = document.getElementById('player');
                    player.src = song.url;
                    player.play();
                };

                li.querySelector('.del-btn').onclick = async () => {
                    await deleteSongByTitle(song.title);
                };

                list.appendChild(li);
            });
        } catch (err) {
            console.error('Помилка завантаження:', err);
        }
    }

    async function deleteSongByTitle(songTitle) {
        try {
            const res = await fetch(urlAPI, { headers: { 'X-Master-Key': API_KEY }});
            const data = await res.json();
            let songs = data.record.songs || [];
            
            songs = songs.filter(song => song.title !== songTitle);
            
            await fetch(urlAPI, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify({ songs })
            });
            loadSongs();
        } catch (err) {
            alert('Помилка видалення');
        }
    }

    document.getElementById('add-btn').onclick = async () => {
        const title = document.getElementById('title'].value.trim();
        const url = document.getElementById('url').value.trim();
        if (!title || !url) {
            alert('Заповніть обидва поля!');
            return;
        }
        
        try {
            const res = await fetch(urlAPI, { headers: { 'X-Master-Key': API_KEY }});
            const data = await res.json();
            const songs = data.record.songs || [];
            
            songs.push({ title, url });
            
            const updateRes = await fetch(urlAPI, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify({ songs })
            });

            if (updateRes.ok) {
                document.getElementById('title').value = '';
                document.getElementById('url').value = '';
                loadSongs();
            } else {
                alert('Помилка збереження');
            }
        } catch (err) {
            alert('Помилка: ' + err.message);
        }
    };

    loadSongs();
</script>
</body>
</html>
