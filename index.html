<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpotiSanya • Clean Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        :root {
            --accent: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.25);
            --accent-gradient: linear-gradient(135deg, #00ff88 0%, #00b8ff 100%);
            
            --bg-main: #070709;
            --bg-surface: rgba(18, 18, 24, 0.7);
            --bg-surface-hover: rgba(28, 28, 38, 0.85);
            --bg-card: #111116;
            
            --border-color: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(0, 255, 136, 0.3);
            
            --text-main: #f3f4f6;
            --text-muted: #8b8d98;
            
            --blur-glass: blur(20px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 184, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(0, 255, 136, 0.06) 0%, transparent 40%);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .app-layout {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        .main-content {
            padding: 40px 48px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 28px;
            padding-bottom: 180px;
        }

        .main-content::-webkit-scrollbar { width: 8px; }
        .main-content::-webkit-scrollbar-track { background: transparent; }
        .main-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
        .main-content::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 12px;
            filter: drop-shadow(0 0 25px rgba(0, 255, 136, 0.2));
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 12px;
        }

        .add-section-wrapper {
            transition: all 0.3s ease;
        }

        .add-card {
            background: var(--bg-surface);
            backdrop-filter: var(--blur-glass);
            -webkit-backdrop-filter: var(--blur-glass);
            padding: 24px;
            border-radius: 20px;
            display: flex;
            gap: 14px;
            align-items: center;
            border: 1px solid var(--border-color);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
            flex-wrap: wrap;
            transition: border-color 0.3s;
        }
        .add-card:focus-within { border-color: var(--border-hover); }

        input[type="text"] {
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-main);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            flex: 1;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        input[type="text"]:focus { 
            border-color: var(--accent); 
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        button {
            background: var(--accent-gradient);
            color: #070709;
            border: none;
            padding: 14px 28px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 4px 20px var(--accent-glow);
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), filter 0.2s;
        }
        button:hover { filter: brightness(1.15); transform: translateY(-2px); }
        button:active { transform: translateY(0); }

        .secondary-btn {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            box-shadow: none;
        }
        .secondary-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255,255,255,0.15); }

        .drop-zone {
            border: 2px dashed rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            background: rgba(255, 255, 255, 0.01);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }
        .drop-zone:hover {
            border-color: var(--accent);
            background: rgba(0, 255, 136, 0.02);
            color: var(--text-main);
            box-shadow: inset 0 0 20px var(--accent-glow);
        }

        .playlist-header {
            display: grid;
            grid-template-columns: 48px 1fr 120px;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 0 20px 12px 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 8px;
        }

        ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        li {
            display: grid;
            grid-template-columns: 48px 1fr 120px;
            align-items: center;
            padding: 14px 20px;
            border-radius: 14px;
            background: var(--bg-surface);
            backdrop-filter: var(--blur-glass);
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        li:hover { 
            background: var(--bg-surface-hover); 
            border-color: rgba(255, 255, 255, 0.12);
            transform: translateX(4px);
        }
        li.active {
            background: rgba(0, 255, 136, 0.07);
            border-color: var(--accent);
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.1);
        }
        li.active .song-name { color: var(--accent); font-weight: 700; text-shadow: 0 0 10px var(--accent-glow); }
        
        .song-index { color: var(--text-muted); font-size: 14px; font-weight: 600; }
        .song-name {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 15px;
            transition: color 0.2s;
        }
        
        .action-btns {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
            opacity: 0.4;
            transition: opacity 0.2s;
        }
        li:hover .action-btns { opacity: 1; }

        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 13px;
            padding: 8px;
            border-radius: 8px;
            transition: background 0.2s, color 0.2s;
        }
        .action-btn:hover { background: rgba(255, 255, 255, 0.1); color: var(--text-main); }
        .del-btn:hover { color: #ff4757 !important; background: rgba(255, 71, 87, 0.1) !important; }

        /* Vinyl Record Styles (PC) */
        .vinyl-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            user-select: none;
        }
        .vinyl-disc {
            width: 220px;
            height: 220px;
            background: #111;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 0 0 15px #1a1a1a, inset 0 0 0 20px #111, inset 0 0 0 35px #1c1c1c, inset 0 0 0 40px #111;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            animation: spin 10s linear infinite;
            animation-play-state: paused;
            transition: transform 0.1s ease-out;
        }
        .vinyl-disc.playing {
            animation-play-state: running;
        }
        .vinyl-disc:active { cursor: grabbing; }
        .vinyl-label {
            width: 80px;
            height: 80px;
            background: var(--accent-gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            position: relative;
        }
        .vinyl-hole {
            width: 16px;
            height: 16px;
            background: var(--bg-main);
            border-radius: 50%;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* PC Equalizer Panel */
        .equalizer-panel {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            padding: 16px 24px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }
        .eq-sliders {
            display: flex;
            gap: 20px;
            justify-content: space-between;
        }
        .eq-band {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            flex: 1;
        }
        .eq-band label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 700;
        }
        .eq-band input[type="range"] {
            writing-mode: bt-lr;
            -webkit-appearance: slider-vertical;
            width: 8px;
            height: 80px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        /* Player Bar */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 10, 13, 0.9);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 48px;
            gap: 24px;
            z-index: 10;
            box-shadow: 0 -20px 40px rgba(0,0,0,0.6);
            transition: transform 0.3s ease;
        }

        .current-info {
            width: 25%;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: -0.2px;
            cursor: pointer;
        }

        .player-center {
            width: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .ctrl-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 16px;
            cursor: pointer;
            padding: 6px;
            box-shadow: none;
            transition: color 0.2s, transform 0.2s;
        }
        .ctrl-btn:hover { color: var(--text-main); transform: scale(1.15); filter: none; }
        .ctrl-btn.active-mode { color: var(--accent); text-shadow: 0 0 10px var(--accent-glow); }

        .play-pause-btn {
            width: 44px;
            height: 44px;
            background: var(--accent-gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #070709;
            font-size: 14px;
            font-weight: 800;
            box-shadow: 0 4px 20px var(--accent-glow);
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), filter 0.2s;
        }
        .play-pause-btn:hover { filter: brightness(1.15); transform: scale(1.08); }

        .progress-container {
            width: 100%;
            max-width: 550px;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: var(--accent-gradient);
            border-radius: 3px;
            width: 0%;
            box-shadow: 0 0 10px var(--accent-glow);
            transition: width 0.1s linear;
        }

        .volume-wrapper {
            width: 25%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
        }
        .volume-slider {
            width: 110px;
            height: 4px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .expand-mobile-btn {
            display: none;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
            box-shadow: none;
        }

        /* Mobile Layout Adjustments */
        @media (max-width: 768px) {
            body { background: var(--bg-main); overflow-y: auto; }
            .app-layout { height: 100vh; }
            .main-content { padding: 20px; padding-bottom: 120px; gap: 20px; }
            .add-section-wrapper, .drop-zone, .playlist-header, .equalizer-panel, .vinyl-container, .volume-wrapper {
                display: none !important;
            }
            .header-top { justify-content: space-between; margin-bottom: 5px; }
            
            .expand-mobile-btn {
                display: block;
            }

            /* Compact Player Bar at bottom for Mobile */
            .player-bar {
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                background: rgba(13, 13, 18, 0.95);
                backdrop-filter: blur(20px);
                flex-direction: column;
                padding: 12px 16px;
                gap: 8px;
                z-index: 100;
            }

            .player-bar.expanded {
                height: 75vh;
                justify-content: space-evenly;
                border-top-left-radius: 24px;
                border-top-right-radius: 24px;
            }

            .player-bar.expanded .volume-wrapper {
                display: flex !important;
                width: 100%;
                justify-content: center;
            }
            .player-bar.expanded .volume-slider {
                width: 200px;
            }
            .player-bar.expanded .expand-mobile-btn {
                transform: rotate(180deg);
            }

            .current-info {
                width: 100%;
                text-align: left;
                font-size: 15px;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .player-center {
                width: 100%;
                gap: 6px;
            }

            .player-controls {
                gap: 20px;
            }
            .ctrl-btn { font-size: 18px; }
            .play-pause-btn { width: 42px; height: 42px; font-size: 14px; }
            .progress-container { max-width: 100%; height: 5px; }

            /* List adaptation for mobile */
            ul { margin-top: 5px; }
            li {
                grid-template-columns: 36px 1fr 90px;
                padding: 12px 14px;
            }
        }
    </style>
</head>
<body>

<div class="app-layout">
    <div class="main-content">
        <div class="header-top">
            <div class="app-title">⚡ SpotiSanya</div>
        </div>

        <!-- PC Vinyl Record & Scratch feature -->
        <div class="vinyl-container">
            <div class="vinyl-disc" id="vinyl-disc" title="Затисніть і крутіть для скретчу">
                <div class="vinyl-label">
                    <div class="vinyl-hole"></div>
                </div>
            </div>
        </div>

        <div class="add-section-wrapper">
            <div class="section-title">Додати трек або джерело</div>
            <div class="add-card">
                <input type="text" id="title" placeholder="Введіть назву треку...">
                <input type="text" id="url" placeholder="Посилання на MP3, SoundCloud або YouTube плейлист...">
                <button id="add-btn">Додати</button>
                <input type="file" id="folder-input" webkitdirectory directory multiple style="display: none;">
                <button id="folder-btn" class="secondary-btn">📂 Обрати папку</button>
            </div>
        </div>

        <div class="drop-zone" id="drop-zone">
            📥 Перетягніть ваші MP3 файли сюди
        </div>

        <!-- PC Equalizer Panel -->
        <div class="equalizer-panel" id="equalizer-panel">
            <div class="section-title" style="margin-bottom: 0; font-size: 13px;">Еквалайзер (ПК)</div>
            <div class="eq-sliders">
                <div class="eq-band">
                    <label>60Hz</label>
                    <input type="range" min="-20" max="20" value="0" step="1" data-band="0">
                </div>
                <div class="eq-band">
                    <label>230Hz</label>
                    <input type="range" min="-20" max="20" value="0" step="1" data-band="1">
                </div>
                <div class="eq-band">
                    <label>910Hz</label>
                    <input type="range" min="-20" max="20" value="0" step="1" data-band="2">
                </div>
                <div class="eq-band">
                    <label>4kHz</label>
                    <input type="range" min="-20" max="20" value="0" step="1" data-band="3">
                </div>
                <div class="eq-band">
                    <label>14kHz</label>
                    <input type="range" min="-20" max="20" value="0" step="1" data-band="4">
                </div>
            </div>
        </div>

        <div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <div class="section-title" style="margin-bottom: 0;">Ваш Плейлист</div>
                <input type="text" id="search-input" placeholder="🔍 Швидкий пошук..." style="max-width: 240px; padding: 10px 16px; font-size: 13px;">
            </div>
            <div class="playlist-header">
                <div>#</div>
                <div>Назва треку</div>
                <div style="text-align: right;">Дії</div>
            </div>
            <ul id="list"></ul>
        </div>
    </div>

    <div class="player-bar" id="player-bar">
        <div class="current-info" id="current-song-title">
            <span>Нічого не грає</span>
            <button class="expand-mobile-btn" id="expand-btn">▲</button>
        </div>
        
        <div class="player-center">
            <div class="player-controls">
                <button class="ctrl-btn" id="shuffle-btn" title="Випадковий порядок">🔀</button>
                <button class="ctrl-btn" id="repeat-btn" title="Повтор треку">🔁</button>
                <button class="ctrl-btn" id="prev-btn" title="Попередній">⏮</button>
                <button class="ctrl-btn play-pause-btn" id="play-pause-btn" title="Грати / Пауза">▶</button>
                <button class="ctrl-btn" id="next-btn" title="Наступний">⏭</button>
            </div>
            <div class="progress-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>

        <div class="volume-wrapper">
            <span>🔊</span>
            <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="1">
        </div>
    </div>
</div>

<audio id="player" preload="auto" crossorigin="anonymous" playsinline></audio>

<script>
    const BIN_ID = '6a7c3536da38895dfed9948e'; 
    const API_KEY = '$2a$10$RZSWlrF3nSMRAsv5Jlk1MOHs4qBWJ6ItuOqlU9rE1KSeii4Ck2XFu'; 
    const urlAPI = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    let currentSongs = [];
    let currentIndex = 0;
    let searchQuery = '';
    let isRepeat = false;
    let isShuffle = false;

    const player = document.getElementById('player');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const progressBar = document.getElementById('progress-bar');
    const progressContainer = document.getElementById('progress-container');
    const currentSongTitle = document.getElementById('current-song-title');
    const volumeSlider = document.getElementById('volume-slider');
    const searchInput = document.getElementById('search-input');
    const repeatBtn = document.getElementById('repeat-btn');
    const shuffleBtn = document.getElementById('shuffle-btn');
    const vinylDisc = document.getElementById('vinyl-disc');
    const playerBar = document.getElementById('player-bar');
    const expandBtn = document.getElementById('expand-btn');

    // Expand/Collapse mobile player bar toggle
    expandBtn.onclick = (e) => {
        e.stopPropagation();
        playerBar.classList.toggle('expanded');
    };

    // Web Audio API & Equalizer Setup (PC Only)
    let audioCtx, sourceNode, filters = [];
    function initAudioContext() {
        if (audioCtx) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            sourceNode = audioCtx.createMediaElementSource(player);

            const frequencies = [60, 230, 910, 4000, 14000];
            let lastNode = sourceNode;

            filters = frequencies.map(freq => {
                let filter = audioCtx.createBiquadFilter();
                filter.type = 'peaking';
                filter.frequency.value = freq;
                filter.gain.value = 0;
                lastNode.connect(filter);
                lastNode = filter;
                return filter;
            });

            lastNode.connect(audioCtx.destination);
        } catch(e) {
            console.warn("Web Audio API error:", e);
        }
    }

    document.querySelectorAll('.eq-band input').forEach(input => {
        input.oninput = (e) => {
            initAudioContext();
            const bandIdx = e.target.getAttribute('data-band');
            if (filters[bandIdx]) {
                filters[bandIdx].gain.value = parseFloat(e.target.value);
            }
        };
    });

    // Vinyl Scratch Mechanics
    let isDraggingVinyl = false;
    let startAngle = 0;
    let lastRotation = 0;

    vinylDisc.onmousedown = (e) => {
        isDraggingVinyl = true;
        initAudioContext();
        if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        const rect = vinylDisc.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        startAngle = Math.atan2(e.clientY - cy, e.clientX - cx) * (180 / Math.PI);
        player.playbackRate = 0;
    };

    window.onmousemove = (e) => {
        if (!isDraggingVinyl) return;
        const rect = vinylDisc.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const currentAngle = Math.atan2(e.clientY - cy, e.clientX - cx) * (180 / Math.PI);
        let diff = currentAngle - startAngle;
        lastRotation += diff;
        vinylDisc.style.transform = `rotate(${lastRotation}deg)`;
        startAngle = currentAngle;

        player.playbackRate = Math.max(-2, Math.min(2, diff / 5));
    };

    window.onmouseup = () => {
        if (isDraggingVinyl) {
            isDraggingVinyl = false;
            player.playbackRate = 1.0;
            if (!player.paused) {
                vinylDisc.classList.add('playing');
            }
        }
    };

    volumeSlider.oninput = (e) => { 
        player.volume = e.target.value; 
        localStorage.setItem('spotisanya_volume', player.volume);
    };

    const savedVol = localStorage.getItem('spotisanya_volume');
    if (savedVol !== null) {
        player.volume = parseFloat(savedVol);
        volumeSlider.value = savedVol;
    }

    async function loadSongs() {
        loadFromCache();
        try {
            const response = await fetch(urlAPI, { headers: { 'X-Master-Key': API_KEY }});
            if (!response.ok) throw new Error('Помилка завантаження з хмари');
            const result = await response.json();
            const cloudSongs = result.record.songs;

            if (Array.isArray(cloudSongs)) {
                currentSongs = cloudSongs;
                localStorage.setItem('spotisanya_cache', JSON.stringify(currentSongs));
            }
        } catch (err) {
            console.warn('Використовуємо локальний кеш через помилку мережі:', err);
        }
        renderList();
        
        const savedIndex = localStorage.getItem('spotisanya_index');
        const savedTime = localStorage.getItem('spotisanya_time');
        if (savedIndex !== null && currentSongs[savedIndex]) {
            currentIndex = parseInt(savedIndex);
            const song = currentSongs[currentIndex];
            player.src = song.url;
            
            // Safe title update for mobile
            const titleSpan = currentSongTitle.querySelector('span') || currentSongTitle;
            titleSpan.textContent = song.title;

            renderList();
            if (savedTime !== null) {
                player.currentTime = parseFloat(savedTime);
            }
        }
    }

    function loadFromCache() {
        const cached = localStorage.getItem('spotisanya_cache');
        if (cached) {
            try { currentSongs = JSON.parse(cached); } catch(e) {}
        }
    }
    loadSongs();

    async function syncCloud() {
        localStorage.setItem('spotisanya_cache', JSON.stringify(currentSongs));
        try {
            await fetch(urlAPI, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify({ songs: currentSongs })
            });
        } catch(err) {
            console.error('Не вдалося синхронізувати з хмарою:', err);
        }
    }

    function renderList() {
        const list = document.getElementById('list');
        list.innerHTML = '';
        
        const filteredSongs = currentSongs.map((song, originalIndex) => ({ ...song, originalIndex }))
            .filter(song => song.title.toLowerCase().includes(searchQuery.toLowerCase()));

        if (filteredSongs.length === 0) {
            list.innerHTML = '<li style="color: var(--text-muted); justify-content: center; display: flex; text-align: center; padding: 24px; background: transparent; border: none;">Список порожній або нічого не знайдено</li>';
            return;
        }

        filteredSongs.forEach((song) => {
            const li = document.createElement('li');
            if (song.originalIndex === currentIndex) li.classList.add('active');

            li.innerHTML = `
                <span class="song-index">${song.originalIndex + 1}</span>
                <span class="song-name" title="${song.title}">${song.title}</span>
                <div class="action-btns">
                    <button class="action-btn" onclick="renameSong(event, ${song.originalIndex})" title="Редагувати">✏️</button>
                    <button class="action-btn del-btn" onclick="deleteSong(event, ${song.originalIndex})" title="Видалити">✕</button>
                </div>
            `;
            li.onclick = () => playSong(song.originalIndex);
            list.appendChild(li);
        });
    }

    searchInput.oninput = (e) => {
        searchQuery = e.target.value;
        renderList();
    };

    function updateMediaSession() {
        if ('mediaSession' in navigator && currentSongs.length > 0) {
            const song = currentSongs[currentIndex];
            
            navigator.mediaSession.metadata = new MediaMetadata({
                title: song.title,
                artist: 'SpotiSanya',
                album: 'My Playlist',
                artwork: [
                    { src: 'https://images.unsplash.com/photo-1614680376593-902f749f7ffc?w=512&h=512&fit=crop', sizes: '512x512', type: 'image/png' }
                ]
            });

            navigator.mediaSession.setActionHandler('play', () => { 
                player.play(); 
                playPauseBtn.textContent = '❚❚'; 
                vinylDisc.classList.add('playing');
            });
            navigator.mediaSession.setActionHandler('pause', () => { 
                player.pause(); 
                playPauseBtn.textContent = '▶'; 
                vinylDisc.classList.remove('playing');
            });
            navigator.mediaSession.setActionHandler('previoustrack', () => { 
                document.getElementById('prev-btn').click(); 
            });
            navigator.mediaSession.setActionHandler('nexttrack', () => { 
                document.getElementById('next-btn').click(); 
            });
        }
    }

    function playSong(index) {
        if (index < 0 || index >= currentSongs.length) return;

        currentIndex = index;
        const song = currentSongs[currentIndex];
        
        player.pause();
        player.src = song.url;
        player.load(); 
        
        initAudioContext();
        if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

        player.play().then(() => {
            playPauseBtn.textContent = '❚❚';
            vinylDisc.classList.add('playing');
        }).catch((err) => {
            console.warn("Автоматичне відтворення заблоковано:", err);
            playPauseBtn.textContent = '▶';
            vinylDisc.classList.remove('playing');
        });
        
        const titleSpan = currentSongTitle.querySelector('span') || currentSongTitle;
        titleSpan.textContent = song.title;

        localStorage.setItem('spotisanya_index', currentIndex);
        updateMediaSession();
        renderList();
    }

    playPauseBtn.onclick = () => {
        if (currentSongs.length === 0) return;

        initAudioContext();
        if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

        if (player.paused) {
            if (!player.src) playSong(0);
            else {
                player.play().then(() => { 
                    playPauseBtn.textContent = '❚❚'; 
                    vinylDisc.classList.add('playing');
                }).catch(() => {});
            }
        } else {
            player.pause();
            playPauseBtn.textContent = '▶';
            vinylDisc.classList.remove('playing');
        }
    };

    function getNextIndex() {
        if (currentSongs.length === 0) return 0;
        if (isShuffle) {
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * currentSongs.length);
            } while (randomIndex === currentIndex && currentSongs.length > 1);
            return randomIndex;
        } else {
            return (currentIndex + 1) % currentSongs.length;
        }
    }

    document.getElementById('next-btn').onclick = () => {
        if (currentSongs.length > 0) playSong(getNextIndex());
    };

    document.getElementById('prev-btn').onclick = () => {
        if (currentSongs.length > 0) {
            playSong((currentIndex - 1 + currentSongs.length) % currentSongs.length);
        }
    };

    repeatBtn.onclick = () => {
        isRepeat = !isRepeat;
        repeatBtn.classList.toggle('active-mode', isRepeat);
    };

    shuffleBtn.onclick = () => {
        isShuffle = !isShuffle;
        shuffleBtn.classList.toggle('active-mode', isShuffle);
    };

    player.ontimeupdate = () => {
        if (player.duration) {
            progressBar.style.width = ((player.currentTime / player.duration) * 100) + '%';
            localStorage.setItem('spotisanya_time', player.currentTime);
        }
    };

    progressContainer.onclick = (e) => {
        if (player.duration) {
            player.currentTime = (e.offsetX / progressContainer.clientWidth) * player.duration;
        }
    };

    player.onended = () => {
        if (currentSongs.length === 0) return;
        if (isRepeat) {
            playSong(currentIndex);
        } else {
            playSong(getNextIndex());
        }
    };

    document.getElementById('add-btn').onclick = async () => {
        const titleInput = document.getElementById('title');
        const urlInput = document.getElementById('url');
        const title = titleInput.value.trim();
        const url = urlInput.value.trim();

        if (!url) return alert('Введіть посилання!');

        if (!title) {
            currentSongs.push({ title: url.split('/').pop() || 'Трек', url });
        } else {
            currentSongs.push({ title, url });
        }

        titleInput.value = ''; 
        urlInput.value = '';
        renderList();
        await syncCloud();
    };

    const dropZoneEl = document.getElementById('drop-zone');
    dropZoneEl.ondragover = (e) => { e.preventDefault(); };
    dropZoneEl.ondrop = async (e) => {
        e.preventDefault();
        if (e.dataTransfer.files.length > 0) {
            const file = e.dataTransfer.files[0];
            if (file.type.includes('audio') || file.name.endsWith('.mp3')) {
                currentSongs.push({ title: file.name.replace(/\.[^/.]+$/, ""), url: URL.createObjectURL(file) });
                renderList();
                playSong(currentSongs.length - 1);
                await syncCloud();
            }
        }
    };

    const folderBtn = document.getElementById('folder-btn');
    const folderInput = document.getElementById('folder-input');
    folderBtn.onclick = () => folderInput.click();
    folderInput.onchange = async (e) => {
        let added = 0;
        for (let file of e.target.files) {
            if (file.name.endsWith('.mp3') || file.name.endsWith('.wav')) {
                currentSongs.push({ title: file.name.replace(/\.[^/.]+$/, ""), url: URL.createObjectURL(file) });
                added++;
            }
        }
        if (added > 0) {
            renderList();
            if (!player.src) playSong(currentSongs.length - added);
            await syncCloud();
        }
        folderInput.value = '';
    };

    async function renameSong(event, index) {
        event.stopPropagation();
        const newTitle = prompt("Нова назва:", currentSongs[index].title);
        if (!newTitle || !newTitle.trim()) return;
        currentSongs[index].title = newTitle.trim();
        renderList();
        if (index === currentIndex) {
            const titleSpan = currentSongTitle.querySelector('span') || currentSongTitle;
            titleSpan.textContent = newTitle.trim();
        }
        await syncCloud();
    }

    async function deleteSong(event, index) {
        event.stopPropagation();
        if (!confirm("Видалити трек?")) return;
        currentSongs.splice(index, 1);
        renderList();
        await syncCloud();
    }
</script>
</body>
</html>
