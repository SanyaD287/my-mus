<!DOCTYPE html>
<html lang="uk" data-theme="cyberpunk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpotiSanya Desktop</title>
    <style>
        :root {
            --accent: #ff1e2d;
            --accent-glow: rgba(255, 30, 45, 0.15);
            --bg-main: #050505;
            --bg-card: #121212;
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #777777;
        }

        [data-theme="cyberpunk"] {
            --accent: #00ff66;
            --accent-glow: rgba(0, 255, 102, 0.15);
            --bg-main: #020804;
            --bg-card: #0c160e;
            --border-color: rgba(0, 255, 102, 0.15);
        }

        [data-theme="neon"] {
            --accent: #b026ff;
            --accent-glow: rgba(176, 38, 255, 0.15);
            --bg-main: #06020a;
            --bg-card: #12081c;
            --border-color: rgba(176, 38, 255, 0.15);
        }

        [data-theme="spotify"] {
            --accent: #1db954;
            --accent-glow: rgba(29, 185, 84, 0.15);
            --bg-main: #121212;
            --bg-card: #181818;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 16px;
            height: 100%;
            overflow-y: auto;
            padding-right: 4px;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            gap: 16px;
            height: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            overflow: hidden;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }
        .logo span { color: var(--accent); }

        .card {
            background: var(--bg-card);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"] {
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-main);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            width: 100%;
        }
        input[type="text"]:focus { border-color: var(--accent); }

        button#add-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button#add-btn:hover { opacity: 0.9; }

        .drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: 10px;
            padding: 16px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
        }

        .playlist-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 4px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
            cursor: pointer;
            transition: background 0.2s;
        }
        li:hover { background: rgba(255, 255, 255, 0.05); }
        li.active {
            background: rgba(255, 255, 255, 0.08);
            border-left: 4px solid var(--accent);
        }
        li.active .song-name { color: var(--accent); font-weight: 700; }
        
        .song-name {
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            margin-right: 10px;
        }
        
        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 14px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .del-btn:hover { color: var(--accent); background: rgba(255,255,255,0.05); }

        /* Плеєр на ПК (знизу повної ширини або вбудований) */
        .desktop-player {
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .player-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 200px;
        }
        .current-title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }
        .current-artist { font-size: 12px; color: var(--text-muted); }

        .player-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            flex: 1;
            max-width: 500px;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .ctrl-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 16px;
            cursor: pointer;
            padding: 4px;
        }
        .ctrl-btn.active-mode { color: var(--accent); }
        .play-pause-btn {
            width: 36px;
            height: 36px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 14px;
        }

        .progress-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            font-size: 11px;
            color: var(--text-muted);
        }
        .progress-container {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }
        .progress-bar {
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            width: 0%;
        }

        .skin-btns { display: flex; gap: 6px; }
        .skin-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
        }
        .skin-btn:hover { border-color: var(--accent); }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="logo"><span>🔴</span> SpotiSanya Desktop</div>
    
    <div class="card">
        <div class="section-title">Тема оформлення</div>
        <div class="skin-btns">
            <button class="skin-btn" onclick="setTheme('cyberpunk')">Cyber</button>
            <button class="skin-btn" onclick="setTheme('neon')">Neon</button>
            <button class="skin-btn" onclick="setTheme('spotify')">Spotify</button>
        </div>
    </div>

    <div class="card">
        <div class="section-title">Додати трек</div>
        <input type="text" id="title" placeholder="Назва треку">
        <input type="text" id="url" placeholder="Посилання на MP3">
        <button id="add-btn">Додати в плейлист</button>
    </div>

    <div class="drop-zone" id="drop-zone">
        📥 Перетягніть сюди MP3 файли
    </div>
</div>

<div class="main-content">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <div class="section-title" style="font-size: 16px;">Плейлист хмари</div>
        <input type="text" id="search-input" placeholder="🔍 Пошук треків..." style="max-width: 250px;">
    </div>

    <div class="playlist-container">
        <ul id="list"></ul>
    </div>

    <!-- Десктопний плеєр -->
    <div class="desktop-player">
        <div class="player-left">
            <div>
                <div class="current-title" id="current-song-title">Нічого не вибрано</div>
                <div class="current-artist">Cloud Stream</div>
            </div>
        </div>

        <div class="player-center">
            <div class="player-controls">
                <button class="ctrl-btn" id="shuffle-btn" title="Shuffle">🔀</button>
                <button class="ctrl-btn" id="prev-btn">⏮</button>
                <button class="ctrl-btn play-pause-btn" id="play-pause-btn">▶</button>
                <button class="ctrl-btn" id="next-btn">⏭</button>
                <button class="ctrl-btn" id="loop-btn" title="Loop">🔁</button>
            </div>
            <div class="progress-wrapper">
                <span id="current-time">0:00</span>
                <div class="progress-container" id="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <span id="total-time">0:00</span>
            </div>
        </div>
    </div>
</div>

<audio id="player" preload="auto" crossorigin="anonymous"></audio>

<script>
    const BIN_ID = '6a7c3536da38895dfed9948e'; 
    const API_KEY = '$2a$10$RZSWlrF3nSMRAsv5Jlk1MOHs4qBWJ6ItuOqlU9rE1KSeii4Ck2XFu'; 
    const urlAPI = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    let currentSongs = [];
    let queue = [];
    let currentIndex = 0;
    let loopMode = 0; 
    let shuffleMode = false;
    let searchQuery = '';

    const player = document.getElementById('player');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const progressBar = document.getElementById('progress-bar');
    const progressContainer = document.getElementById('progress-container');
    const currentSongTitle = document.getElementById('current-song-title');
    const searchInput = document.getElementById('search-input');
    const loopBtn = document.getElementById('loop-btn');
    const shuffleBtn = document.getElementById('shuffle-btn');
    const currentTimeEl = document.getElementById('current-time');
    const totalTimeEl = document.getElementById('total-time');

    window.setTheme = (themeName) => {
        document.documentElement.setAttribute('data-theme', themeName);
        localStorage.setItem('spotisanya_theme', themeName);
    };
    const savedTheme = localStorage.getItem('spotisanya_theme');
    if (savedTheme) setTheme(savedTheme);

    function formatTime(seconds) {
        if (isNaN(seconds)) return "0:00";
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    async function loadSongs() {
        try {
            const response = await fetch(urlAPI, { headers: { 'X-Master-Key': API_KEY }});
            const result = await response.json();
            const cloudSongs = result.record.songs;

            if (Array.isArray(cloudSongs) && cloudSongs.length > 0) {
                currentSongs = cloudSongs;
                localStorage.setItem('spotisanya_cache', JSON.stringify(currentSongs));
            } else {
                const cached = localStorage.getItem('spotisanya_cache');
                if (cached) currentSongs = JSON.parse(cached);
            }
            renderList();
            restoreSavedPosition();
        } catch (err) {
            const cached = localStorage.getItem('spotisanya_cache');
            if (cached) {
                currentSongs = JSON.parse(cached);
                renderList();
                restoreSavedPosition();
            }
        }
    }

    function restoreSavedPosition() {
        const savedIndex = localStorage.getItem('spotisanya_last_index');
        const savedTime = localStorage.getItem('spotisanya_last_time');
        if (savedIndex !== null && currentSongs[savedIndex]) {
            currentIndex = parseInt(savedIndex);
            const song = currentSongs[currentIndex];
            player.src = song.url;
            currentSongTitle.textContent = song.title;
            if (savedTime) {
                player.currentTime = parseFloat(savedTime);
            }
            renderList();
        }
    }

    function saveState() {
        localStorage.setItem('spotisanya_last_index', currentIndex);
        localStorage.setItem('spotisanya_last_time', player.currentTime);
    }

    function renderList() {
        const list = document.getElementById('list');
        list.innerHTML = '';
        
        const filteredSongs = currentSongs.map((song, originalIndex) => ({ ...song, originalIndex }))
            .filter(song => song.title.toLowerCase().includes(searchQuery.toLowerCase()));

        if (filteredSongs.length === 0) {
            list.innerHTML = '<li style="color: var(--text-muted); justify-content: center; border:none; background:none; padding: 20px;">Нічого не знайдено</li>';
            return;
        }

        filteredSongs.forEach((song) => {
            const li = document.createElement('li');
            const isPlaying = song.originalIndex === currentIndex;
            if (isPlaying) li.classList.add('active');

            li.innerHTML = `
                <span class="song-name" title="${song.title}">${song.originalIndex + 1}. ${song.title}</span>
                <div class="action-btns">
                    <button class="action-btn del-btn" onclick="deleteSong(event, ${song.originalIndex})">✕</button>
                </div>
            `;
            li.onclick = () => playSong(song.originalIndex);
            list.appendChild(li);
        });
    }

    searchInput.oninput = (e) => {
        searchQuery = e.target.value;
        renderList();
    };

    function playSong(index) {
        if (index < 0 || index >= currentSongs.length) return;
        currentIndex = index;
        const song = currentSongs[currentIndex];
        
        player.src = song.url;
        player.load();
        player.play().then(() => {
            playPauseBtn.textContent = '❚❚';
        }).catch(e => {
            console.log("Playback error:", e);
        });
        
        currentSongTitle.textContent = song.title;
        renderList();
    }

    function getNextShuffleIndex() {
        if (currentSongs.length <= 1) return 0;
        let randomIndex;
        do {
            randomIndex = Math.floor(Math.random() * currentSongs.length);
        } while (randomIndex === currentIndex);
        return randomIndex;
    }

    function playNext() {
        if (queue.length > 0) {
            playSong(queue.shift());
            return;
        }
        if (shuffleMode) {
            playSong(getNextShuffleIndex());
            return;
        }
        if (currentSongs.length > 0) {
            playSong((currentIndex + 1) % currentSongs.length);
        }
    }

    function playPrev() {
        if (currentSongs.length > 0) {
            playSong((currentIndex - 1 + currentSongs.length) % currentSongs.length);
        }
    }

    playPauseBtn.onclick = () => {
        if (currentSongs.length === 0) return;
        if (player.paused) {
            if (!player.src) {
                playSong(0);
            } else {
                player.play().then(() => { playPauseBtn.textContent = '❚❚'; });
            }
        } else {
            player.pause();
            playPauseBtn.textContent = '▶';
        }
    };

    document.getElementById('next-btn').onclick = playNext;
    document.getElementById('prev-btn').onclick = playPrev;

    shuffleBtn.onclick = () => {
        shuffleMode = !shuffleMode;
        shuffleBtn.classList.toggle('active-mode', shuffleMode);
    };

    loopBtn.onclick = () => {
        loopMode = (loopMode + 1) % 3;
        loopBtn.classList.toggle('active-mode', loopMode > 0);
        loopBtn.textContent = loopMode === 2 ? '🔂' : '🔁';
    };

    player.ontimeupdate = () => {
        if (player.duration) {
            progressBar.style.width = ((player.currentTime / player.duration) * 100) + '%';
            currentTimeEl.textContent = formatTime(player.currentTime);
            totalTimeEl.textContent = formatTime(player.duration);
            saveState();
        }
    };

    progressContainer.onclick = (e) => {
        if (player.duration) {
            player.currentTime = (e.offsetX / progressContainer.clientWidth) * player.duration;
        }
    };

    player.onended = () => {
        if (loopMode === 2) {
            player.play();
        } else {
            playNext();
        }
    };

    async function deleteSong(event, index) {
        event.stopPropagation();
        try {
            const res = await fetch(urlAPI, { headers: { 'X-Master-Key': API_KEY }});
            const data = await res.json();
            let songs = data.record.songs || [];
            songs.splice(index, 1);
            
            await fetch(urlAPI, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify({ songs })
            });
            loadSongs();
        } catch (err) {
            alert('Помилка видалення');
        }
    }

    document.getElementById('add-btn').onclick = async () => {
        const title = document.getElementById('title').value.trim();
        const url = document.getElementById('url').value.trim();
        if (!title || !url) return alert('Заповніть поля!');
        
        try {
            const res = await fetch(urlAPI, { headers: { 'X-Master-Key': API_KEY }});
            const data = await res.json();
            const songs = data.record.songs || [];
            songs.push({ title, url });
            
            const updateRes = await fetch(urlAPI, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify({ songs })
            });

            if (updateRes.ok) {
                document.getElementById('title').value = '';
                document.getElementById('url').value = '';
                loadSongs();
            }
        } catch (err) {
            alert('Помилка збереження');
        }
    };

    loadSongs();
</script>
</body>
</html>
