<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpotiSanya</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .app-layout {
            display: grid;
            grid-template-columns: 240px 1fr;
            grid-template-rows: 1fr 90px;
            height: 100vh;
            width: 100vw;
        }

        .sidebar {
            background: #0a0a0a;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            grid-row: 1 / 2;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo span { color: #ff1e2d; }

        .main-content {
            padding: 24px 32px;
            overflow-y: auto;
            grid-column: 2 / 3;
            grid-row: 1 / 2;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .add-card {
            background: #121212;
            padding: 16px;
            border-radius: 12px;
            display: flex;
            gap: 12px;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        input[type="text"] {
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #1e1e1e;
            color: #fff;
            font-size: 14px;
            outline: none;
            flex: 1;
        }
        input[type="text"]:focus { border-color: #ff1e2d; }
        button#add-btn {
            background: #ff1e2d;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 500px;
            font-weight: 700;
            cursor: pointer;
        }
        button#add-btn:hover { filter: brightness(1.1); }

        .playlist-header {
            display: grid;
            grid-template-columns: 40px 1fr 75px;
            color: #777;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 0 16px 8px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 8px;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        li {
            display: grid;
            grid-template-columns: 40px 1fr 75px;
            align-items: center;
            padding: 10px 16px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.02);
            cursor: pointer;
            border: 1px solid transparent;
        }
        li:hover { background: rgba(255, 255, 255, 0.06); }
        li.active {
            background: rgba(255, 255, 255, 0.08);
            border-left: 4px solid #ff1e2d;
        }
        li.active .song-name { color: #ff1e2d; font-weight: 700; }
        .song-index { color: #666; font-size: 14px; }
        .song-name {
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
        }
        .action-btns {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
            align-items: center;
        }
        .del-btn, .edit-btn {
            background: transparent;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 13px;
            padding: 4px;
        }
        .del-btn:hover { color: #ff1e2d; }
        .edit-btn:hover { color: #fff; }

        .spotify-player-bar {
            grid-column: 1 / 3;
            grid-row: 2 / 3;
            background: #0c0c0c;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
        }
        .current-info {
            width: 30%;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .current-title {
            font-size: 14px;
            font-weight: 500;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .current-artist { font-size: 11px; color: #777; }

        .player-center-controls {
            width: 40%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .player-buttons {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .ctrl-btn {
            background: #1a1a1a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            cursor: pointer;
        }
        .ctrl-btn:hover { border-color: #ff1e2d; }
        .play-pause-btn {
            width: 44px;
            height: 44px;
            background: #ff1e2d;
            border: none;
            border-radius: 50%;
            font-size: 16px;
        }

        .progress-bar-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 400px;
        }
        .time-text { font-size: 11px; color: #777; min-width: 35px; text-align: center; }
        .progress-container {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }
        .progress-bar {
            height: 100%;
            background: #ff1e2d;
            border-radius: 2px;
            width: 0%;
        }

        .extra-controls {
            width: 30%;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
        }
        .volume-slider {
            width: 90px;
            height: 4px;
            accent-color: #ff1e2d;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            body { overflow-y: auto; }
            .app-layout { display: flex; flex-direction: column; height: auto; min-height: 100vh; }
            .sidebar { display: none; }
            .spotify-player-bar {
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                height: auto;
                flex-direction: column;
                padding: 12px;
                gap: 10px;
            }
            .current-info, .player-center-controls, .extra-controls { width: 100%; justify-content: center; }
            .main-content { padding: 16px; padding-bottom: 140px; }
        }
    </style>
</head>
<body>

<div class="app-layout">
    <div class="sidebar">
        <div class="logo"><span>🔴</span> Spotisanya</div>
        <div style="color: #777; font-size: 13px;">1.4v</div>
    </div>

    <div class="spotify-player-bar">
        <div class="current-info">
            <div style="width: 32px; height: 32px; background: #ff1e2d; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px;">🎵</div>
            <div>
                <div class="current-title" id="current-song-title">Нічого не вибрано</div>
                <div class="current-artist">Cloud Player</div>
            </div>
        </div>

        <div class="player-center-controls">
            <div class="player-buttons">
                <button class="ctrl-btn" id="prev-btn">⏮</button>
                <button class="ctrl-btn play-pause-btn" id="play-pause-btn">▶</button>
                <button class="ctrl-btn" id="next-btn">⏭</button>
            </div>
            <div class="progress-bar-wrapper">
                <span class="time-text" id="current-time">0:00</span>
                <div class="progress-container" id="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <span class="time-text" id="duration-time">0:00</span>
            </div>
        </div>

        <div class="extra-controls">
            <span style="font-size: 14px;">🔊</span>
            <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="1">
        </div>
    </div>

    <div class="main-content">
        <div class="section-title">Додати трек</div>
        <div class="add-card">
            <input type="text" id="title" placeholder="Назва треку">
            <input type="text" id="url" placeholder="Посилання на MP3">
            <button id="add-btn">Додати</button>
        </div>

        <div>
            <div class="section-title">Плейлист</div>
            <div class="playlist-header">
                <div>#</div>
                <div>Назва</div>
                <div style="text-align: right;">Дії</div>
            </div>
            <ul id="list"></ul>
        </div>
    </div>
</div>

<audio id="player" preload="auto"></audio>

<script>
    const BIN_ID = '6a7c3536da38895dfed9948e'; 
    const API_KEY = '$2a$10$RZSWlrF3nSMRAsv5Jlk1MOHs4qBWJ6ItuOqlU9rE1KSeii4Ck2XFu'; 
    const urlAPI = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    let currentSongs = [];
    let currentIndex = 0;
    const player = document.getElementById('player');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const progressBar = document.getElementById('progress-bar');
    const progressContainer = document.getElementById('progress-container');
    const currentSongTitle = document.getElementById('current-song-title');
    const currentTimeEl = document.getElementById('current-time');
    const durationTimeEl = document.getElementById('duration-time');
    const volumeSlider = document.getElementById('volume-slider');

    volumeSlider.oninput = (e) => { player.volume = e.target.value; };

    function formatTime(seconds) {
        if (isNaN(seconds)) return "0:00";
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    async function loadSongs() {
        try {
            const response = await fetch(urlAPI, { headers: { 'X-Master-Key': API_KEY }});
            const result = await response.json();
            const cloudSongs = result.record.songs;

            if (Array.isArray(cloudSongs) && cloudSongs.length > 0) {
                currentSongs = cloudSongs;
                localStorage.setItem('spotisanya_cache', JSON.stringify(currentSongs));
            } else {
                const cached = localStorage.getItem('spotisanya_cache');
                if (cached) currentSongs = JSON.parse(cached);
            }
            renderList();
        } catch (err) {
            const cached = localStorage.getItem('spotisanya_cache');
            if (cached) {
                currentSongs = JSON.parse(cached);
                renderList();
            }
        }
    }

    function renderList() {
        const list = document.getElementById('list');
        list.innerHTML = '';
        
        if (currentSongs.length === 0) {
            list.innerHTML = '<li style="color: #666; justify-content: center; cursor: default; display: block; text-align: center; padding: 20px;">Плейлист порожній</li>';
            return;
        }

        currentSongs.forEach((song, index) => {
            const li = document.createElement('li');
            if (index === currentIndex) li.classList.add('active');

            li.innerHTML = `
                <span class="song-index">${index + 1}</span>
                <span class="song-name" title="${song.title}">${song.title}</span>
                <div class="action-btns">
                    <button class="edit-btn" onclick="renameSong(event, ${index})" title="Змінити назву">✏️</button>
                    <button class="del-btn" onclick="deleteSong(event, ${index})" title="Видалити">✕</button>
                </div>
            `;
            li.onclick = () => playSong(index);
            list.appendChild(li);
        });
    }

    function setupMediaSession(songTitle) {
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: songTitle,
                artist: 'SpotiSanya Cloud Player',
                album: 'Cloud Playlist'
            });

            navigator.mediaSession.setActionHandler('play', () => { player.play(); playPauseBtn.textContent = '❚❚'; });
            navigator.mediaSession.setActionHandler('pause', () => { player.pause(); playPauseBtn.textContent = '▶'; });
            navigator.mediaSession.setActionHandler('previoustrack', () => {
                if (currentSongs.length > 0) playSong((currentIndex - 1 + currentSongs.length) % currentSongs.length);
            });
            navigator.mediaSession.setActionHandler('nexttrack', () => {
                if (currentSongs.length > 0) playSong((currentIndex + 1) % currentSongs.length);
            });
        }
    }

    function playSong(index) {
        if (index < 0 || index >= currentSongs.length) return;
        currentIndex = index;
        const song = currentSongs[currentIndex];
        
        player.src = song.url;
        player.load();
        player.play().then(() => {
            playPauseBtn.textContent = '❚❚';
            setupMediaSession(song.title);
        }).catch(e => {
            console.log("Потокове відтворення заблоковано браузером:", e);
        });
        
        currentSongTitle.textContent = song.title;
        renderList();
    }

    playPauseBtn.onclick = () => {
        if (currentSongs.length === 0) return;
        if (player.paused) {
            if (!player.src && currentSongs.length > 0) {
                playSong(0);
            } else {
                player.play().then(() => {
                    playPauseBtn.textContent = '❚❚';
                    if (currentSongs[currentIndex]) setupMediaSession(currentSongs[currentIndex].title);
                });
            }
        } else {
            player.pause();
            playPauseBtn.textContent = '▶';
        }
    };

    document.getElementById('next-btn').onclick = () => {
        if (currentSongs.length === 0) return;
        playSong((currentIndex + 1) % currentSongs.length);
    };

    document.getElementById('prev-btn').onclick = () => {
        if (currentSongs.length === 0) return;
        playSong((currentIndex - 1 + currentSongs.length) % currentSongs.length);
    };

    window.addEventListener('keydown', (e) => {
        if (document.activeElement.tagName === 'INPUT') return;

        if (e.code === 'MediaPlayPause' || e.code === 'Space') {
            e.preventDefault();
            playPauseBtn.click();
        } else if (e.code === 'MediaTrackNext' || (e.code === 'ArrowRight' && e.altKey)) {
            e.preventDefault();
            document.getElementById('next-btn').click();
        } else if (e.code === 'MediaTrackPrevious' || (e.code === 'ArrowLeft' && e.altKey)) {
            e.preventDefault();
            document.getElementById('prev-btn').click();
        }
    });

    player.ontimeupdate = () => {
        if (player.duration) {
            progressBar.style.width = ((player.currentTime / player.duration) * 100) + '%';
            currentTimeEl.textContent = formatTime(player.currentTime);
            durationTimeEl.textContent = formatTime(player.duration);
        }
    };

    progressContainer.onclick = (e) => {
        if (player.duration) {
            player.currentTime = (e.offsetX / progressContainer.clientWidth) * player.duration;
        }
    };

    player.onended = () => {
        if (currentSongs.length > 0) playSong((currentIndex + 1) % currentSongs.length);
    };

    async function renameSong(event, index) {
        event.stopPropagation();
        const currentSong = currentSongs[index];
        const newTitle = prompt("Введіть нову назву треку:", currentSong.title);
        if (!newTitle || !newTitle.trim()) return;

        try {
            const res = await fetch(urlAPI, { headers: { 'X-Master-Key': API_KEY }});
            const data = await res.json();
            let songs = data.record.songs || [];
            if (songs[index]) {
                songs[index].title = newTitle.trim();
            }
            
            await fetch(urlAPI, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify({ songs })
            });
            loadSongs();
        } catch (err) {
            alert('Помилка перейменування');
        }
    }

    async function deleteSong(event, index) {
        event.stopPropagation();
        try {
            const res = await fetch(urlAPI, { headers: { 'X-Master-Key': API_KEY }});
            const data = await res.json();
            let songs = data.record.songs || [];
            songs.splice(index, 1);
            
            await fetch(urlAPI, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify({ songs })
            });
            loadSongs();
        } catch (err) {
            alert('Помилка видалення');
        }
    }

    document.getElementById('add-btn').onclick = async () => {
        const title = document.getElementById('title').value.trim();
        const url = document.getElementById('url').value.trim();
        if (!title || !url) return alert('Заповніть поля!');
        
        try {
            const res = await fetch(urlAPI, { headers: { 'X-Master-Key': API_KEY }});
            const data = await res.json();
            const songs = data.record.songs || [];
            songs.push({ title, url });
            
            const updateRes = await fetch(urlAPI, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify({ songs })
            });

            if (updateRes.ok) {
                document.getElementById('title').value = '';
                document.getElementById('url').value = '';
                loadSongs();
            }
        } catch (err) {
            alert('Помилка збереження');
        }
    };

    loadSongs();
</script>
</body>
</html>
