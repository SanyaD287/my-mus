<!DOCTYPE html>
<html lang="uk" data-theme="cyberpunk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SpotiSanya Mobile</title>
    <style>
        :root {
            --accent: #00ff66;
            --accent-glow: rgba(0, 255, 102, 0.2);
            --bg-main: #020804;
            --bg-card: #0c160e;
            --border-color: rgba(0, 255, 102, 0.15);
            --text-main: #ffffff;
            --text-muted: #777777;
        }

        [data-theme="neon"] {
            --accent: #b026ff;
            --accent-glow: rgba(176, 38, 255, 0.2);
            --bg-main: #06020a;
            --bg-card: #12081c;
            --border-color: rgba(176, 38, 255, 0.15);
        }

        [data-theme="spotify"] {
            --accent: #1db954;
            --accent-glow: rgba(29, 185, 84, 0.2);
            --bg-main: #121212;
            --bg-card: #181818;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            padding-bottom: 220px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Верхня панель: Лого і Теми */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .logo span { color: var(--accent); }

        .skin-btns { display: flex; gap: 6px; }
        .skin-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }
        .skin-btn:active { color: var(--accent); border-color: var(--accent); }

        /* Пошук і Список треків */
        .card {
            background: var(--bg-card);
            padding: 14px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .search-box {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--bg-main);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }
        .search-box:focus { border-color: var(--accent); }

        .playlist-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 45vh;
            overflow-y: auto;
        }
        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
            cursor: pointer;
        }
        li.active {
            background: var(--accent-glow);
            border-color: var(--accent);
        }
        li.active .song-name { color: var(--accent); font-weight: 700; }
        .song-name {
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            margin-right: 10px;
        }
        .del-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 16px;
            padding: 4px;
            cursor: pointer;
        }
        .del-btn:active { color: var(--accent); }

        /* Фіксований мінімалістичний плеєр знизу */
        .mobile-player {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 100;
            backdrop-filter: blur(10px);
            box-shadow: 0 -10px 30px rgba(0,0,0,0.6);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }

        .song-info {
            text-align: center;
            overflow: hidden;
            padding: 0 10px;
        }
        .current-title {
            font-size: 15px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Зручна смуга перемотування */
        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }
        .progress-bar {
            height: 100%;
            background: var(--accent);
            border-radius: 3px;
            width: 0%;
            position: relative;
        }

        /* Кнопки керування */
        .player-controls {
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 10px;
        }
        .ctrl-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 22px;
            cursor: pointer;
            padding: 8px;
        }
        .ctrl-btn.active-mode { color: var(--accent); }
        .play-pause-btn {
            width: 56px;
            height: 56px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 20px;
            box-shadow: 0 4px 15px var(--accent-glow);
        }
    </style>
</head>
<body>

<div class="header">
    <div class="logo"><span>⚡</span> SpotiSanya</div>
    <div class="skin-btns">
        <button class="skin-btn" onclick="setTheme('cyberpunk')">Cyber</button>
        <button class="skin-btn" onclick="setTheme('neon')">Neon</button>
        <button class="skin-btn" onclick="setTheme('spotify')">Spotify</button>
    </div>
</div>

<div class="card">
    <div class="playlist-title">Пошук та Плейлист</div>
    <input type="text" id="search-input" class="search-box" placeholder="🔍 Знайти трек...">
    <ul id="list"></ul>
</div>

<!-- Мобільний плеєр -->
<div class="mobile-player">
    <div class="song-info">
        <div class="current-title" id="current-song-title">Оберіть трек</div>
    </div>

    <div class="progress-container" id="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="player-controls">
        <button class="ctrl-btn" id="shuffle-btn" title="Shuffle">🔀</button>
        <button class="ctrl-btn" id="prev-btn">⏮</button>
        <button class="ctrl-btn play-pause-btn" id="play-pause-btn">▶</button>
        <button class="ctrl-btn" id="next-btn">⏭</button>
        <button class="ctrl-btn" id="loop-btn" title="Loop">🔁</button>
    </div>
</div>

<audio id="player" preload="auto" crossorigin="anonymous"></audio>

<script>
    const BIN_ID = '6a7c3536da38895dfed9948e'; 
    const API_KEY = '$2a$10$RZSWlrF3nSMRAsv5Jlk1MOHs4qBWJ6ItuOqlU9rE1KSeii4Ck2XFu'; 
    const urlAPI = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    let currentSongs = [];
    let queue = [];
    let currentIndex = 0;
    let loopMode = 0; 
    let shuffleMode = false;
    let searchQuery = '';

    const player = document.getElementById('player');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const progressBar = document.getElementById('progress-bar');
    const progressContainer = document.getElementById('progress-container');
    const currentSongTitle = document.getElementById('current-song-title');
    const searchInput = document.getElementById('search-input');
    const loopBtn = document.getElementById('loop-btn');
    const shuffleBtn = document.getElementById('shuffle-btn');

    window.setTheme = (themeName) => {
        document.documentElement.setAttribute('data-theme', themeName);
        localStorage.setItem('spotisanya_theme', themeName);
    };
    const savedTheme = localStorage.getItem('spotisanya_theme');
    if (savedTheme) setTheme(savedTheme);

    async function loadSongs() {
        try {
            const response = await fetch(urlAPI, { headers: { 'X-Master-Key': API_KEY }});
            const result = await response.json();
            const cloudSongs = result.record.songs;

            if (Array.isArray(cloudSongs) && cloudSongs.length > 0) {
                currentSongs = cloudSongs;
                localStorage.setItem('spotisanya_cache', JSON.stringify(currentSongs));
            } else {
                const cached = localStorage.getItem('spotisanya_cache');
                if (cached) currentSongs = JSON.parse(cached);
            }
            renderList();
            restoreSavedPosition();
        } catch (err) {
            const cached = localStorage.getItem('spotisanya_cache');
            if (cached) {
                currentSongs = JSON.parse(cached);
                renderList();
                restoreSavedPosition();
            }
        }
    }

    function restoreSavedPosition() {
        const savedIndex = localStorage.getItem('spotisanya_last_index');
        const savedTime = localStorage.getItem('spotisanya_last_time');
        if (savedIndex !== null && currentSongs[savedIndex]) {
            currentIndex = parseInt(savedIndex);
            const song = currentSongs[currentIndex];
            player.src = song.url;
            currentSongTitle.textContent = song.title;
            if (savedTime) {
                player.currentTime = parseFloat(savedTime);
            }
            renderList();
        }
    }

    function saveState() {
        localStorage.setItem('spotisanya_last_index', currentIndex);
        localStorage.setItem('spotisanya_last_time', player.currentTime);
    }

    function renderList() {
        const list = document.getElementById('list');
        list.innerHTML = '';
        
        const filteredSongs = currentSongs.map((song, originalIndex) => ({ ...song, originalIndex }))
            .filter(song => song.title.toLowerCase().includes(searchQuery.toLowerCase()));

        if (filteredSongs.length === 0) {
            list.innerHTML = '<li style="color: var(--text-muted); justify-content: center; border:none; background:none; padding: 20px;">Нічого не знайдено</li>';
            return;
        }

        filteredSongs.forEach((song) => {
            const li = document.createElement('li');
            const isPlaying = song.originalIndex === currentIndex;
            if (isPlaying) li.classList.add('active');

            li.innerHTML = `
                <span class="song-name" title="${song.title}">${song.originalIndex + 1}. ${song.title}</span>
                <button class="del-btn" onclick="deleteSong(event, ${song.originalIndex})">✕</button>
            `;
            li.onclick = () => playSong(song.originalIndex);
            list.appendChild(li);
        });
    }

    searchInput.oninput = (e) => {
        searchQuery = e.target.value;
        renderList();
    };

    function updateMediaSession(title) {
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: title,
                artist: 'SpotiSanya Mobile',
                album: 'Cloud Stream'
            });

            navigator.mediaSession.setActionHandler('play', () => { player.play(); playPauseBtn.textContent = '❚❚'; });
            navigator.mediaSession.setActionHandler('pause', () => { player.pause(); playPauseBtn.textContent = '▶'; });
            navigator.mediaSession.setActionHandler('previoustrack', playPrev);
            navigator.mediaSession.setActionHandler('nexttrack', playNext);
        }
    }

    function playSong(index) {
        if (index < 0 || index >= currentSongs.length) return;
        currentIndex = index;
        const song = currentSongs[currentIndex];
        
        player.src = song.url;
        player.load();
        player.play().then(() => {
            playPauseBtn.textContent = '❚❚';
            updateMediaSession(song.title);
        }).catch(e => {
            console.log("Playback error:", e);
        });
        
        currentSongTitle.textContent = song.title;
        renderList();
    }

    function getNextShuffleIndex() {
        if (currentSongs.length <= 1) return 0;
        let randomIndex;
        do {
            randomIndex = Math.floor(Math.random() * currentSongs.length);
        } while (randomIndex === currentIndex);
        return randomIndex;
    }

    function playNext() {
        if (queue.length > 0) {
            playSong(queue.shift());
            return;
        }
        if (shuffleMode) {
            playSong(getNextShuffleIndex());
            return;
        }
        if (currentSongs.length > 0) {
            playSong((currentIndex + 1) % currentSongs.length);
        }
    }

    function playPrev() {
        if (currentSongs.length > 0) {
            playSong((currentIndex - 1 + currentSongs.length) % currentSongs.length);
        }
    }

    playPauseBtn.onclick = () => {
        if (currentSongs.length === 0) return;
        if (player.paused) {
            if (!player.src) {
                playSong(0);
            } else {
                player.play().then(() => { playPauseBtn.textContent = '❚❚'; });
            }
        } else {
            player.pause();
            playPauseBtn.textContent = '▶';
        }
    };

    document.getElementById('next-btn').onclick = playNext;
    document.getElementById('prev-btn').onclick = playPrev;

    shuffleBtn.onclick = () => {
        shuffleMode = !shuffleMode;
        shuffleBtn.classList.toggle('active-mode', shuffleMode);
    };

    loopBtn.onclick = () => {
        loopMode = (loopMode + 1) % 3;
        loopBtn.classList.toggle('active-mode', loopMode > 0);
        loopBtn.textContent = loopMode === 2 ? '🔂' : '🔁';
    };

    player.ontimeupdate = () => {
        if (player.duration) {
            progressBar.style.width = ((player.currentTime / player.duration) * 100) + '%';
            saveState();
        }
    };

    progressContainer.onclick = (e) => {
        if (player.duration) {
            player.currentTime = (e.offsetX / progressContainer.clientWidth) * player.duration;
        }
    };

    player.onended = () => {
        if (loopMode === 2) {
            player.play();
        } else {
            playNext();
        }
    };

    async function deleteSong(event, index) {
        event.stopPropagation();
        try {
            const res = await fetch(urlAPI, { headers: { 'X-Master-Key': API_KEY }});
            const data = await res.json();
            let songs = data.record.songs || [];
            songs.splice(index, 1);
            
            await fetch(urlAPI, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify({ songs })
            });
            loadSongs();
        } catch (err) {
            alert('Помилка видалення');
        }
    }

    loadSongs();
</script>
</body>
</html>
