<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SpotiSanya Mobile</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            padding: 16px 20px;
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0a0a0a;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .header span { color: #ff1e2d; }
        .version { font-size: 12px; color: #666; font-weight: normal; }

        .main-content {
            padding: 16px;
            padding-bottom: 180px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .search-box {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #151515;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .search-box:focus { border-color: #ff1e2d; }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            border-radius: 10px;
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.05);
            gap: 10px;
        }
        li.active {
            background: rgba(255, 30, 45, 0.1);
            border-color: #ff1e2d;
        }
        .song-info {
            flex: 1;
            overflow: hidden;
            cursor: pointer;
        }
        .song-name {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
        }
        li.active .song-name { color: #ff1e2d; font-weight: 700; }
        
        .del-btn {
            background: transparent;
            border: none;
            color: #666;
            font-size: 16px;
            padding: 8px;
            cursor: pointer;
        }
        .del-btn:active { color: #ff1e2d; }

        /* Фіксована панель плеєра внизу */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #0c0c0c;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
        }

        .track-title-bar {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
            color: #fff;
        }

        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }
        .progress-bar {
            height: 100%;
            background: #ff1e2d;
            border-radius: 3px;
            width: 0%;
        }

        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-around;
        }
        .ctrl-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            padding: 8px;
        }
        .play-btn {
            width: 50px;
            height: 50px;
            background: #ff1e2d;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
    </style>
</head>
<body>

<div class="header">
    <div><span>🔴</span> SpotiSanya</div>
    <div class="version">Mobile v1</div>
</div>

<div class="main-content">
    <input type="text" id="search-input" class="search-box" placeholder="🔍 Пошук треку...">
    <ul id="list"></ul>
</div>

<div class="player-bar">
    <div class="track-title-bar" id="current-song-title">Нічого не вибрано</div>
    <div class="progress-container" id="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div class="controls-row">
        <button class="ctrl-btn" id="prev-btn">⏮</button>
        <button class="ctrl-btn play-btn" id="play-pause-btn">▶</button>
        <button class="ctrl-btn" id="next-btn">⏭</button>
    </div>
</div>

<audio id="player" preload="auto"></audio>

<script>
    const BIN_ID = '6a7c3536da38895dfed9948e'; 
    const API_KEY = '$2a$10$RZSWlrF3nSMRAsv5Jlk1MOHs4qBWJ6ItuOqlU9rE1KSeii4Ck2XFu'; 
    const urlAPI = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    let currentSongs = [];
    let currentIndex = 0;
    let searchQuery = '';

    const player = document.getElementById('player');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const progressBar = document.getElementById('progress-bar');
    const progressContainer = document.getElementById('progress-container');
    const currentSongTitle = document.getElementById('current-song-title');
    const searchInput = document.getElementById('search-input');
    const listEl = document.getElementById('list');

    async function loadSongs() {
        try {
            const response = await fetch(urlAPI, { headers: { 'X-Master-Key': API_KEY }});
            const result = await response.json();
            currentSongs = result.record.songs || [];
            localStorage.setItem('spotisanya_cache', JSON.stringify(currentSongs));
        } catch (err) {
            const cached = localStorage.getItem('spotisanya_cache');
            if (cached) currentSongs = JSON.parse(cached);
        }
        renderList();
    }

    function renderList() {
        listEl.innerHTML = '';
        const filtered = currentSongs
            .map((song, idx) => ({ ...song, origIdx: idx }))
            .filter(song => song.title.toLowerCase().includes(searchQuery.toLowerCase()));

        if (filtered.length === 0) {
            listEl.innerHTML = '<li style="justify-content: center; color: #666;">Нічого не знайдено</li>';
            return;
        }

        filtered.forEach(song => {
            const li = document.createElement('li');
            if (song.origIdx === currentIndex) li.classList.add('active');

            li.innerHTML = `
                <div class="song-info" onclick="playSong(${song.origIdx})">
                    <div class="song-name">${song.title}</div>
                </div>
                <button class="del-btn" onclick="deleteSong(event, ${song.origIdx})">✕</button>
            `;
            listEl.appendChild(li);
        });
    }

    function setupMediaSession(title) {
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: title,
                artist: 'SpotiSanya',
                album: 'Cloud Playlist'
            });

            navigator.mediaSession.setActionHandler('play', () => { player.play(); playPauseBtn.textContent = '❚❚'; });
            navigator.mediaSession.setActionHandler('pause', () => { player.pause(); playPauseBtn.textContent = '▶'; });
            navigator.mediaSession.setActionHandler('previoustrack', playPrev);
            navigator.mediaSession.setActionHandler('nexttrack', playNext);
        }
    }

    function playSong(index) {
        if (index < 0 || index >= currentSongs.length) return;
        currentIndex = index;
        const song = currentSongs[currentIndex];

        player.src = song.url;
        player.play().then(() => {
            playPauseBtn.textContent = '❚❚';
            setupMediaSession(song.title);
        }).catch(e => console.log(e));

        currentSongTitle.textContent = song.title;
        renderList();
    }

    function playNext() {
        if (currentSongs.length > 0) {
            playSong((currentIndex + 1) % currentSongs.length);
        }
    }

    function playPrev() {
        if (currentSongs.length > 0) {
            playSong((currentIndex - 1 + currentSongs.length) % currentSongs.length);
        }
    }

    playPauseBtn.onclick = () => {
        if (currentSongs.length === 0) return;
        if (player.paused) {
            if (!player.src) {
                playSong(0);
            } else {
                player.play();
                playPauseBtn.textContent = '❚❚';
            }
        } else {
            player.pause();
            playPauseBtn.textContent = '▶';
        }
    };

    document.getElementById('next-btn').onclick = playNext;
    document.getElementById('prev-btn').onclick = playPrev;

    player.ontimeupdate = () => {
        if (player.duration) {
            progressBar.style.width = ((player.currentTime / player.duration) * 100) + '%';
        }
    };

    progressContainer.onclick = (e) => {
        if (player.duration) {
            const rect = progressContainer.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            player.currentTime = pos * player.duration;
        }
    };

    player.onended = playNext;

    searchInput.oninput = (e) => {
        searchQuery = e.target.value;
        renderList();
    };

    async function deleteSong(event, index) {
        event.stopPropagation();
        try {
            const res = await fetch(urlAPI, { headers: { 'X-Master-Key': API_KEY }});
            const data = await res.json();
            let songs = data.record.songs || [];
            songs.splice(index, 1);
            
            await fetch(urlAPI, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify({ songs })
            });
            loadSongs();
        } catch (err) {
            alert('Помилка видалення');
        }
    }

    loadSongs();
</script>
</body>
</html>
