<!DOCTYPE html>
<html lang="uk" data-theme="cyberpunk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SpotiSanya Mobile</title>
    <style>
        :root {
            --accent: #ff1e2d;
            --accent-glow: rgba(255, 30, 45, 0.15);
            --bg-main: #050505;
            --bg-card: #121212;
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #777777;
        }

        [data-theme="cyberpunk"] {
            --accent: #00ff66;
            --accent-glow: rgba(0, 255, 102, 0.15);
            --bg-main: #020804;
            --bg-card: #0c160e;
            --border-color: rgba(0, 255, 102, 0.15);
        }

        [data-theme="neon"] {
            --accent: #b026ff;
            --accent-glow: rgba(176, 38, 255, 0.15);
            --bg-main: #06020a;
            --bg-card: #12081c;
            --border-color: rgba(176, 38, 255, 0.15);
        }

        [data-theme="spotify"] {
            --accent: #1db954;
            --accent-glow: rgba(29, 185, 84, 0.15);
            --bg-main: #121212;
            --bg-card: #181818;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 12px;
            padding-bottom: 150px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 18px;
            font-weight: bold;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .logo span { color: var(--accent); }

        .skin-btns { display: flex; gap: 6px; }
        .skin-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 10px;
            cursor: pointer;
        }
        .skin-btn:hover { border-color: var(--accent); }

        .card {
            background: var(--bg-card);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        input[type="text"] {
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-main);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            width: 100%;
        }
        input[type="text"]:focus { border-color: var(--accent); }

        button#add-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
        }

        .drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
        }
        li.active {
            background: rgba(255, 255, 255, 0.06);
            border-left: 3px solid var(--accent);
        }
        li.active .song-name { color: var(--accent); font-weight: 700; }
        .song-name {
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            margin-right: 8px;
        }
        .action-btns { display: flex; gap: 8px; }
        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 14px;
            padding: 4px;
        }
        .del-btn:hover { color: var(--accent); }

        .mobile-player {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
        }

        .player-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .song-info {
            overflow: hidden;
            flex: 1;
            margin-right: 10px;
        }
        .current-title {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .current-artist {
            font-size: 11px;
            color: var(--text-muted);
        }

        .progress-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }
        .progress-bar {
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            width: 0%;
        }

        .player-controls {
            display: flex;
            align-items: center;
            justify-content: space-around;
        }
        .ctrl-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 18px;
            cursor: pointer;
            padding: 6px;
        }
        .ctrl-btn.active-mode { color: var(--accent); }
        .play-pause-btn {
            width: 44px;
            height: 44px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="logo"><span>🔴</span> SpotiSanya</div>
    <div class="skin-btns">
        <button class="skin-btn" onclick="setTheme('cyberpunk')">Cyber</button>
        <button class="skin-btn" onclick="setTheme('neon')">Neon</button>
        <button class="skin-btn" onclick="setTheme('spotify')">Spotify</button>
    </div>
</div>

<div class="card">
    <div class="section-title">Додати трек</div>
    <input type="text" id="title" placeholder="Назва треку">
    <input type="text" id="url" placeholder="Посилання на MP3">
    <button id="add-btn">Додати в плейлист</button>
</div>

<div class="drop-zone" id="drop-zone">
    📥 Або перетягніть сюди MP3 файли
</div>

<div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
        <div class="section-title" style="margin-bottom: 0;">Плейлист</div>
        <input type="text" id="search-input" placeholder="🔍 Пошук..." style="max-width: 140px; padding: 6px 10px; font-size: 12px;">
    </div>
    <ul id="list"></ul>
</div>

<div class="mobile-player">
    <div class="player-top">
        <div class="song-info">
            <div class="current-title" id="current-song-title">Нічого не вибрано</div>
            <div class="current-artist">SpotiSanya Mobile</div>
        </div>
    </div>

    <div class="progress-container" id="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="player-controls">
        <button class="ctrl-btn" id="shuffle-btn" title="Shuffle">🔀</button>
        <button class="ctrl-btn" id="prev-btn">⏮</button>
        <button class="ctrl-btn play-pause-btn" id="play-pause-btn">▶</button>
        <button class="ctrl-btn" id="next-btn">⏭</button>
        <button class="ctrl-btn" id="loop-btn" title="Loop">🔁</button>
    </div>
</div>

<audio id="player" preload="auto" crossorigin="anonymous"></audio>

<script>
    const BIN_ID = '6a7c3536da38895dfed9948e'; 
    const API_KEY = '$2a$10$RZSWlrF3nSMRAsv5Jlk1MOHs4qBWJ6ItuOqlU9rE1KSeii4Ck2XFu'; 
    const urlAPI = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    let currentSongs = [];
    let queue = [];
    let currentIndex = 0;
    let loopMode = 0; 
    let shuffleMode = false;
    let searchQuery = '';

    const player = document.getElementById('player');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const progressBar = document.getElementById('progress-bar');
    const progressContainer = document.getElementById('progress-container');
    const currentSongTitle = document.getElementById('current-song-title');
    const searchInput = document.getElementById('search-input');
    const loopBtn = document.getElementById('loop-btn');
    const shuffleBtn = document.getElementById('shuffle-btn');

    window.setTheme = (themeName) => {
        document.documentElement.setAttribute('data-theme', themeName);
        localStorage.setItem('spotisanya_theme', themeName);
    };
    const savedTheme = localStorage.getItem('spotisanya_theme');
    if (savedTheme) setTheme(savedTheme);

    async function loadSongs() {
        try {
            const response = await fetch(urlAPI, { headers: { 'X-Master-Key': API_KEY }});
            const result = await response.json();
            const cloudSongs = result.record.songs;

            if (Array.isArray(cloudSongs) && cloudSongs.length > 0) {
                currentSongs = cloudSongs;
                localStorage.setItem('spotisanya_cache', JSON.stringify(currentSongs));
            } else {
                const cached = localStorage.getItem('spotisanya_cache');
                if (cached) currentSongs = JSON.parse(cached);
            }
            renderList();
            restoreSavedPosition();
        } catch (err) {
            const cached = localStorage.getItem('spotisanya_cache');
            if (cached) {
                currentSongs = JSON.parse(cached);
                renderList();
                restoreSavedPosition();
            }
        }
    }

    function restoreSavedPosition() {
        const savedIndex = localStorage.getItem('spotisanya_last_index');
        const savedTime = localStorage.getItem('spotisanya_last_time');
        if (savedIndex !== null && currentSongs[savedIndex]) {
            currentIndex = parseInt(savedIndex);
            const song = currentSongs[currentIndex];
            player.src = song.url;
            currentSongTitle.textContent = song.title;
            if (savedTime) {
                player.currentTime = parseFloat(savedTime);
            }
            renderList();
        }
    }

    function saveState() {
        localStorage.setItem('spotisanya_last_index', currentIndex);
        localStorage.setItem('spotisanya_last_time', player.currentTime);
    }

    function renderList() {
        const list = document.getElementById('list');
        list.innerHTML = '';
        
        const filteredSongs = currentSongs.map((song, originalIndex) => ({ ...song, originalIndex }))
            .filter(song => song.title.toLowerCase().includes(searchQuery.toLowerCase()));

        if (filteredSongs.length === 0) {
            list.innerHTML = '<li style="color: var(--text-muted); justify-content: center; border:none; background:none; padding: 15px;">Нічого не знайдено</li>';
            return;
        }

        filteredSongs.forEach((song) => {
            const li = document.createElement('li');
            const isPlaying = song.originalIndex === currentIndex;
            if (isPlaying) li.classList.add('active');

            li.innerHTML = `
                <span class="song-name" title="${song.title}">${song.originalIndex + 1}. ${song.title}</span>
                <div class="action-btns">
                    <button class="action-btn del-btn" onclick="deleteSong(event, ${song.originalIndex})">✕</button>
                </div>
            `;
            li.onclick = () => playSong(song.originalIndex);
            list.appendChild(li);
        });
    }

    searchInput.oninput = (e) => {
        searchQuery = e.target.value;
        renderList();
    };

    function updateMediaSession(title) {
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: title,
                artist: 'SpotiSanya',
                album: 'Cloud Playlist',
                artwork: [
                    { src: 'https://cdn-icons-png.flaticon.com/512/3659/3659898.png', sizes: '96x96', type: 'image/png' },
                    { src: 'https://cdn-icons-png.flaticon.com/512/3659/3659898.png', sizes: '512x512', type: 'image/png' }
                ]
            });

            navigator.mediaSession.setActionHandler('play', () => {
                player.play();
                playPauseBtn.textContent = '❚❚';
            });
            navigator.mediaSession.setActionHandler('pause', () => {
                player.pause();
                playPauseBtn.textContent = '▶';
            });
            navigator.mediaSession.setActionHandler('previoustrack', () => {
                playPrev();
            });
            navigator.mediaSession.setActionHandler('nexttrack', () => {
                playNext();
            });
        }
    }

    function playSong(index) {
        if (index < 0 || index >= currentSongs.length) return;
        currentIndex = index;
        const song = currentSongs[currentIndex];
        
        player.src = song.url;
        player.load();
        player.play().then(() => {
            playPauseBtn.textContent = '❚❚';
            updateMediaSession(song.title);
        }).catch(e => {
            console.log("Playback error:", e);
        });
        
        currentSongTitle.textContent = song.title;
        renderList();
    }

    function getNextShuffleIndex() {
        if (currentSongs.length <= 1) return 0;
        let randomIndex;
        do {
            randomIndex = Math.floor(Math.random() * currentSongs.length);
        } while (randomIndex === currentIndex);
        return randomIndex;
    }

    function playNext() {
        if (queue.length > 0) {
            playSong(queue.shift());
            return;
        }
        if (shuffleMode) {
            playSong(getNextShuffleIndex());
            return;
        }
        if (currentSongs.length > 0) {
            playSong((currentIndex + 1) % currentSongs.length);
        }
    }

    function playPrev() {
        if (currentSongs.length > 0) {
            playSong((currentIndex - 1 + currentSongs.length) % currentSongs.length);
        }
    }

    playPauseBtn.onclick = () => {
        if (currentSongs.length === 0) return;
        if (player.paused) {
            if (!player.src) {
                playSong(0);
            } else {
                player.play().then(() => { playPauseBtn.textContent = '❚❚'; });
            }
        } else {
            player.pause();
            playPauseBtn.textContent = '▶';
        }
    };

    document.getElementById('next-btn').onclick = playNext;
    document.getElementById('prev-btn').onclick = playPrev;

    shuffleBtn.onclick = () => {
        shuffleMode = !shuffleMode;
        shuffleBtn.classList.toggle('active-mode', shuffleMode);
    };

    loopBtn.onclick = () => {
        loopMode = (loopMode + 1) % 3;
        loopBtn.classList.toggle('active-mode', loopMode > 0);
        loopBtn.textContent = loopMode === 2 ? '🔂' : '🔁';
    };

    player.ontimeupdate = () => {
        if (player.duration) {
            progressBar.style.width = ((player.currentTime / player.duration) * 100) + '%';
            saveState();
        }
    };

    progressContainer.onclick = (e) => {
        if (player.duration) {
            player.currentTime = (e.offsetX / progressContainer.clientWidth) * player.duration;
        }
    };

    player.onended = () => {
        if (loopMode === 2) {
            player.play();
        } else {
            playNext();
        }
    };

    async function deleteSong(event, index) {
        event.stopPropagation();
        try {
            const res = await fetch(urlAPI, { headers: { 'X-Master-Key': API_KEY }});
            const data = await res.json();
            let songs = data.record.songs || [];
            songs.splice(index, 1);
            
            await fetch(urlAPI, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify({ songs })
            });
            loadSongs();
        } catch (err) {
            alert('Помилка видалення');
        }
    }

    document.getElementById('add-btn').onclick = async () => {
        const title = document.getElementById('title').value.trim();
        const url = document.getElementById('url').value.trim();
        if (!title || !url) return alert('Заповніть поля!');
        
        try {
            const res = await fetch(urlAPI, { headers: { 'X-Master-Key': API_KEY }});
            const data = await res.json();
            const songs = data.record.songs || [];
            songs.push({ title, url });
            
            const updateRes = await fetch(urlAPI, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify({ songs })
            });

            if (updateRes.ok) {
                document.getElementById('title').value = '';
                document.getElementById('url').value = '';
                loadSongs();
            }
        } catch (err) {
            alert('Помилка збереження');
        }
    };

    loadSongs();
</script>
</body>
</html>
