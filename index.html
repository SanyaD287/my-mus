<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpotiSanya • v2</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

:root{
  --accent:#00ff88;
  --accent-2:#00b8ff;
  --accent-glow:rgba(0,255,136,.25);
  --accent-gradient:linear-gradient(135deg,#00ff88 0%,#00b8ff 100%);
  --bg-main:#070709;
  --bg-surface:rgba(18,18,24,.7);
  --bg-surface-hover:rgba(28,28,38,.85);
  --border-color:rgba(255,255,255,.06);
  --border-hover:rgba(0,255,136,.3);
  --text-main:#f3f4f6;
  --text-muted:#8b8d98;
  --danger:#ff4757;
  --blur-glass:blur(20px);
  --player-h:96px;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  background-color:var(--bg-main);
  background-image:
    radial-gradient(circle at 15% 15%,rgba(0,184,255,.08) 0%,transparent 40%),
    radial-gradient(circle at 85% 85%,rgba(0,255,136,.06) 0%,transparent 40%);
  color:var(--text-main);
  font-family:'Plus Jakarta Sans',sans-serif;
  height:100vh;
  overflow:hidden;
}

.app-layout{display:flex;flex-direction:column;height:100vh;width:100vw}
.body-row{display:flex;flex:1;min-height:0;padding-bottom:var(--player-h)}

/* ---------- Sidebar ---------- */
.sidebar{
  width:280px;flex-shrink:0;
  border-right:1px solid var(--border-color);
  background:rgba(12,12,16,.5);
  backdrop-filter:var(--blur-glass);
  display:flex;flex-direction:column;
  padding:24px 16px;gap:18px;overflow-y:auto;
}
.app-title{
  font-size:24px;font-weight:800;letter-spacing:-.5px;
  background:var(--accent-gradient);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  display:flex;align-items:center;gap:10px;padding:0 8px;
  filter:drop-shadow(0 0 25px rgba(0,255,136,.2));
}
.nav-group{display:flex;flex-direction:column;gap:4px}
.nav-label{
  font-size:10px;font-weight:800;color:var(--text-muted);
  text-transform:uppercase;letter-spacing:1.4px;padding:0 8px;margin-bottom:6px;
  display:flex;justify-content:space-between;align-items:center;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:10px;cursor:pointer;
  font-size:14px;font-weight:600;color:var(--text-muted);
  border:1px solid transparent;transition:all .2s;
  white-space:nowrap;overflow:hidden;
}
.nav-item:hover{background:rgba(255,255,255,.05);color:var(--text-main)}
.nav-item.active{background:rgba(0,255,136,.08);border-color:var(--border-hover);color:var(--accent)}
.nav-item .nav-name{flex:1;overflow:hidden;text-overflow:ellipsis}
.nav-item .nav-count{font-size:11px;opacity:.6;font-weight:700}
.nav-item .nav-edit{opacity:0;font-size:11px;padding:2px 4px;border-radius:5px}
.nav-item:hover .nav-edit{opacity:.55}
.nav-item .nav-edit:hover{opacity:1;background:rgba(255,255,255,.12)}
.nav-item.drag-over{border-color:var(--accent);background:rgba(0,255,136,.12)}

/* Sidebar Add Form Container */
.sidebar-add-box{
  background:rgba(255,255,255,.02);
  border:1px solid var(--border-color);
  border-radius:14px;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.sidebar-add-box:focus-within{
  border-color:var(--border-hover);
  background:rgba(255,255,255,.04);
}
.sidebar-add-box input[type=text]{
  width:100%;
  padding:10px 12px;
  border-radius:9px;
  border:1px solid var(--border-color);
  background:rgba(0,0,0,.3);
  color:var(--text-main);
  font-size:13px;
  font-family:inherit;
  outline:none;
  transition:all .25s cubic-bezier(.4,0,.2,1);
}
.sidebar-add-box input[type=text]:focus{
  border-color:var(--accent);
  background:rgba(0,0,0,.5);
  box-shadow:0 0 12px var(--accent-glow);
}
.sidebar-add-box input[type=text]::placeholder{color:#5c5e69}
.sidebar-add-btns{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}
.sidebar-add-btns button{
  padding:9px 10px;
  font-size:12px;
  border-radius:9px;
  text-align:center;
  justify-content:center;
  width:100%;
}
.sidebar-main-add{
  width:100%;
  padding:10px;
  font-size:13px;
  border-radius:9px;
  margin-top:2px;
}

/* ---------- Main ---------- */
.main-content{
  flex:1;min-width:0;overflow-y:auto;
  padding:36px 44px;display:flex;flex-direction:column;gap:26px;
}
.main-content::-webkit-scrollbar,.sidebar::-webkit-scrollbar{width:8px}
.main-content::-webkit-scrollbar-track,.sidebar::-webkit-scrollbar-track{background:transparent}
.main-content::-webkit-scrollbar-thumb,.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px}
.main-content::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2)}

.section-title{
  font-size:13px;font-weight:800;color:var(--text-muted);
  text-transform:uppercase;letter-spacing:1.2px;margin-bottom:10px;
}
.view-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.view-title{font-size:30px;font-weight:800;letter-spacing:-.8px}
.view-sub{font-size:13px;color:var(--text-muted);font-weight:600;margin-top:4px}

button{
  background:var(--accent-gradient);color:#070709;border:none;
  padding:13px 24px;border-radius:12px;font-weight:700;font-size:14px;font-family:inherit;
  cursor:pointer;box-shadow:0 4px 20px var(--accent-glow);
  transition:transform .2s cubic-bezier(.4,0,.2,1),filter .2s;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
button:hover{filter:brightness(1.15);transform:translateY(-2px)}
button:active{transform:translateY(0)}
.secondary-btn{background:rgba(255,255,255,.05);color:var(--text-main);border:1px solid var(--border-color);box-shadow:none}
.secondary-btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.15)}

.drop-zone{
  border:2px dashed rgba(255,255,255,.08);border-radius:18px;padding:20px;
  text-align:center;color:var(--text-muted);font-size:14px;font-weight:600;
  background:rgba(255,255,255,.01);transition:all .3s cubic-bezier(.4,0,.2,1);cursor:pointer;
}
.drop-zone:hover,.drop-zone.hot{
  border-color:var(--accent);background:rgba(0,255,136,.03);
  color:var(--text-main);box-shadow:inset 0 0 20px var(--accent-glow);
}

/* ---------- Track list ---------- */
.playlist-header{
  display:grid;grid-template-columns:44px 1fr 64px 132px;
  color:var(--text-muted);font-size:10px;font-weight:800;
  text-transform:uppercase;letter-spacing:1.5px;
  padding:0 18px 10px;border-bottom:1px solid var(--border-color);margin-bottom:8px;
}
ul{list-style:none;display:flex;flex-direction:column;gap:6px}
li.track{
  display:grid;grid-template-columns:44px 1fr 64px 132px;align-items:center;
  padding:12px 18px;border-radius:13px;background:var(--bg-surface);
  backdrop-filter:var(--blur-glass);cursor:pointer;
  border:1px solid var(--border-color);transition:all .22s cubic-bezier(.4,0,.2,1);
}
li.track:hover{background:var(--bg-surface-hover);border-color:rgba(255,255,255,.12);transform:translateX(4px)}
li.track.active{background:rgba(0,255,136,.07);border-color:var(--accent);box-shadow:0 0 25px rgba(0,255,136,.1)}
li.track.active .song-name{color:var(--accent);font-weight:700;text-shadow:0 0 10px var(--accent-glow)}
li.track.missing{opacity:.45}
li.track.missing .song-name{text-decoration:line-through}
li.empty{
  color:var(--text-muted);display:flex;justify-content:center;text-align:center;
  padding:34px;background:transparent;border:none;font-weight:600;
}
.song-index{color:var(--text-muted);font-size:13px;font-weight:700}
.song-name{
  font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;padding-right:14px;transition:color .2s;
}
.song-meta{font-size:11px;color:var(--text-muted);font-weight:600;margin-top:2px}
.song-kind{font-size:11px;color:var(--text-muted);font-weight:700;text-align:center}
.action-btns{display:flex;gap:4px;justify-content:flex-end;opacity:.35;transition:opacity .2s}
li.track:hover .action-btns,li.track.active .action-btns{opacity:1}
.action-btn{
  background:transparent;border:none;color:var(--text-muted);cursor:pointer;
  font-size:13px;padding:7px;border-radius:8px;box-shadow:none;
  transition:background .2s,color .2s,transform .2s;
}
.action-btn:hover{background:rgba(255,255,255,.1);color:var(--text-main);transform:none;filter:none}
.del-btn:hover{color:var(--danger)!important;background:rgba(255,71,87,.12)!important}

/* ---------- Player bar ---------- */
.player-bar{
  position:fixed;bottom:0;left:0;width:100%;height:var(--player-h);
  background:rgba(10,10,13,.85);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  border-top:1px solid var(--border-color);
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 40px;gap:22px;z-index:10;box-shadow:0 -20px 40px rgba(0,0,0,.6);
}
.current-info{width:24%;min-width:0}
.current-title{
  font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;letter-spacing:-.2px;
}
.current-sub{font-size:11px;color:var(--text-muted);font-weight:600;margin-top:3px}
.player-center{width:52%;display:flex;flex-direction:column;align-items:center;gap:8px}
.player-controls{display:flex;align-items:center;gap:18px}
.ctrl-btn{
  background:transparent;border:none;color:var(--text-muted);font-size:16px;
  cursor:pointer;padding:6px;box-shadow:none;transition:color .2s,transform .2s;
  position:relative;
}
.ctrl-btn:hover{color:var(--text-main);transform:scale(1.15);filter:none}
.ctrl-btn.active-mode{color:var(--accent);text-shadow:0 0 10px var(--accent-glow)}
.ctrl-btn .badge{
  position:absolute;bottom:-1px;right:0;font-size:8px;font-weight:900;
  background:var(--accent);color:#070709;border-radius:4px;padding:0 3px;line-height:1.4;
}
.play-pause-btn{
  width:44px;height:44px;background:var(--accent-gradient);border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:#070709;
  font-size:14px;font-weight:800;box-shadow:0 4px 20px var(--accent-glow);
  transition:transform .2s cubic-bezier(.4,0,.2,1),filter .2s;
}
.play-pause-btn:hover{filter:brightness(1.15);transform:scale(1.08)}

.progress-row{display:flex;align-items:center;gap:12px;width:100%;max-width:600px}
.time-label{font-size:11px;color:var(--text-muted);font-weight:700;font-variant-numeric:tabular-nums;min-width:38px}
.time-label.right{text-align:right}
.progress-container{
  flex:1;height:16px;display:flex;align-items:center;cursor:pointer;touch-action:none;
}
.progress-track{
  width:100%;height:6px;background:rgba(255,255,255,.08);border-radius:3px;
  position:relative;transition:height .15s;
}
.progress-container:hover .progress-track{height:8px}
.progress-bar{
  height:100%;background:var(--accent-gradient);border-radius:3px;width:0%;
  box-shadow:0 0 10px var(--accent-glow);position:relative;
}
.progress-knob{
  position:absolute;right:-6px;top:50%;transform:translateY(-50%);
  width:12px;height:12px;border-radius:50%;background:#fff;
  opacity:0;transition:opacity .15s;box-shadow:0 0 8px rgba(0,0,0,.6);
}
.progress-container:hover .progress-knob{opacity:1}

.volume-wrapper{width:24%;display:flex;justify-content:flex-end;align-items:center;gap:10px;color:var(--text-muted)}
.vol-icon{background:transparent;border:none;box-shadow:none;color:var(--text-muted);cursor:pointer;font-size:15px;padding:4px}
.vol-icon:hover{color:var(--text-main);transform:none;filter:none}
.volume-slider{width:104px;height:4px;accent-color:var(--accent);cursor:pointer}

/* ---------- Modal ---------- */
.modal-back{
  position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);
  z-index:100;display:none;align-items:center;justify-content:center;padding:20px;
}
.modal-back.open{display:flex}
.modal{
  background:#111116;border:1px solid var(--border-color);border-radius:20px;
  padding:26px;width:100%;max-width:420px;box-shadow:0 30px 80px rgba(0,0,0,.7);
  display:flex;flex-direction:column;gap:16px;max-height:80vh;
}
.modal h3{font-size:18px;font-weight:800;letter-spacing:-.3px}
.modal .sub{font-size:12px;color:var(--text-muted);font-weight:600;margin-top:-8px}
.modal-list{display:flex;flex-direction:column;gap:6px;overflow-y:auto;max-height:38vh}
.modal-row{
  display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:11px;
  background:rgba(255,255,255,.03);border:1px solid var(--border-color);
  cursor:pointer;font-size:14px;font-weight:600;transition:all .2s;
}
.modal-row:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15)}
.modal-row.in{border-color:var(--border-hover);color:var(--accent)}
.modal-row .rname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal-actions{display:flex;gap:10px;justify-content:flex-end}
.modal-actions button{padding:11px 20px;font-size:13px}
.danger-btn{background:rgba(255,71,87,.15);color:#ff8a94;border:1px solid rgba(255,71,87,.3);box-shadow:none}
.danger-btn:hover{background:rgba(255,71,87,.25)}

/* ---------- Toast ---------- */
.toast-wrap{position:fixed;bottom:calc(var(--player-h) + 20px);left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  background:rgba(20,20,26,.95);border:1px solid var(--border-color);
  padding:12px 20px;border-radius:12px;font-size:13px;font-weight:600;
  box-shadow:0 12px 30px rgba(0,0,0,.6);animation:pop .25s cubic-bezier(.4,0,.2,1);
  max-width:min(90vw,460px);
}
.toast.err{border-color:rgba(255,71,87,.4);color:#ff8a94}
.toast.ok{border-color:var(--border-hover);color:var(--accent)}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.cloud-dot{width:7px;height:7px;border-radius:50%;background:#4b4d57;flex-shrink:0;transition:background .3s}
.cloud-dot.ok{background:var(--accent);box-shadow:0 0 8px var(--accent-glow)}
.cloud-dot.err{background:var(--danger)}
.cloud-dot.sync{background:#ffc048}

.menu-toggle{display:none}

@media (max-width:900px){
  :root{--player-h:150px}
  .menu-toggle{display:flex;position:fixed;top:14px;left:14px;z-index:60;padding:10px 14px;font-size:16px}
  .sidebar{
    position:fixed;top:0;left:0;bottom:0;z-index:50;width:280px;
    transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
    background:#0b0b0f;
  }
  .sidebar.open{transform:none;box-shadow:30px 0 60px rgba(0,0,0,.7)}
  .main-content{padding:70px 20px 20px}
  .player-bar{flex-direction:column;gap:10px;padding:14px 20px;height:auto}
  .current-info,.player-center,.volume-wrapper{width:100%;justify-content:center;text-align:center}
  .playlist-header,li.track{grid-template-columns:32px 1fr 108px}
  .song-kind{display:none}
}
</style>
</head>
<body>

<button class="menu-toggle secondary-btn" id="menu-toggle" aria-label="Меню">☰</button>

<div class="app-layout">
  <div class="body-row">

    <aside class="sidebar" id="sidebar">
      <div class="app-title">⚡ SpotiSanya</div>

      <div class="nav-group">
        <div class="nav-label">Бібліотека</div>
        <div class="nav-item" data-view="all">
          <span>🎵</span>
          <span class="nav-name">Усі треки</span>
          <span class="nav-count" id="count-all">0</span>
        </div>
      </div>

      <div class="nav-group">
        <div class="nav-label">Додати трек</div>
        <div class="sidebar-add-box">
          <input type="text" id="title" placeholder="Назва треку...">
          <input type="text" id="url" placeholder="Посилання на MP3...">
          <button id="add-btn" class="sidebar-main-add">Додати лінк</button>
          <div class="sidebar-add-btns">
            <button id="file-btn" class="secondary-btn">🎧 Файли</button>
            <button id="folder-btn" class="secondary-btn">📂 Папка</button>
          </div>
          <input type="file" id="folder-input" webkitdirectory directory multiple accept="audio/*" style="display:none">
          <input type="file" id="file-input" multiple accept="audio/*" style="display:none">
        </div>
      </div>

      <div class="nav-group">
        <div class="nav-label">
          <span>Плейлисти</span>
          <span class="cloud-dot" id="cloud-dot" title="Стан синхронізації"></span>
        </div>
        <div id="playlist-nav"></div>
        <div class="nav-item" id="new-playlist-btn" style="margin-top:6px">
          <span>＋</span><span class="nav-name">Новий плейлист</span>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <div class="view-head">
        <div>
          <div class="view-title" id="view-title">Усі треки</div>
          <div class="view-sub" id="view-sub">0 треків</div>
        </div>
        <div style="display:flex;gap:10px;align-items:center">
          <input type="text" id="search-input" placeholder="🔍 Пошук..." style="max-width:220px;padding:10px 15px;font-size:13px;border-radius:11px;border:1px solid var(--border-color);background:rgba(0,0,0,.3);color:var(--text-main);outline:none;">
          <button class="secondary-btn" id="play-view-btn" style="padding:10px 18px;font-size:13px">▶ Грати все</button>
        </div>
      </div>

      <div class="drop-zone" id="drop-zone">
        📥 Перетягніть аудіофайли сюди (зберігаються у браузері й працюють офлайн)
      </div>

      <div>
        <div class="playlist-header">
          <div>#</div>
          <div>Назва треку</div>
          <div style="text-align:center" class="song-kind">Тип</div>
          <div style="text-align:right">Дії</div>
        </div>
        <ul id="list"></ul>
      </div>
    </main>
  </div>

  <div class="player-bar">
    <div class="current-info">
      <div class="current-title" id="current-song-title">Нічого не грає</div>
      <div class="current-sub" id="current-song-sub">Оберіть трек зі списку</div>
    </div>

    <div class="player-center">
      <div class="player-controls">
        <button class="ctrl-btn" id="shuffle-btn" title="Випадковий порядок (S)">🔀</button>
        <button class="ctrl-btn" id="prev-btn" title="Попередній (←)">⏮</button>
        <button class="ctrl-btn play-pause-btn" id="play-pause-btn" title="Грати / Пауза (Space)">▶</button>
        <button class="ctrl-btn" id="next-btn" title="Наступний (→)">⏭</button>
        <button class="ctrl-btn" id="repeat-btn" title="Повтор (R)">🔁</button>
      </div>
      <div class="progress-row">
        <span class="time-label" id="time-cur">0:00</span>
        <div class="progress-container" id="progress-container">
          <div class="progress-track">
            <div class="progress-bar" id="progress-bar"><div class="progress-knob"></div></div>
          </div>
        </div>
        <span class="time-label right" id="time-dur">0:00</span>
      </div>
    </div>

    <div class="volume-wrapper">
      <button class="vol-icon" id="mute-btn" title="Без звуку (M)">🔊</button>
      <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="1">
    </div>
  </div>
</div>

<audio id="player" preload="metadata" playsinline></audio>

<div class="modal-back" id="modal-back">
  <div class="modal" id="modal"></div>
</div>

<div class="toast-wrap" id="toast-wrap"></div>
<script>
"use strict";

/* =========================================================
   1. CONFIG
   ========================================================= */
const CLOUD = {
  enabled: true,
  binId: "6a7c3536da38895dfed9948e",
  key: "$2a$10$RZSWlrF3nSMRAsv5Jlk1MOHs4qBWJ6ItuOqlU9rE1KSeii4Ck2XFu",
  get url() { return "https://api.jsonbin.io/v3/b/" + this.binId; }
};
if (!CLOUD.key || CLOUD.key.startsWith("PUT_YOUR")) CLOUD.enabled = false;

const LS_STATE  = "spotisanya_state_v2";
const LS_VOLUME = "spotisanya_volume";
const LS_MODES  = "spotisanya_modes";

/* =========================================================
   2. STATE
   ========================================================= */
let state = { version: 2, tracks: [], playlists: [] };

let view           = { type: "all", id: null };
let queue          = [];
let queuePos       = -1;
let currentTrackId = null;
let searchQuery    = "";
let isShuffle      = false;
let repeatMode     = 0;
let isSeeking      = false;

const blobUrls = new Map();
const missing  = new Set();

/* =========================================================
   3. HELPERS
   ========================================================= */
const $ = (id) => document.getElementById(id);

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);

function fmtTime(sec) {
  if (!isFinite(sec) || sec < 0) return "0:00";
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return m + ":" + String(s).padStart(2, "0");
}

function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function toast(msg, type) {
  const wrap = $("toast-wrap");
  const el = document.createElement("div");
  el.className = "toast" + (type ? " " + type : "");
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => {
    el.style.transition = "opacity .3s";
    el.style.opacity = "0";
    setTimeout(() => el.remove(), 300);
  }, 2600);
}

const trackById   = (id) => state.tracks.find((t) => t.id === id) || null;
const playlistById = (id) => state.playlists.find((p) => p.id === id) || null;

/* =========================================================
   4. INDEXEDDB
   ========================================================= */
const DB_NAME = "spotisanya", DB_STORE = "files";
let dbPromise = null;
let idbOK = true;

function db() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((res, rej) => {
    if (!window.indexedDB) { idbOK = false; return rej(new Error("no indexedDB")); }
    let rq;
    try { rq = indexedDB.open(DB_NAME, 1); }
    catch (e) { idbOK = false; return rej(e); }
    rq.onupgradeneeded = () => {
      if (!rq.result.objectStoreNames.contains(DB_STORE)) rq.result.createObjectStore(DB_STORE);
    };
    rq.onsuccess = () => res(rq.result);
    rq.onerror   = () => { idbOK = false; rej(rq.error); };
    rq.onblocked = () => { idbOK = false; rej(new Error("blocked")); };
  });
  return dbPromise;
}

async function idbPut(key, blob) {
  const d = await db();
  return new Promise((res, rej) => {
    const tx = d.transaction(DB_STORE, "readwrite");
    tx.objectStore(DB_STORE).put(blob, key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
async function idbGet(key) {
  let d; try { d = await db(); } catch (e) { return null; }
  return new Promise((res, rej) => {
    const tx = d.transaction(DB_STORE, "readonly");
    const rq = tx.objectStore(DB_STORE).get(key);
    rq.onsuccess = () => res(rq.result || null);
    rq.onerror = () => rej(rq.error);
  });
}
async function idbDel(key) {
  let d; try { d = await db(); } catch (e) { return; }
  return new Promise((res) => {
    const tx = d.transaction(DB_STORE, "readwrite");
    tx.objectStore(DB_STORE).delete(key);
    tx.oncomplete = () => res();
    tx.onerror = () => res();
  });
}
async function idbKeys() {
  let d; try { d = await db(); } catch (e) { return []; }
  return new Promise((res) => {
    const tx = d.transaction(DB_STORE, "readonly");
    const rq = tx.objectStore(DB_STORE).getAllKeys();
    rq.onsuccess = () => res(rq.result || []);
    rq.onerror = () => res([]);
  });
}

async function resolveUrl(track) {
  if (!track) return null;
  if (track.kind === "link") return track.url || null;
  if (blobUrls.has(track.id)) return blobUrls.get(track.id);
  const blob = await idbGet(track.id);
  if (!blob) { missing.add(track.id); return null; }
  const u = URL.createObjectURL(blob);
  blobUrls.set(track.id, u);
  missing.delete(track.id);
  return u;
}

/* =========================================================
   5. PERSISTENCE
   ========================================================= */
function saveLocal() {
  try { localStorage.setItem(LS_STATE, JSON.stringify(state)); } catch (e) {}
}

function setDot(cls) {
  const d = $("cloud-dot");
  if (!d) return;
  d.className = "cloud-dot" + (cls ? " " + cls : "");
  d.title = { ok: "Синхронізовано", err: "Помилка синхронізації", sync: "Синхронізація..." }[cls] || "Локально";
}

let syncTimer = null;
function persist() {
  saveLocal();
  renderAll();
  if (!CLOUD.enabled) return;
  setDot("sync");
  clearTimeout(syncTimer);
  syncTimer = setTimeout(pushCloud, 900);
}

async function pushCloud() {
  if (!CLOUD.enabled) return;
  try {
    const payload = {
      version: 2,
      playlists: state.playlists,
      tracks: state.tracks
        .filter((t) => !t.session)
        .map((t) => t.kind === "local" ? { ...t, url: null } : t)
    };
    const r = await fetch(CLOUD.url, {
      method: "PUT",
      headers: { "Content-Type": "application/json", "X-Master-Key": CLOUD.key },
      body: JSON.stringify(payload)
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    setDot("ok");
  } catch (err) {
    console.error("Хмара недоступна:", err);
    setDot("err");
  }
}

function migrate(raw) {
  if (!raw || typeof raw !== "object") return null;
  if (raw.version === 2 && Array.isArray(raw.tracks)) {
    return {
      version: 2,
      tracks: raw.tracks.filter((t) => t && t.id && t.title),
      playlists: (Array.isArray(raw.playlists) ? raw.playlists : [])
        .filter((p) => p && p.id && p.name)
        .map((p) => ({ id: p.id, name: p.name, trackIds: Array.isArray(p.trackIds) ? p.trackIds : [] }))
    };
  }
  const old = Array.isArray(raw.songs) ? raw.songs : (Array.isArray(raw) ? raw : null);
  if (!old) return null;
  return {
    version: 2,
    playlists: [],
    tracks: old
      .filter((s) => s && s.url && !String(s.url).startsWith("blob:"))
      .map((s) => ({ id: uid(), title: s.title || "Трек", url: s.url, kind: "link" }))
  };
}

async function boot() {
  let loaded = false;

  const cached = localStorage.getItem(LS_STATE);
  if (cached) {
    try {
      const m = migrate(JSON.parse(cached));
      if (m) { state = m; loaded = true; }
    } catch (e) { console.warn("Кеш v2 битий:", e); }
  }

  if (!loaded) {
    const legacy = localStorage.getItem("spotisanya_cache");
    if (legacy) {
      try {
        const m = migrate(JSON.parse(legacy));
        if (m && m.tracks.length) {
          state = m;
          loaded = true;
          saveLocal();
          setTimeout(() => toast("Перенесено " + m.tracks.length + " трек(ів) зі старої версії", "ok"), 400);
        }
      } catch (e) { console.warn("Легасі-кеш битий:", e); }
    }
  }

  renderAll();

  if (CLOUD.enabled) {
    setDot("sync");
    try {
      const r = await fetch(CLOUD.url + "/latest", { headers: { "X-Master-Key": CLOUD.key } });
      if (!r.ok) throw new Error("HTTP " + r.status + " " + r.statusText);
      const j = await r.json();
      const m = migrate(j.record);
      if (m && (m.tracks.length || m.playlists.length)) {
        state = m;
        saveLocal();
      } else if (loaded) {
        pushCloud();
      }
      setDot("ok");
    } catch (err) {
      console.error("Хмара недоступна:", err);
      setDot("err");
      toast("Не вдалося прочитати хмару: " + err.message, "err");
    }
  } else {
    setDot("");
  }

  const keys = new Set(await idbKeys());
  state.tracks.forEach((t) => { if (t.kind === "local" && !keys.has(t.id)) missing.add(t.id); });

  renderAll();
}

/* =========================================================
   6. VIEWS & RENDER
   ========================================================= */
function viewTracks() {
  if (view.type === "playlist") {
    const p = playlistById(view.id);
    if (!p) { view = { type: "all", id: null }; return state.tracks.slice(); }
    return p.trackIds.map(trackById).filter(Boolean);
  }
  return state.tracks.slice();
}

function visibleTracks() {
  const q = searchQuery.trim().toLowerCase();
  const list = viewTracks();
  return q ? list.filter((t) => t.title.toLowerCase().includes(q)) : list;
}

function renderSidebar() {
  $("count-all").textContent = state.tracks.length;

  document.querySelectorAll('.nav-item[data-view="all"]').forEach((el) =>
    el.classList.toggle("active", view.type === "all"));

  const nav = $("playlist-nav");
  nav.innerHTML = state.playlists.map((p) => `
    <div class="nav-item${view.type === "playlist" && view.id === p.id ? " active" : ""}"
         data-view="playlist" data-id="${esc(p.id)}" title="${esc(p.name)}">
      <span>📁</span>
      <span class="nav-name">${esc(p.name)}</span>
      <span class="nav-count">${p.trackIds.length}</span>
      <span class="nav-edit action-btn" data-act="pl-menu" data-id="${esc(p.id)}" title="Налаштування">⋯</span>
    </div>`).join("") ||
    `<div style="padding:6px 12px;font-size:12px;color:var(--text-muted);font-weight:600">Ще немає плейлистів</div>`;
}

function renderHeader() {
  const inPl = view.type === "playlist";
  const p = inPl ? playlistById(view.id) : null;
  $("view-title").textContent = p ? p.name : "Усі треки";
  const n = viewTracks().length;
  const word = n % 10 === 1 && n % 100 !== 11 ? "трек" : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? "треки" : "треків");
  $("view-sub").textContent = n + " " + word + (inPl ? " у цьому плейлисті" : " у бібліотеці");
}

function renderList() {
  const ul = $("list");
  const list = visibleTracks();
  const inPl = view.type === "playlist";

  if (!list.length) {
    let msg;
    if (searchQuery) msg = "Нічого не знайдено за запитом «" + esc(searchQuery) + "»";
    else if (view.type === "playlist") msg = "Плейлист порожній.<br>Перетягніть сюди треки або додайте в меню ліворуч.";
    else if (!CLOUD.enabled) msg = "Бібліотека порожня.<br><span style=\"font-size:12px;opacity:.8\">Додайте треки кнопками зліва.</span>";
    else msg = "Бібліотека порожня — додайте трек або перетягніть файли";
    ul.innerHTML = `<li class="empty"><div>${msg}</div></li>`;
    return;
  }

  ul.innerHTML = list.map((t, i) => {
    const isMissing = t.kind === "local" && missing.has(t.id);
    return `
    <li class="track${t.id === currentTrackId ? " active" : ""}${isMissing ? " missing" : ""}" data-id="${esc(t.id)}">
      <span class="song-index">${i + 1}</span>
      <div style="min-width:0">
        <div class="song-name" title="${esc(t.title)}">${esc(t.title)}</div>
        ${isMissing ? `<div class="song-meta">⚠ файл недоступний у цьому браузері</div>` : ""}
      </div>
      <span class="song-kind">${t.kind === "local" ? "💾 файл" : "🔗 лінк"}</span>
      <div class="action-btns">
        <button class="action-btn" data-act="addto" data-id="${esc(t.id)}" title="Додати в плейлист">➕</button>
        <button class="action-btn" data-act="rename" data-id="${esc(t.id)}" title="Перейменувати">✏️</button>
        ${inPl ? `<button class="action-btn del-btn" data-act="rmfrompl" data-id="${esc(t.id)}" title="Видалити з плейлиста">✕</button>` : `<button class="action-btn del-btn" data-act="del" data-id="${esc(t.id)}" title="Видалити з бібліотеки">🗑</button>`}
      </div>
    </li>`;
  }).join("");
}

function renderAll() {
  renderSidebar();
  renderHeader();
  renderList();
}

/* =========================================================
   7. PLAYER & QUEUE LOGIC
   ========================================================= */
const audio = $("player");

async function playTrack(id) {
  const t = trackById(id);
  if (!t) return;
  const url = await resolveUrl(t);
  if (!url) {
    toast("Файл треку недоступний", "err");
    renderList();
    return;
  }

  currentTrackId = id;
  audio.src = url;
  audio.play().catch((err) => {
    console.error("Помилка відтворення:", err);
    toast("Не вдалося відтворити трек", "err");
  });

  const list = visibleTracks();
  const idx = list.findIndex((item) => item.id === id);
  if (idx !== -1) queuePos = idx;
  queue = list.map((item) => item.id);

  $("current-song-title").textContent = t.title;
  $("current-song-sub").textContent = t.kind === "local" ? "Локальний файл" : "Пряме посилання";
  $("play-pause-btn").textContent = "⏸";

  renderList();
}

function togglePlay() {
  if (!currentTrackId) {
    const list = visibleTracks();
    if (list.length) playTrack(list[0].id);
    return;
  }
  if (audio.paused) {
    audio.play();
    $("play-pause-btn").textContent = "⏸";
  } else {
    audio.pause();
    $("play-pause-btn").textContent = "▶";
  }
}

function nextTrack() {
  if (!queue.length) return;
  if (isShuffle) {
    const randId = queue[Math.floor(Math.random() * queue.length)];
    playTrack(randId);
    return;
  }
  queuePos = (queuePos + 1) % queue.length;
  playTrack(queue[queuePos]);
}

function prevTrack() {
  if (!queue.length) return;
  queuePos = (queuePos - 1 + queue.length) % queue.length;
  playTrack(queue[queuePos]);
}

/* =========================================================
   8. ACTIONS & EVENTS
   ========================================================= */
async function addLinkTrack() {
  const urlIn = $("url");
  const titleIn = $("title");
  const url = urlIn.value.trim();
  let title = titleIn.value.trim();

  if (!url) {
    toast("Введіть посилання на трек", "err");
    return;
  }
  if (!title) {
    try {
      const parsed = new URL(url);
      const name = parsed.pathname.split("/").pop();
      title = name ? decodeURIComponent(name) : "Трек з мережі";
    } catch (e) {
      title = "Трек з мережі";
    }
  }

  const newT = { id: uid(), title, url, kind: "link" };
  state.tracks.push(newT);
  urlIn.value = "";
  titleIn.value = "";
  persist();
  toast("Трек додано", "ok");
}

async function handleFiles(files) {
  let added = 0;
  for (const f of files) {
    if (!f.type.startsWith("audio/") && !f.name.match(/\.(mp3|wav|ogg|m4a|flac)$/i)) continue;
    const id = uid();
    const title = f.name.replace(/\.[^/.]+$/, "");
    const newT = { id, title, kind: "local" };
    state.tracks.push(newT);
    try {
      await idbPut(id, f);
    } catch (e) {
      console.error("Не вдалося зберегти в IndexedDB:", e);
    }
    added++;
  }
  if (added) {
    persist();
    toast("Додано локальних файлів: " + added, "ok");
  } else {
    toast("Не знайдено аудіофайлів", "err");
  }
}

// Event Listeners setup
document.addEventListener("DOMContentLoaded", () => {
  boot();

  $("add-btn").addEventListener("click", addLinkTrack);
  $("url").addEventListener("keydown", (e) => { if (e.key === "Enter") addLinkTrack(); });
  $("title").addEventListener("keydown", (e) => { if (e.key === "Enter") addLinkTrack(); });

  $("file-btn").addEventListener("click", () => $("file-input").click());
  $("folder-btn").addEventListener("click", () => $("folder-input").click());
  $("file-input").addEventListener("change", (e) => handleFiles(e.target.files));
  $("folder-input").addEventListener("change", (e) => handleFiles(e.target.files));

  const dropZone = $("drop-zone");
  dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("hot"); });
  dropZone.addEventListener("dragleave", () => dropZone.classList.remove("hot"));
  dropZone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropZone.classList.remove("hot");
    if (e.dataTransfer.files && e.dataTransfer.files.length) {
      handleFiles(e.dataTransfer.files);
    }
  });

  $("search-input").addEventListener("input", (e) => {
    searchQuery = e.target.value;
    renderList();
  });

  $("play-view-btn").addEventListener("click", () => {
    const list = visibleTracks();
    if (list.length) playTrack(list[0].id);
  });

  $("list").addEventListener("click", (e) => {
    const li = e.target.closest("li.track");
    if (!li) return;
    const id = li.dataset.id;
    const actBtn = e.target.closest("button[data-act]");
    if (actBtn) {
      e.stopPropagation();
      const act = actBtn.dataset.act;
      if (act === "del") {
        state.tracks = state.tracks.filter((t) => t.id !== id);
        state.playlists.forEach((p) => { p.trackIds = p.trackIds.filter((tid) => tid !== id); });
        idbDel(id);
        blobUrls.delete(id);
        if (currentTrackId === id) { audio.pause(); currentTrackId = null; }
        persist();
        toast("Трек видалено", "ok");
      } else if (act === "rename") {
        const t = trackById(id);
        if (!t) return;
        const newName = prompt("Нова назва треку:", t.title);
        if (newName && newName.trim()) {
          t.title = newName.trim();
          persist();
          toast("Перейменовано", "ok");
        }
      } else if (act === "addto") {
        openAddToModal(id);
      } else if (act === "rmfrompl") {
        const p = playlistById(view.id);
        if (p) {
          p.trackIds = p.trackIds.filter((tid) => tid !== id);
          persist();
          toast("Видалено з плейлиста", "ok");
        }
      }
      return;
    }
    playTrack(id);
  });

  // Sidebar navigation & playlist actions
  $("sidebar").addEventListener("click", (e) => {
    const navItem = e.target.closest(".nav-item");
    if (!navItem) return;
    const editBtn = e.target.closest("button[data-act], .nav-edit");
    if (editBtn) {
      e.stopPropagation();
      const plId = navItem.dataset.id;
      openPlaylistSettingsModal(plId);
      return;
    }
    const viewType = navItem.dataset.view;
    if (viewType === "all") {
      view = { type: "all", id: null };
      renderAll();
    } else if (viewType === "playlist") {
      view = { type: "playlist", id: navItem.dataset.id };
      renderAll();
    }
  });

  $("new-playlist-btn").addEventListener("click", () => {
    const name = prompt("Назва нового плейлиста:");
    if (name && name.trim()) {
      state.playlists.push({ id: uid(), name: name.trim(), trackIds: [] });
      persist();
      toast("Плейлист створено", "ok");
    }
  });

  // Player controls
  $("play-pause-btn").addEventListener("click", togglePlay);
  $("next-btn").addEventListener("click", nextTrack);
  $("prev-btn").addEventListener("click", prevTrack);

  $("shuffle-btn").addEventListener("click", () => {
    isShuffle = !isShuffle;
    $("shuffle-btn").classList.toggle("active-mode", isShuffle);
    toast(isShuffle ? "Випадковий порядок увімкнено" : "Порядок за списком", "ok");
  });

  $("repeat-btn").addEventListener("click", () => {
    repeatMode = (repeatMode + 1) % 3;
    const btn = $("repeat-btn");
    btn.classList.toggle("active-mode", repeatMode > 0);
    let badge = btn.querySelector(".badge");
    if (repeatMode === 2) {
      if (!badge) { badge = document.createElement("span"); badge.className = "badge"; btn.appendChild(badge); }
      badge.textContent = "1";
      toast("Повторення треку", "ok");
    } else if (repeatMode === 1) {
      if (!badge) { badge = document.createElement("span"); badge.className = "badge"; btn.appendChild(badge); }
      badge.textContent = "all";
      toast("Повторення плейлиста", "ok");
    } else {
      if (badge) badge.remove();
      toast("Повторення вимкнено", "ok");
    }
  });

  audio.addEventListener("timeupdate", () => {
    if (isSeeking) return;
    const cur = audio.currentTime;
    const dur = audio.duration || 0;
    $("time-cur").textContent = fmtTime(cur);
    $("time-dur").textContent = fmtTime(dur);
    const pct = dur ? (cur / dur) * 100 : 0;
    $("progress-bar").style.width = pct + "%";
  });

  audio.addEventListener("ended", () => {
    if (repeatMode === 2) {
      audio.currentTime = 0;
      audio.play();
    } else {
      nextTrack();
    }
  });

  const progContainer = $("progress-container");
  const seek = (e) => {
    const dur = audio.duration;
    if (!dur) return;
    const rect = progContainer.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    let pos = (clientX - rect.left) / rect.width;
    pos = Math.max(0, Math.min(1, pos));
    audio.currentTime = pos * dur;
    $("progress-bar").style.width = (pos * 100) + "%";
  };

  progContainer.addEventListener("pointerdown", (e) => {
    isSeeking = true;
    seek(e);
    const onMove = (ev) => seek(ev);
    const onUp = (ev) => {
      isSeeking = false;
      seek(ev);
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
    };
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
  });

  const volSlider = $("volume-slider");
  volSlider.addEventListener("input", (e) => {
    audio.volume = e.target.value;
    try { localStorage.setItem(LS_VOLUME, audio.volume); } catch (err) {}
  });

  try {
    const savedVol = localStorage.getItem(LS_VOLUME);
    if (savedVol !== null) {
      audio.volume = parseFloat(savedVol);
      volSlider.value = audio.volume;
    }
  } catch (e) {}

  $("mute-btn").addEventListener("click", () => {
    audio.muted = !audio.muted;
    $("mute-btn").textContent = audio.muted ? "🔇" : "🔊";
  });

  $("menu-toggle").addEventListener("click", () => {
    $("sidebar").classList.toggle("open");
  });

  // Modal helpers
  const modalBack = $("modal-back");
  const modal = $("modal");

  function closeModal() {
    modalBack.classList.remove("open");
  }
  modalBack.addEventListener("click", (e) => {
    if (e.target === modalBack) closeModal();
  });

  function openAddToModal(trackId) {
    if (!state.playlists.length) {
      toast("Створіть спочатку хоча б один плейлист", "err");
      return;
    }
    modal.innerHTML = `
      <h3>Додати в плейлист</h3>
      <div class="sub">Оберіть плейлист зі списку</div>
      <div class="modal-list">
        ${state.playlists.map((p) => {
          const inPl = p.trackIds.includes(trackId);
          return `
            <div class="modal-row${inPl ? " in" : ""}" data-pl-id="${esc(p.id)}">
              <span class="rname">${esc(p.name)}</span>
              <span>${inPl ? "✓" : "＋"}</span>
            </div>`;
        }).join("")}
      </div>
      <div class="modal-actions">
        <button class="secondary-btn" id="modal-close">Закрити</button>
      </div>
    `;
    modalBack.classList.add("open");
    $("modal-close").onclick = closeModal;

    modal.querySelectorAll(".modal-row").forEach((row) => {
      row.onclick = () => {
        const plId = row.dataset.plId;
        const p = playlistById(plId);
        if (!p) return;
        const idx = p.trackIds.indexOf(trackId);
        if (idx === -1) {
          p.trackIds.push(trackId);
          toast("Додано до плейлиста", "ok");
        } else {
          p.trackIds.splice(idx, 1);
          toast("Видалено з плейлиста", "ok");
        }
        persist();
        closeModal();
      };
    });
  }

  function openPlaylistSettingsModal(plId) {
    const p = playlistById(plId);
    if (!p) return;
    modal.innerHTML = `
      <h3>Плейлист: ${esc(p.name)}</h3>
      <div class="sub">Керування плейлистом</div>
      <div class="modal-actions" style="flex-direction:column;gap:8px">
        <button class="secondary-btn" id="pl-rename" style="width:100%">✏️ Перейменувати</button>
        <button class="danger-btn" id="pl-del" style="width:100%">🗑 Видалити плейлист</button>
        <button class="secondary-btn" id="modal-close" style="width:100%">Закрити</button>
      </div>
    `;
    modalBack.classList.add("open");
    $("modal-close").onclick = closeModal;

    $("pl-rename").onclick = () => {
      const newName = prompt("Нова назва плейлиста:", p.name);
      if (newName && newName.trim()) {
        p.name = newName.trim();
        persist();
        toast("Плейлист перейменовано", "ok");
        closeModal();
      }
    };

    $("pl-del").onclick = () => {
      if (confirm("Видалити плейлист «" + p.name + "»?")) {
        state.playlists = state.playlists.filter((item) => item.id !== plId);
        if (view.type === "playlist" && view.id === plId) {
          view = { type: "all", id: null };
        }
        persist();
        toast("Плейлист видалено", "ok");
        closeModal();
      }
    };
  }
});
</script>
</body>
</html>
