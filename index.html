<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Red Player</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }
        .player-container {
            width: 100%;
            max-width: 400px;
            background: #181818;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }
        h3 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 20px;
            text-align: center;
            letter-spacing: 0.5px;
        }
        
        /* Стильний кастомний блок плеєра замість стандартного */
        .custom-player {
            background: #242424;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .now-playing {
            font-size: 13px;
            color: #b3b3b3;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .current-title {
            color: #fff;
            font-weight: bold;
        }
        
        /* Прогрес-бар */
        .progress-container {
            width: 100%;
            height: 6px;
            background: #333;
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }
        .progress-bar {
            height: 100%;
            background: #e50914;
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
        }

        /* Кнопки керування */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        .ctrl-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: color 0.2s, transform 0.1s;
        }
        .ctrl-btn:hover {
            color: #e50914;
        }
        .ctrl-btn:active {
            transform: scale(0.9);
        }
        .play-pause-btn {
            width: 44px;
            height: 44px;
            background: #e50914;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            color: #fff;
            box-shadow: 0 4px 12px rgba(229, 9, 20, 0.4);
            transition: background 0.2s, transform 0.1s;
        }
        .play-pause-btn:hover {
            background: #b20710;
            color: #fff;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #242424;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #e50914;
        }
        button#add-btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: #e50914;
            color: #fff;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button#add-btn:hover {
            background: #b20710;
        }
        .playlist-title {
            font-size: 14px;
            color: #b3b3b3;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 220px;
            overflow-y: auto;
        }
        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            margin-bottom: 6px;
            background: #222;
            border-radius: 8px;
            transition: background 0.2s;
        }
        li.active {
            border: 1px solid #e50914;
            background: #221010;
        }
        li:hover {
            background: #282828;
        }
        .song-name {
            cursor: pointer;
            flex-grow: 1;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-right: 10px;
        }
        .song-name:hover {
            color: #e50914;
        }
        .del-btn {
            background: transparent;
            color: #888;
            border: none;
            padding: 6px 10px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
            transition: color 0.2s, background 0.2s;
        }
        .del-btn:hover {
            color: #fff;
            background: #e50914;
        }
    </style>
</head>
<body>

<div class="player-container">
    <h3>Мій Хмарний Плейлист</h3>
    
    <!-- Повністю кастомний червоний плеєр -->
    <div class="custom-player">
        <div class="now-playing">Зараз грає: <span id="current-song-title" class="current-title">Нічого не вибрано</span></div>
        <div class="progress-container" id="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="controls">
            <button class="ctrl-btn" id="prev-btn" title="Попередня">⏮</button>
            <button class="ctrl-btn play-pause-btn" id="play-pause-btn" title="Грати/Пауза">▶</button>
            <button class="ctrl-btn" id="next-btn" title="Наступна">⏭</button>
        </div>
    </div>

    <!-- Прихований стандартний аудіо-елемент (працює під капотом) -->
    <audio id="player" style="display: none;"></audio>
    
    <div class="input-group">
        <input type="text" id="title" placeholder="Назва пісні">
        <input type="text" id="url" placeholder="Пряме посилання на MP3">
        <button id="add-btn">Додати у плейлист</button>
    </div>

    <div class="playlist-title">Черга відтворення</div>
    <ul id="list"></ul>
</div>

<script>
    const BIN_ID = '6a7c3536da38895dfed9948e'; 
    const API_KEY = '$2a$10$RZSWlrF3nSMRAsv5Jlk1MOHs4qBWJ6ItuOqlU9rE1KSeii4Ck2XFu'; 
    const urlAPI = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    let currentSongs = [];
    let currentIndex = 0;
    const player = document.getElementById('player');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const progressBar = document.getElementById('progress-bar');
    const progressContainer = document.getElementById('progress-container');
    const currentSongTitle = document.getElementById('current-song-title');

    async function loadSongs() {
        try {
            const response = await fetch(urlAPI, { headers: { 'X-Master-Key': API_KEY }});
            const result = await response.json();
            currentSongs = result.record.songs || [];
            renderList();
        } catch (err) {
            console.error('Помилка завантаження:', err);
        }
    }

    function renderList() {
        const list = document.getElementById('list');
        list.innerHTML = '';
        
        if (currentSongs.length === 0) {
            list.innerHTML = '<li style="color: #777; justify-content: center; cursor: default;">Плейлист порожній</li>';
            return;
        }

        currentSongs.forEach((song, index) => {
            const li = document.createElement('li');
            if (index === currentIndex) li.classList.add('active');

            li.innerHTML = `
                <span class="song-name" title="${song.title}">${song.title}</span>
                <button class="del-btn" onclick="deleteSong(${index})">✕</button>
            `;
            li.querySelector('.song-name').onclick = () => playSong(index);
            list.appendChild(li);
        });
    }

    function playSong(index) {
        if (index < 0 || index >= currentSongs.length) return;
        currentIndex = index;
        const song = currentSongs[currentIndex];
        
        player.src = song.url;
        player.play();
        currentSongTitle.textContent = song.title;
        playPauseBtn.textContent = '❚❚';
        renderList();
        updateMediaSession(song);
    }

    // Кнопка Play/Pause
    playPauseBtn.onclick = () => {
        if (currentSongs.length === 0) return;
        if (player.paused) {
            if (!player.src && currentSongs.length > 0) {
                playSong(0);
            } else {
                player.play();
            }
            playPauseBtn.textContent = '❚❚';
        } else {
            player.pause();
            playPauseBtn.textContent = '▶';
        }
    };

    // Наступна / Попередня кнопки
    document.getElementById('next-btn').onclick = () => {
        if (currentSongs.length === 0) return;
        let nextIndex = (currentIndex + 1) % currentSongs.length;
        playSong(nextIndex);
    };

    document.getElementById('prev-btn').onclick = () => {
        if (currentSongs.length === 0) return;
        let prevIndex = (currentIndex - 1 + currentSongs.length) % currentSongs.length;
        playSong(prevIndex);
    };

    // Оновлення прогрес-бару
    player.ontimeupdate = () => {
        if (player.duration) {
            const percent = (player.currentTime / player.duration) * 100;
            progressBar.style.width = percent + '%';
        }
    };

    // Перемотування кліком по смузі
    progressContainer.onclick = (e) => {
        const width = progressContainer.clientWidth;
        const clickX = e.offsetX;
        if (player.duration) {
            player.currentTime = (clickX / width) * player.duration;
        }
    };

    // Автоматичне перемикання на наступний трек
    player.onended = () => {
        let nextIndex = (currentIndex + 1) % currentSongs.length;
        if (currentSongs.length > 0) {
            playSong(nextIndex);
        }
    };

    function updateMediaSession(song) {
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: song.title,
                artist: 'Cloud Red Player',
                album: 'Мій Плейлист'
            });

            navigator.mediaSession.setActionHandler('nexttrack', () => {
                document.getElementById('next-btn').click();
            });

            navigator.mediaSession.setActionHandler('previoustrack', () => {
                document.getElementById('prev-btn').click();
            });
            
            navigator.mediaSession.setActionHandler('play', () => {
                player.play();
                playPauseBtn.textContent = '❚❚';
            });
            navigator.mediaSession.setActionHandler('pause', () => {
                player.pause();
                playPauseBtn.textContent = '▶';
            });
        }
    }

    async function deleteSong(index) {
        try {
            const res = await fetch(urlAPI, { headers: { 'X-Master-Key': API_KEY }});
            const data = await res.json();
            let songs = data.record.songs;
            songs.splice(index, 1);
            
            await fetch(urlAPI, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify({ songs })
            });
            loadSongs();
        } catch (err) {
            alert('Помилка видалення');
        }
    }

    document.getElementById('add-btn').onclick = async () => {
        const title = document.getElementById('title').value.trim();
        const url = document.getElementById('url').value.trim();
        if (!title || !url) {
            alert('Заповніть обидва поля!');
            return;
        }
        
        try {
            const res = await fetch(urlAPI, { headers: { 'X-Master-Key': API_KEY }});
            const data = await res.json();
            const songs = data.record.songs || [];
            songs.push({ title, url });
            
            const updateRes = await fetch(urlAPI, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify({ songs })
            });

            if (updateRes.ok) {
                document.getElementById('title').value = '';
                document.getElementById('url').value = '';
                loadSongs();
            } else {
                alert('Помилка збереження');
            }
        } catch (err) {
            alert('Помилка: ' + err.message);
        }
    };

    loadSongs();
</script>
</body>
</html>
