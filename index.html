<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpotiSanya • Universal Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        :root {
            --accent: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.25);
            --accent-gradient: linear-gradient(135deg, #00ff88 0%, #00b8ff 100%);
            
            --bg-main: #070709;
            --bg-surface: rgba(18, 18, 24, 0.7);
            --bg-surface-hover: rgba(28, 28, 38, 0.85);
            
            --border-color: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(0, 255, 136, 0.3);
            
            --text-main: #f3f4f6;
            --text-muted: #8b8d98;
            
            --blur-glass: blur(20px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 184, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(0, 255, 136, 0.06) 0%, transparent 40%);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .app-layout {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        .main-content {
            padding: 40px 48px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 28px;
            padding-bottom: 180px;
        }

        .main-content::-webkit-scrollbar { width: 8px; }
        .main-content::-webkit-scrollbar-track { background: transparent; }
        .main-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 12px;
            filter: drop-shadow(0 0 25px rgba(0, 255, 136, 0.2));
        }

        .device-badge {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid var(--border-hover);
            color: var(--accent);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 12px;
        }

        .add-card {
            background: var(--bg-surface);
            backdrop-filter: var(--blur-glass);
            padding: 24px;
            border-radius: 20px;
            display: flex;
            gap: 14px;
            align-items: center;
            border: 1px solid var(--border-color);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
            flex-wrap: wrap;
            transition: border-color 0.3s;
        }
        .add-card:focus-within { border-color: var(--border-hover); }

        input[type="text"] {
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-main);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            flex: 1;
            transition: all 0.3s;
        }
        input[type="text"]:focus { 
            border-color: var(--accent); 
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        button {
            background: var(--accent-gradient);
            color: #070709;
            border: none;
            padding: 14px 28px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 4px 20px var(--accent-glow);
            transition: transform 0.2s, filter 0.2s;
        }
        button:hover { filter: brightness(1.15); transform: translateY(-2px); }
        button:active { transform: translateY(0); }

        .drop-zone {
            border: 2px dashed rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            background: rgba(255, 255, 255, 0.01);
            transition: all 0.3s;
            cursor: pointer;
        }
        .drop-zone:hover {
            border-color: var(--accent);
            background: rgba(0, 255, 136, 0.02);
            color: var(--text-main);
        }

        .playlist-header {
            display: grid;
            grid-template-columns: 48px 1fr 120px;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 0 20px 12px 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 8px;
        }

        ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        li {
            display: grid;
            grid-template-columns: 48px 1fr 120px;
            align-items: center;
            padding: 14px 20px;
            border-radius: 14px;
            background: var(--bg-surface);
            backdrop-filter: var(--blur-glass);
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: all 0.25s;
        }
        li:hover { 
            background: var(--bg-surface-hover); 
            border-color: rgba(255, 255, 255, 0.12);
            transform: translateX(4px);
        }
        li.active {
            background: rgba(0, 255, 136, 0.07);
            border-color: var(--accent);
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.1);
        }
        li.active .song-name { color: var(--accent); font-weight: 700; }
        
        .song-index { color: var(--text-muted); font-size: 14px; font-weight: 600; }
        .song-name {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 15px;
        }
        
        .action-btns {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
            opacity: 0.4;
            transition: opacity 0.2s;
        }
        li:hover .action-btns { opacity: 1; }

        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 13px;
            padding: 8px;
            border-radius: 8px;
            transition: background 0.2s, color 0.2s;
        }
        .action-btn:hover { background: rgba(255, 255, 255, 0.1); color: var(--text-main); }
        .del-btn:hover { color: #ff4757 !important; background: rgba(255, 71, 87, 0.1) !important; }

        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 10, 13, 0.85);
            backdrop-filter: blur(30px);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 48px;
            gap: 24px;
            z-index: 10;
        }

        .current-info {
            width: 25%;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-center {
            width: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .ctrl-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 16px;
            cursor: pointer;
            padding: 6px;
            box-shadow: none;
            transition: color 0.2s, transform 0.2s;
        }
        .ctrl-btn:hover { color: var(--text-main); transform: scale(1.15); }
        .ctrl-btn.active-mode { color: var(--accent); }

        .play-pause-btn {
            width: 44px;
            height: 44px;
            background: var(--accent-gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #070709;
            font-size: 14px;
            font-weight: 800;
            box-shadow: 0 4px 20px var(--accent-glow);
            transition: transform 0.2s, filter 0.2s;
        }
        .play-pause-btn:hover { filter: brightness(1.15); transform: scale(1.08); }

        .progress-container {
            width: 100%;
            max-width: 550px;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }
        .progress-bar {
            height: 100%;
            background: var(--accent-gradient);
            border-radius: 3px;
            width: 0%;
        }

        .volume-wrapper {
            width: 25%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
        }
        .volume-slider {
            width: 110px;
            height: 4px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        /* Мобільні обмеження: приховуємо важкі ПК-елементи */
        body.is-mobile .pc-only {
            display: none !important;
        }

        @media (max-width: 768px) {
            .player-bar { flex-direction: column; gap: 14px; padding: 18px 24px; }
            .current-info, .player-center, .volume-wrapper { width: 100%; justify-content: center; text-align: center; }
            .main-content { padding: 24px; padding-bottom: 220px; }
        }
    </style>
</head>
<body>

<div class="app-layout">
    <div class="main-content">
        <div class="header-top">
            <div class="app-title">⚡ SpotiSanya</div>
            <div class="device-badge" id="device-indicator">Визначення...</div>
        </div>

        <!-- ПК-версія блоку додавання (на телефоні ховається) -->
        <div class="pc-only">
            <div class="section-title">Додати трек (тільки для ПК)</div>
            <div class="add-card">
                <input type="text" id="title" placeholder="Назва треку...">
                <input type="text" id="url" placeholder="Шлях до файлу або URL...">
                <button id="add-btn">Додати</button>
            </div>
        </div>

        <div class="drop-zone pc-only" id="drop-zone">
            📥 Перетягніть файли сюди (функція ПК)
        </div>

        <div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <div class="section-title" style="margin-bottom: 0;">Плейлист</div>
                <input type="text" id="search-input" placeholder="🔍 Пошук..." style="max-width: 240px; padding: 10px 16px; font-size: 13px;">
            </div>
            <div class="playlist-header">
                <div>#</div>
                <div>Назва треку</div>
                <div style="text-align: right;">Дії</div>
            </div>
            <ul id="list"></ul>
        </div>
    </div>

    <div class="player-bar">
        <div class="current-info" id="current-song-title">Нічого не грає</div>
        
        <div class="player-center">
            <div class="player-controls">
                <button class="ctrl-btn" id="shuffle-btn" title="Випадковий">🔀</button>
                <button class="ctrl-btn" id="repeat-btn" title="Повтор">🔁</button>
                <button class="ctrl-btn" id="prev-btn" title="Попередній">⏮</button>
                <button class="ctrl-btn play-pause-btn" id="play-pause-btn" title="Грати / Пауза">▶</button>
                <button class="ctrl-btn" id="next-btn" title="Наступний">⏭</button>
            </div>
            <div class="progress-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>

        <div class="volume-wrapper pc-only">
            <span>🔊</span>
            <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="1">
        </div>
    </div>
</div>

<audio id="player" preload="auto"></audio>

<script>
    // Визначення пристрою
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;
    
    if (isMobile) {
        document.body.classList.add('is-mobile');
        document.getElementById('device-indicator').textContent = '📱 Режим Телефона';
    } else {
        document.getElementById('device-indicator').textContent = '💻 Режим ПК';
    }

    let currentSongs = JSON.parse(localStorage.getItem('spotisanya_songs')) || [];
    let currentIndex = 0;
    let searchQuery = '';
    let isRepeat = false;
    let isShuffle = false;

    const player = document.getElementById('player');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const progressBar = document.getElementById('progress-bar');
    const progressContainer = document.getElementById('progress-container');
    const currentSongTitle = document.getElementById('current-song-title');
    const volumeSlider = document.getElementById('volume-slider');
    const searchInput = document.getElementById('search-input');
    const repeatBtn = document.getElementById('repeat-btn');
    const shuffleBtn = document.getElementById('shuffle-btn');

    function saveToStorage() {
        localStorage.setItem('spotisanya_songs', JSON.stringify(currentSongs));
    }

    if (volumeSlider) {
        volumeSlider.oninput = (e) => { player.volume = e.target.value; };
    }

    renderList();

    function renderList() {
        const list = document.getElementById('list');
        list.innerHTML = '';
        
        const filteredSongs = currentSongs.map((song, originalIndex) => ({ ...song, originalIndex }))
            .filter(song => song.title.toLowerCase().includes(searchQuery.toLowerCase()));

        if (filteredSongs.length === 0) {
            list.innerHTML = '<li style="color: var(--text-muted); justify-content: center; display: flex; text-align: center; padding: 24px; background: transparent; border: none;">Плейлист порожній.</li>';
            return;
        }

        filteredSongs.forEach((song) => {
            const li = document.createElement('li');
            if (song.originalIndex === currentIndex) li.classList.add('active');

            let actionButtonsHTML = '';
            // На ПК дозволяємо редагувати та видаляти через інтерфейс, на телефоні залишаємо мінімум або стандарт
            actionButtonsHTML = `
                <div class="action-btns">
                    <button class="action-btn pc-only" onclick="renameSong(event, ${song.originalIndex})" title="Редагувати">✏️</button>
                    <button class="action-btn del-btn" onclick="deleteSong(event, ${song.originalIndex})" title="Видалити">✕</button>
                </div>
            `;

            li.innerHTML = `
                <span class="song-index">${song.originalIndex + 1}</span>
                <span class="song-name" title="${song.title}">${song.title}</span>
                ${actionButtonsHTML}
            `;
            li.onclick = () => playSong(song.originalIndex);
            list.appendChild(li);
        });
    }

    searchInput.oninput = (e) => {
        searchQuery = e.target.value;
        renderList();
    };

    function playSong(index) {
        if (index < 0 || index >= currentSongs.length) return;

        currentIndex = index;
        const song = currentSongs[currentIndex];
        
        player.pause();
        player.src = song.url;
        player.load(); 
        
        player.play().then(() => {
            playPauseBtn.textContent = '❚❚';
        }).catch((err) => {
            console.warn("Помилка відтворення:", err);
            playPauseBtn.textContent = '▶';
        });
        
        currentSongTitle.textContent = song.title;
        renderList();
    }

    playPauseBtn.onclick = () => {
        if (currentSongs.length === 0) return;

        if (player.paused) {
            if (!player.src) playSong(0);
            else player.play().then(() => { playPauseBtn.textContent = '❚❚'; }).catch(() => {});
        } else {
            player.pause();
            playPauseBtn.textContent = '▶';
        }
    };

    function getNextIndex() {
        if (currentSongs.length === 0) return 0;
        if (isShuffle) {
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * currentSongs.length);
            } while (randomIndex === currentIndex && currentSongs.length > 1);
            return randomIndex;
        } else {
            return (currentIndex + 1) % currentSongs.length;
        }
    }

    document.getElementById('next-btn').onclick = () => {
        if (currentSongs.length > 0) playSong(getNextIndex());
    };

    document.getElementById('prev-btn').onclick = () => {
        if (currentSongs.length > 0) {
            playSong((currentIndex - 1 + currentSongs.length) % currentSongs.length);
        }
    };

    repeatBtn.onclick = () => {
        isRepeat = !isRepeat;
        repeatBtn.classList.toggle('active-mode', isRepeat);
    };

    shuffleBtn.onclick = () => {
        isShuffle = !isShuffle;
        shuffleBtn.classList.toggle('active-mode', isShuffle);
    };

    player.ontimeupdate = () => {
        if (player.duration) {
            progressBar.style.width = ((player.currentTime / player.duration) * 100) + '%';
        }
    };

    progressContainer.onclick = (e) => {
        if (player.duration) {
            player.currentTime = (e.offsetX / progressContainer.clientWidth) * player.duration;
        }
    };

    player.onended = () => {
        if (currentSongs.length === 0) return;
        if (isRepeat) playSong(currentIndex);
        else playSong(getNextIndex());
    };

    // Додавання треків (працює переважно на ПК)
    const addBtn = document.getElementById('add-btn');
    if (addBtn) {
        addBtn.onclick = () => {
            const titleInput = document.getElementById('title');
            const urlInput = document.getElementById('url');
            const title = titleInput.value.trim();
            const url = urlInput.value.trim();

            if (!url) return alert('Введіть посилання або шлях до файлу!');

            currentSongs.push({
                title: title || url.split('/').pop() || 'Трек',
                url: url
            });

            saveToStorage();
            titleInput.value = ''; 
            urlInput.value = '';
            renderList();
        };
    }

    const dropZoneEl = document.getElementById('drop-zone');
    if (dropZoneEl) {
        dropZoneEl.ondragover = (e) => { e.preventDefault(); };
        dropZoneEl.ondrop = (e) => {
            e.preventDefault();
            if (e.dataTransfer.files.length > 0) {
                for (let file of e.dataTransfer.files) {
                    if (file.name.endsWith('.mp3') || file.type.includes('audio')) {
                        const objectUrl = URL.createObjectURL(file);
                        currentSongs.push({ title: file.name.replace(/\.[^/.]+$/, ""), url: objectUrl });
                    }
                }
                saveToStorage();
                renderList();
                if (currentSongs.length > 0 && !player.src) playSong(0);
            }
        };
    }

    function renameSong(event, index) {
        event.stopPropagation();
        const newTitle = prompt("Нова назва:", currentSongs[index].title);
        if (!newTitle || !newTitle.trim()) return;
        currentSongs[index].title = newTitle.trim();
        saveToStorage();
        renderList();
        if (index === currentIndex) currentSongTitle.textContent = newTitle.trim();
    }

    function deleteSong(event, index) {
        event.stopPropagation();
        if (!confirm("Видалити трек?")) return;
        currentSongs.splice(index, 1);
        saveToStorage();
        renderList();
    }
</script>
</body>
</html>
