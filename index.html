<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpotiSanya • Cyberpunk Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;850&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        :root {
            --accent: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.35);
            --cyber-blue: #00f0ff;
            --cyber-pink: #ff0055;
            --accent-gradient: linear-gradient(135deg, #00ff88 0%, #00f0ff 100%);
            
            --bg-main: #030305;
            --bg-surface: rgba(10, 10, 16, 0.75);
            --bg-surface-hover: rgba(20, 20, 32, 0.9);
            
            --border-color: rgba(0, 255, 136, 0.15);
            --border-hover: rgba(0, 255, 136, 0.5);
            
            --text-main: #f0f3f8;
            --text-muted: #6b7285;
            
            --blur-glass: blur(25px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(0, 240, 255, 0.07) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(255, 0, 85, 0.05) 0%, transparent 40%),
                linear-gradient(rgba(0,0,0,0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.3) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .app-layout {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        .main-content {
            padding: 30px 48px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding-bottom: 180px;
        }

        .main-content::-webkit-scrollbar { width: 6px; }
        .main-content::-webkit-scrollbar-track { background: transparent; }
        .main-content::-webkit-scrollbar-thumb { background: rgba(0,255,136,0.2); border-radius: 3px; }
        .main-content::-webkit-scrollbar-thumb:hover { background: rgba(0,255,136,0.4); }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            font-weight: 850;
            letter-spacing: 2px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 12px;
            filter: drop-shadow(0 0 20px rgba(0, 255, 136, 0.4));
        }

        .sync-badge {
            font-size: 11px;
            font-family: 'Orbitron', sans-serif;
            padding: 6px 14px;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--cyber-blue);
            color: var(--cyber-blue);
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sync-dot {
            width: 8px;
            height: 8px;
            background: var(--cyber-blue);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--cyber-blue);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        /* Cyberpunk Visualizer Dashboard */
        .cyber-dashboard {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 20px;
            align-items: center;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: var(--blur-glass);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,255,136,0.03);
        }

        .album-art-box {
            width: 180px;
            height: 180px;
            border-radius: 14px;
            background: #000;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border-hover);
            box-shadow: 0 0 20px var(--accent-glow);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .album-art-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.85;
            transition: transform 0.5s;
        }
        .album-art-box:hover img { transform: scale(1.05); }

        .spectrum-container {
            height: 140px;
            display: flex;
            align-items: flex-end;
            gap: 4px;
            padding: 10px;
            background: rgba(0,0,0,0.4);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.03);
            position: relative;
            overflow: hidden;
        }
        .spectrum-bar {
            flex: 1;
            background: var(--accent-gradient);
            border-radius: 2px 2px 0 0;
            height: 5%;
            transition: height 0.05s ease;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .add-card {
            background: var(--bg-surface);
            backdrop-filter: var(--blur-glass);
            padding: 20px;
            border-radius: 16px;
            display: flex;
            gap: 12px;
            align-items: center;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            flex-wrap: wrap;
        }
        .add-card:focus-within { border-color: var(--border-hover); box-shadow: 0 0 25px var(--accent-glow); }

        input[type="text"] {
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.5);
            color: var(--text-main);
            font-size: 13px;
            font-family: inherit;
            outline: none;
            flex: 1;
            transition: all 0.3s;
        }
        input[type="text"]:focus { 
            border-color: var(--accent); 
            box-shadow: 0 0 15px var(--accent-glow);
        }

        button {
            background: var(--accent-gradient);
            color: #030305;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--accent-glow);
            transition: all 0.2s;
        }
        button:hover { filter: brightness(1.2); transform: translateY(-2px); box-shadow: 0 0 25px var(--accent); }

        .secondary-btn {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            box-shadow: none;
        }
        .secondary-btn:hover { background: rgba(0, 255, 136, 0.1); border-color: var(--accent); }

        .playlist-header {
            display: grid;
            grid-template-columns: 48px 1fr 120px;
            color: var(--text-muted);
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 0 20px 10px 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 6px;
        }

        ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        li {
            display: grid;
            grid-template-columns: 48px 1fr 120px;
            align-items: center;
            padding: 12px 20px;
            border-radius: 12px;
            background: var(--bg-surface);
            backdrop-filter: var(--blur-glass);
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
        }
        li:hover { 
            background: var(--bg-surface-hover); 
            border-color: var(--border-hover);
            transform: translateX(4px);
        }
        li.active {
            background: rgba(0, 255, 136, 0.08);
            border-color: var(--accent);
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.15);
        }
        li.active .song-name { color: var(--accent); font-weight: 700; text-shadow: 0 0 10px var(--accent-glow); }
        
        .song-index { color: var(--text-muted); font-size: 13px; font-family: 'Orbitron', sans-serif; }
        .song-name {
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 15px;
        }
        
        .action-btns {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
            opacity: 0.4;
            transition: opacity 0.2s;
        }
        li:hover .action-btns { opacity: 1; }

        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 12px;
            padding: 6px;
            border-radius: 6px;
            transition: all 0.2s;
            box-shadow: none;
        }
        .action-btn:hover { background: rgba(0,255,136,0.1); color: var(--accent); transform: none; box-shadow: none; }
        .del-btn:hover { color: var(--cyber-pink) !important; background: rgba(255, 0, 85, 0.1) !important; }

        /* Player Bar */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(5, 5, 8, 0.92);
            backdrop-filter: blur(30px);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 48px;
            gap: 24px;
            z-index: 10;
            box-shadow: 0 -20px 40px rgba(0,0,0,0.8);
        }

        .current-info {
            width: 25%;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .player-center {
            width: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .ctrl-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 15px;
            cursor: pointer;
            padding: 4px;
            box-shadow: none;
            transition: all 0.2s;
        }
        .ctrl-btn:hover { color: var(--accent); transform: scale(1.15); filter: none; box-shadow: none; }
        .ctrl-btn.active-mode { color: var(--accent); text-shadow: 0 0 10px var(--accent-glow); }

        .play-pause-btn {
            width: 42px;
            height: 42px;
            background: var(--accent-gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #030305;
            font-size: 14px;
            font-weight: 850;
            box-shadow: 0 0 20px var(--accent-glow);
            transition: all 0.2s;
        }
        .play-pause-btn:hover { transform: scale(1.1); filter: brightness(1.2); box-shadow: 0 0 30px var(--accent); }

        .progress-container {
            width: 100%;
            max-width: 500px;
            height: 5px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: var(--accent-gradient);
            border-radius: 3px;
            width: 0%;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .volume-wrapper {
            width: 25%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
        }
        .volume-slider {
            width: 100px;
            height: 4px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .expand-mobile-btn {
            display: none;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 16px;
            cursor: pointer;
            padding: 4px;
            box-shadow: none;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            body { background: var(--bg-main); overflow-y: auto; }
            .app-layout { height: 100vh; }
            .main-content { padding: 16px; padding-bottom: 130px; gap: 16px; }
            .cyber-dashboard, .add-card, .playlist-header, .volume-wrapper {
                display: none !important;
            }
            .header-top { justify-content: space-between; margin-bottom: 5px; }
            .expand-mobile-btn { display: block; }

            .player-bar {
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                background: rgba(8, 8, 12, 0.96);
                backdrop-filter: blur(20px);
                flex-direction: column;
                padding: 12px 16px;
                gap: 8px;
                z-index: 100;
            }

            .player-bar.expanded {
                height: 70vh;
                justify-content: space-evenly;
                border-top-left-radius: 20px;
                border-top-right-radius: 20px;
                border-top: 1px solid var(--accent);
            }

            .player-bar.expanded .volume-wrapper {
                display: flex !important;
                width: 100%;
                justify-content: center;
            }
            .player-bar.expanded .volume-slider { width: 180px; }
            .player-bar.expanded .expand-mobile-btn { transform: rotate(180deg); }

            .current-info {
                width: 100%;
                font-size: 14px;
                justify-content: space-between;
            }

            .player-center { width: 100%; gap: 6px; }
            .player-controls { gap: 18px; }
            .ctrl-btn { font-size: 17px; }
            .play-pause-btn { width: 40px; height: 40px; font-size: 13px; }
            .progress-container { max-width: 100%; height: 5px; }

            ul { margin-top: 5px; }
            li {
                grid-template-columns: 32px 1fr 80px;
                padding: 10px 12px;
            }
        }
    </style>
</head>
<body>

<div class="app-layout">
    <div class="main-content">
        <div class="header-top">
            <div class="app-title">⚡ SPOTISANYA</div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button id="restore-btn" class="secondary-btn" style="font-size: 10px; padding: 6px 10px;" title="Відновити збережені треки зі старого кешу">📥 Відновити кеш</button>
                <div class="sync-badge">
                    <div class="sync-dot"></div> SYNC
                </div>
            </div>
        </div>

        <!-- Cyberpunk Dashboard & Spectrum -->
        <div class="cyber-dashboard">
            <div class="album-art-box" id="album-box">
                <img id="album-img" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=512&h=512&fit=crop" alt="Cyber Cover">
            </div>
            <div class="spectrum-container" id="spectrum-container">
                <!-- Dynamic spectrum bars -->
            </div>
        </div>

        <div class="add-card">
            <input type="text" id="title" placeholder="Назва треку...">
            <input type="text" id="url" placeholder="Посилання на MP3 або аудіо-потік...">
            <button id="add-btn">ДОДАТИ</button>
            <input type="file" id="folder-input" webkitdirectory directory multiple style="display: none;">
            <button id="folder-btn" class="secondary-btn">📂 ПАПКА</button>
        </div>

        <div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <div class="section-title" style="margin-bottom: 0;">Плейлист</div>
                <input type="text" id="search-input" placeholder="🔍 Пошук треку..." style="max-width: 220px; padding: 8px 14px; font-size: 12px;">
            </div>
            <div class="playlist-header">
                <div>#</div>
                <div>Назва треку</div>
                <div style="text-align: right;">Дії</div>
            </div>
            <ul id="list"></ul>
        </div>
    </div>

    <div class="player-bar" id="player-bar">
        <div class="current-info" id="current-song-title">
            <span id="track-name-text">Нічого не грає</span>
            <button class="expand-mobile-btn" id="expand-btn">▲</button>
        </div>
        
        <div class="player-center">
            <div class="player-controls">
                <button class="ctrl-btn" id="shuffle-btn" title="Випадковий">🔀</button>
                <button class="ctrl-btn" id="repeat-btn" title="Повтор">🔁</button>
                <button class="ctrl-btn" id="prev-btn" title="Попередній">⏮</button>
                <button class="ctrl-btn play-pause-btn" id="play-pause-btn" title="Грати/Пауза">▶</button>
                <button class="ctrl-btn" id="next-btn" title="Наступний">⏭</button>
            </div>
            <div class="progress-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>

        <div class="volume-wrapper">
            <span>🔊</span>
            <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="1">
        </div>
    </div>
</div>

<audio id="player" preload="auto" crossorigin="anonymous" playsinline></audio>

<script>
    const BIN_ID = '6a7c3536da38895dfed9948e'; 
    const API_KEY = '$2a$10$RZSWlrF3nSMRAsv5Jlk1MOHs4qBWJ6ItuOqlU9rE1KSeii4Ck2XFu'; 
    const urlAPI = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    let currentSongs = [];
    let currentIndex = 0;
    let searchQuery = '';
    let isRepeat = false;
    let isShuffle = false;

    const player = document.getElementById('player');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const progressBar = document.getElementById('progress-bar');
    const progressContainer = document.getElementById('progress-container');
    const trackNameText = document.getElementById('track-name-text');
    const volumeSlider = document.getElementById('volume-slider');
    const searchInput = document.getElementById('search-input');
    const repeatBtn = document.getElementById('repeat-btn');
    const shuffleBtn = document.getElementById('shuffle-btn');
    const playerBar = document.getElementById('player-bar');
    const expandBtn = document.getElementById('expand-btn');
    const albumImg = document.getElementById('album-img');
    const restoreBtn = document.getElementById('restore-btn');

    expandBtn.onclick = (e) => {
        e.stopPropagation();
        playerBar.classList.toggle('expanded');
    };

    // Restore old local cache button handler
    restoreBtn.onclick = async () => {
        const cached = localStorage.getItem('spotisanya_cache');
        if (cached) {
            try {
                const parsed = JSON.parse(cached);
                if (Array.isArray(parsed) && parsed.length > 0) {
                    currentSongs = parsed;
                    renderList();
                    await syncCloud();
                    alert(`Успішно відновлено ${currentSongs.length} треків із локального кешу та завантажено в хмару!`);
                    return;
                }
            } catch(e) {}
        }
        alert('У локальному кеші не знайдено старих треків.');
    };

    // Spectrum generator
    const spectrumContainer = document.getElementById('spectrum-container');
    const barCount = 32;
    const bars = [];
    for (let i = 0; i < barCount; i++) {
        const bar = document.createElement('div');
        bar.className = 'spectrum-bar';
        spectrumContainer.appendChild(bar);
        bars.push(bar);
    }

    let audioCtx, analyser, dataArray, sourceNode;
    let isInitialized = false;

    function initAudioVisualizer() {
        if (isInitialized) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            sourceNode = audioCtx.createMediaElementSource(player);
            sourceNode.connect(analyser);
            analyser.connect(audioCtx.destination);
            analyser.fftSize = 64;
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            isInitialized = true;
            animateSpectrum();
        } catch(e) {}
    }

    function animateSpectrum() {
        requestAnimationFrame(animateSpectrum);
        if (player.paused || !analyser) {
            bars.forEach(b => b.style.height = '5%');
            return;
        }
        analyser.getByteFrequencyData(dataArray);
        for (let i = 0; i < barCount; i++) {
            let value = dataArray[i % dataArray.length];
            let heightPercent = Math.max(5, (value / 255) * 100);
            bars[i].style.height = heightPercent + '%';
        }
    }

    volumeSlider.oninput = (e) => { 
        player.volume = e.target.value; 
        localStorage.setItem('spotisanya_volume', player.volume);
    };

    const savedVol = localStorage.getItem('spotisanya_volume');
    if (savedVol !== null) {
        player.volume = parseFloat(savedVol);
        volumeSlider.value = savedVol;
    }

    async function loadSongs(isBackground = false) {
        let loadedFromCloud = false;
        try {
            const response = await fetch(urlAPI, { headers: { 'X-Master-Key': API_KEY }});
            if (response.ok) {
                const result = await response.json();
                const cloudSongs = result.record.songs;
                if (Array.isArray(cloudSongs) && cloudSongs.length > 0) {
                    if (JSON.stringify(cloudSongs) !== JSON.stringify(currentSongs)) {
                        currentSongs = cloudSongs;
                        localStorage.setItem('spotisanya_cache', JSON.stringify(currentSongs));
                        renderList();
                    }
                    loadedFromCloud = true;
                }
            }
        } catch (err) {}

        // Fallback to local cache if cloud is empty
        if (!loadedFromCloud && currentSongs.length === 0) {
            const cached = localStorage.getItem('spotisanya_cache');
            if (cached) {
                try {
                    const parsed = JSON.parse(cached);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        currentSongs = parsed;
                        renderList();
                    }
                } catch(e) {}
            }
        }

        if (!isBackground) {
            renderList();
            const savedIndex = localStorage.getItem('spotisanya_index');
            const savedTime = localStorage.getItem('spotisanya_time');
            if (savedIndex !== null && currentSongs[savedIndex]) {
                currentIndex = parseInt(savedIndex);
                const song = currentSongs[currentIndex];
                player.src = song.url;
                trackNameText.textContent = song.title;
                updateCoverArt(song.title);
                renderList();
                if (savedTime !== null) player.currentTime = parseFloat(savedTime);
            }
        }
    }
    loadSongs();

    setInterval(() => loadSongs(true), 3000);

    async function syncCloud() {
        localStorage.setItem('spotisanya_cache', JSON.stringify(currentSongs));
        try {
            await fetch(urlAPI, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify({ songs: currentSongs })
            });
        } catch(err) {}
    }

    function updateCoverArt(title) {
        let hash = 0;
        for (let i = 0; i < title.length; i++) hash = title.charCodeAt(i) + ((hash << 5) - hash);
        const images = [
            'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=512&h=512&fit=crop',
            'https://images.unsplash.com/photo-1634017839464-5c339ebe3cb4?w=512&h=512&fit=crop',
            'https://images.unsplash.com/photo-1620641788421-7a1c342ea42e?w=512&h=512&fit=crop',
            'https://images.unsplash.com/photo-1618005198919-d3d4b5a92ead?w=512&h=512&fit=crop'
        ];
        albumImg.src = images[Math.abs(hash) % images.length];
    }

    function renderList() {
        const list = document.getElementById('list');
        list.innerHTML = '';
        
        const filteredSongs = currentSongs.map((song, originalIndex) => ({ ...song, originalIndex }))
            .filter(song => song.title.toLowerCase().includes(searchQuery.toLowerCase()));

        if (filteredSongs.length === 0) {
            list.innerHTML = '<li style="color: var(--text-muted); justify-content: center; display: flex; text-align: center; padding: 20px; background: transparent; border: none;">Список порожній. Натисніть "Відновити кеш" вище або додайте треки!</li>';
            return;
        }

        filteredSongs.forEach((song) => {
            const li = document.createElement('li');
            if (song.originalIndex === currentIndex) li.classList.add('active');

            li.innerHTML = `
                <span class="song-index">${song.originalIndex + 1}</span>
                <span class="song-name" title="${song.title}">${song.title}</span>
                <div class="action-btns">
                    <button class="action-btn" onclick="renameSong(event, ${song.originalIndex})" title="Редагувати">✏️</button>
                    <button class="action-btn del-btn" onclick="deleteSong(event, ${song.originalIndex})" title="Видалити">✕</button>
                </div>
            `;
            li.onclick = () => playSong(song.originalIndex);
            list.appendChild(li);
        });
    }

    searchInput.oninput = (e) => {
        searchQuery = e.target.value;
        renderList();
    };

    function playSong(index) {
        if (index < 0 || index >= currentSongs.length) return;

        currentIndex = index;
        const song = currentSongs[currentIndex];
        
        player.pause();
        player.src = song.url;
        player.load(); 

        initAudioVisualizer();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

        player.play().then(() => {
            playPauseBtn.textContent = '❚❚';
        }).catch(() => {
            playPauseBtn.textContent = '▶';
        });
        
        trackNameText.textContent = song.title;
        updateCoverArt(song.title);

        localStorage.setItem('spotisanya_index', currentIndex);
        renderList();
    }

    playPauseBtn.onclick = () => {
        if (currentSongs.length === 0) return;
        initAudioVisualizer();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

        if (player.paused) {
            if (!player.src) playSong(0);
            else {
                player.play().then(() => { playPauseBtn.textContent = '❚❚'; }).catch(() => {});
            }
        } else {
            player.pause();
            playPauseBtn.textContent = '▶';
        }
    };

    function getNextIndex() {
        if (currentSongs.length === 0) return 0;
        if (isShuffle) {
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * currentSongs.length);
            } while (randomIndex === currentIndex && currentSongs.length > 1);
            return randomIndex;
        } else {
            return (currentIndex + 1) % currentSongs.length;
        }
    }

    document.getElementById('next-btn').onclick = () => { if (currentSongs.length > 0) playSong(getNextIndex()); };
    document.getElementById('prev-btn').onclick = () => { if (currentSongs.length > 0) playSong((currentIndex - 1 + currentSongs.length) % currentSongs.length); };
    repeatBtn.onclick = () => { isRepeat = !isRepeat; repeatBtn.classList.toggle('active-mode', isRepeat); };
    shuffleBtn.onclick = () => { isShuffle = !isShuffle; shuffleBtn.classList.toggle('active-mode', isShuffle); };

    player.ontimeupdate = () => {
        if (player.duration) {
            progressBar.style.width = ((player.currentTime / player.duration) * 100) + '%';
            localStorage.setItem('spotisanya_time', player.currentTime);
        }
    };

    progressContainer.onclick = (e) => {
        if (player.duration) {
            player.currentTime = (e.offsetX / progressContainer.clientWidth) * player.duration;
        }
    };

    player.onended = () => {
        if (currentSongs.length === 0) return;
        if (isRepeat) playSong(currentIndex);
        else playSong(getNextIndex());
    };

    document.getElementById('add-btn').onclick = async () => {
        const titleInput = document.getElementById('title');
        const urlInput = document.getElementById('url');
        const title = titleInput.value.trim();
        const url = urlInput.value.trim();

        if (!url) return alert('Введіть посилання!');
        currentSongs.push({ title: title || url.split('/').pop() || 'Трек', url });

        titleInput.value = ''; urlInput.value = '';
        renderList();
        await syncCloud();
    };

    const folderBtn = document.getElementById('folder-btn');
    const folderInput = document.getElementById('folder-input');
    folderBtn.onclick = () => folderInput.click();
    folderInput.onchange = async (e) => {
        let added = 0;
        for (let file of e.target.files) {
            if (file.name.endsWith('.mp3') || file.name.endsWith('.wav')) {
                currentSongs.push({ title: file.name.replace(/\.[^/.]+$/, ""), url: URL.createObjectURL(file) });
                added++;
            }
        }
        if (added > 0) {
            renderList();
            if (!player.src) playSong(currentSongs.length - added);
            await syncCloud();
        }
        folderInput.value = '';
    };

    async function renameSong(event, index) {
        event.stopPropagation();
        const newTitle = prompt("Нова назва:", currentSongs[index].title);
        if (!newTitle || !newTitle.trim()) return;
        currentSongs[index].title = newTitle.trim();
        renderList();
        if (index === currentIndex) trackNameText.textContent = newTitle.trim();
        await syncCloud();
    }

    async function deleteSong(event, index) {
        event.stopPropagation();
        if (!confirm("Видалити трек?")) return;
        currentSongs.splice(index, 1);
        renderList();
        await syncCloud();
    }
</script>
</body>
</html>
