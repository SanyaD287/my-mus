<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Мій Музичний Плеєр</title>
    <!-- Підключаємо Supabase JS Client один раз -->
    <script src="https://cdn.jsdelivr.5net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            background: #121212; 
            color: white; 
            font-family: sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .box { 
            width: 350px; 
            background: #1e1e1e; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
        }
        input, button { 
            width: 100%; 
            margin-top: 10px; 
            padding: 10px; 
            border-radius: 6px; 
            border: 1px solid #333; 
            background: #2a2a2a; 
            color: #fff; 
            box-sizing: border-box; 
        }
        button { 
            background: #1db954; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
        }
        button:hover { 
            background: #1aa34a; 
        }
        ul { 
            list-style: none; 
            padding: 0; 
            max-height: 150px; 
            overflow-y: auto; 
            margin-top: 15px; 
        }
        li { 
            padding: 8px 0; 
            border-bottom: 1px solid #333; 
            cursor: pointer; 
            font-size: 14px; 
        }
        li:hover {
            color: #1db954;
        }
    </style>
</head>
<body>

<div class="box">
    <h3>Хмарний плейлист</h3>
    <audio id="player" controls style="width: 100%; margin-top: 10px;"></audio>
    
    <div style="margin-top: 15px;">
        <input type="text" id="title" placeholder="Назва пісні">
        <input type="file" id="file" accept="audio/*">
        <button id="upload-btn">Додати у плейлист</button>
    </div>

    <ul id="list"></ul>
</div>

<script>
    // Захист від повторного оголошення клієнта
    if (!window.supabaseClient) {
        window.supabaseClient = window.supabase.createClient(
            'https://ntuceyndohduottkkilz.supabase.co', 
            'sb_publishable_TK325X3RPCtJ385DvCgRG_RvP50dJg'
        );
    }
    const db = window.supabaseClient;

    // Функція завантаження списку пісень з бази даних
    async function loadSongs() {
        try {
            const { data, error } = await db.from('songs').select('*');
            if (error) throw error;

            const list = document.getElementById('list');
            list.innerHTML = '';
            
            if (!data || data.length === 0) {
                list.innerHTML = '<li style="color: #888; text-align: center; cursor: default;">Плейлист порожній</li>';
                return;
            }

            data.forEach(s => {
                const li = document.createElement('li');
                li.textContent = s.title;
                li.onclick = () => { 
                    const player = document.getElementById('player');
                    player.src = s.url; 
                    player.play(); 
                };
                list.appendChild(li);
            });
        } catch (err) {
            console.error('Помилка завантаження плейлиста:', err.message);
        }
    }

    // Обробник натискання на кнопку завантаження
    document.getElementById('upload-btn').addEventListener('click', async () => {
        const fileInput = document.getElementById('file');
        const titleInput = document.getElementById('title');
        const uploadBtn = document.getElementById('upload-btn');
        
        const file = fileInput.files[0];
        const title = titleInput.value.trim();

        if (!file || !title) {
            alert('Будь ласка, виберіть файл і введіть назву пісні!');
            return;
        }

        uploadBtn.textContent = 'Завантаження...';
        uploadBtn.disabled = true;

        try {
            // Безпечне ім'я файлу для сховища
            const fileExtension = file.name.split('.').pop();
            const fileName = `${Date.now()}_track.${fileExtension}`;

            // 1. Завантаження у сховище (бакет "song")
            const { error: uploadError } = await db.storage
                .from('song')
                .upload(fileName, file);

            if (uploadError) throw new Error('Помилка сховища: ' + uploadError.message);

            // 2. Отримання публічного посилання
            const { data: publicUrlData } = db.storage
                .from('song')
                .getPublicUrl(fileName);

            const publicUrl = publicUrlData.publicUrl;

            // 3. Запис інформації в таблицю бази даних "songs"
            const { error: dbError } = await db
                .from('songs')
                .insert([{ title: title, url: publicUrl }]);

            if (dbError) throw new Error('Помилка бази даних: ' + dbError.message);

            alert('Пісню успішно додано!');
            
            // Очищуємо поля форми
            fileInput.value = '';
            titleInput.value = '';
            
            // Оновлюємо список на екрані
            loadSongs();
        } catch (err) {
            console.error(err);
            alert(err.message);
        } finally {
            uploadBtn.textContent = 'Додати у плейлист';
            uploadBtn.disabled = false;
        }
    });

    // Завантажуємо список пісень при старті
    loadSongs();
</script>
</body>
</html>
