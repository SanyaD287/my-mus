<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotisanya - Cyber Glass Edition</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- АНІМОВАНИЙ ГРАДІЄНТНИЙ ФОН --- */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(120deg, #1d0709, #0a0a0a, #150406, #050505);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            z-index: -1;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- ДЕСКТОПНИЙ МАКЕТ (ПК) --- */
        .desktop-layout {
            display: grid;
            grid-template-columns: 240px 1fr;
            grid-template-rows: 1fr 90px;
            height: 100vh;
            width: 100vw;
        }

        /* Бічна панель з ефектом скла (Glassmorphism) */
        .sidebar {
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            grid-row: 1 / 2;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.5px;
        }
        .logo span {
            color: var(--accent-color, #ff1e2d);
            text-shadow: 0 0 12px var(--accent-color, #ff1e2d);
        }
        .nav-link {
            color: #aaa;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: color 0.2s;
            cursor: pointer;
        }
        .nav-link:hover, .nav-link.active {
            color: #fff;
        }

        /* Блок вибору теми (скляний стиль) */
        .theme-switcher {
            margin-top: auto;
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(10px);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .theme-title {
            font-size: 11px;
            color: #777;
            text-transform: uppercase;
            font-weight: 700;
        }
        .theme-buttons {
            display: flex;
            gap: 6px;
        }
        .theme-btn {
            flex: 1;
            padding: 6px;
            border: none;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, filter 0.2s;
        }
        .theme-btn:hover {
            transform: scale(1.05);
            filter: brightness(1.2);
        }
        .theme-red { background: #ff1e2d; color: #fff; }
        .theme-purple { background: #9b51e0; color: #fff; }
        .theme-blue { background: #2f80ed; color: #fff; }

        /* Основна область контенту */
        .main-content {
            padding: 24px 32px;
            overflow-y: auto;
            grid-column: 2 / 3;
            grid-row: 1 / 2;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .section-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 16px;
        }

        /* Скляна картка додавання треків */
        .add-card {
            background: rgba(18, 18, 18, 0.65);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 16px;
            border-radius: 12px;
            display: flex;
            gap: 12px;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        input {
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(30, 30, 30, 0.7);
            color: #fff;
            font-size: 14px;
            outline: none;
            flex: 1;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus {
            border-color: var(--accent-color, #ff1e2d);
            box-shadow: 0 0 10px var(--accent-color, #ff1e2d);
        }
        button#add-btn {
            background: var(--accent-color, #ff1e2d);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 500px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }
        button#add-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 0 15px var(--accent-color, #ff1e2d);
        }

        /* Список треків */
        .playlist-header {
            display: grid;
            grid-template-columns: 40px 1fr 50px;
            color: #777;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 0 16px 8px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 8px;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        li {
            display: grid;
            grid-template-columns: 40px 1fr 50px;
            align-items: center;
            padding: 10px 16px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.02);
            transition: background 0.2s;
            cursor: pointer;
            border: 1px solid transparent;
        }
        li:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.05);
        }
        li.active {
            background: rgba(255, 255, 255, 0.08);
            border-left: 4px solid var(--accent-color, #ff1e2d);
            border-color: rgba(255, 255, 255, 0.1);
        }
        li.active .song-name {
            color: var(--accent-color, #ff1e2d);
            font-weight: 700;
        }
        .song-index {
            color: #666;
            font-size: 14px;
        }
        .song-name {
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
        }
        .del-btn {
            background: transparent;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.2s, color 0.2s;
        }
        li:hover .del-btn {
            opacity: 1;
        }
        .del-btn:hover {
            color: var(--accent-color, #ff1e2d);
        }

        /* Еквалайзер для активного треку */
        .equalizer {
            display: none;
            align-items: flex-end;
            gap: 2px;
            width: 14px;
            height: 14px;
        }
        li.active .song-index { display: none; }
        li.active .equalizer { display: flex; }
        .bar {
            width: 3px;
            background: var(--accent-color, #ff1e2d);
            animation: bounce 0.6s infinite alternate;
        }
        .bar:nth-child(2) { animation-delay: 0.2s; }
        .bar:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0% { height: 3px; }
            100% { height: 14px; }
        }

        /* --- ВІНІЛОВА ПЛАСТИНКА (Обкладинка-анімація) --- */
        .vinyl-container {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #111;
            border: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            flex-shrink: 0;
        }
        .vinyl-container.playing {
            animation: spinVinyl 3s linear infinite;
        }
        .vinyl-inner {
            width: 12px;
            height: 12px;
            background: var(--accent-color, #ff1e2d);
            border-radius: 50%;
            border: 2px solid #fff;
        }
        @keyframes spinVinyl {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Нижня панель плеєра (Glassmorphism) */
        .spotify-player-bar {
            grid-column: 1 / 3;
            grid-row: 2 / 3;
            background: rgba(12, 12, 12, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 10;
        }
        .current-info {
            width: 30%;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .current-text-wrap {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
        }
        .current-title {
            font-size: 14px;
            font-weight: 500;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .current-artist {
            font-size: 11px;
            color: #777;
        }

        /* Центр керування плеєром */
        .player-center-controls {
            width: 40%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .player-buttons {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .ctrl-btn {
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 16px;
            cursor: pointer;
            transition: color 0.2s, transform 0.1s;
        }
        .ctrl-btn:hover {
            color: #fff;
            transform: scale(1.1);
        }
        .play-pause-btn {
            width: 38px;
            height: 38px;
            background: var(--accent-color, #ff1e2d);
            color: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 13px;
            box-shadow: 0 0 15px var(--accent-color, #ff1e2d);
            transition: transform 0.1s, filter 0.2s;
        }
        .play-pause-btn:hover {
            transform: scale(1.08);
            filter: brightness(1.2);
        }

        /* Таймлайн */
        .progress-bar-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 500px;
        }
        .time-text {
            font-size: 11px;
            color: #777;
            min-width: 35px;
            text-align: center;
        }
        .progress-container {
            flex: 1;
            height: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: var(--accent-color, #ff1e2d);
            border-radius: 3px;
            width: 0%;
            position: relative;
        }

        .extra-controls {
            width: 30%;
        }

        /* --- АДАПТИВНІСТЬ ДЛЯ ТЕЛЕФОНІВ З КАСТОМНИМИ КНОПКАМИ --- */
        @media (max-width: 768px) {
            .desktop-layout {
                display: flex;
                flex-direction: column;
                height: 100vh;
            }
            .sidebar {
                display: none;
            }
            .main-content {
                flex: 1;
                padding: 16px 16px 130px 16px;
                overflow-y: auto;
            }
            .spotify-player-bar {
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                height: 115px;
                flex-direction: column;
                justify-content: center;
                gap: 8px;
                padding: 10px 16px;
                background: rgba(12, 12, 12, 0.9);
                backdrop-filter: blur(25px);
            }
            .current-info {
                width: 100%;
                gap: 10px;
            }
            .current-title {
                font-size: 13px;
            }
            .player-center-controls {
                width: 100%;
                flex-direction: column;
                gap: 6px;
            }
            .player-buttons {
                gap: 32px; /* Зручна відстань між кнопками */
            }
            .progress-bar-wrapper {
                display: flex;
                width: 100%;
                max-width: 100%;
            }
            .extra-controls {
                display: none;
            }
            
            /* КАСТОМНІ КНОПКИ ДЛЯ ТЕЛЕФОНІВ (повністю авторські, без стандартних системних рамки/стилю) */
            .ctrl-btn {
                background: rgba(255, 255, 255, 0.08);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 50%;
                width: 36px;
                height: 36px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 14px;
                color: #fff;
                box-shadow: 0 4px 10px rgba(0,0,0,0.3);
                transition: background 0.2s, transform 0.1s;
            }
            .ctrl-btn:active {
                transform: scale(0.9);
                background: rgba(255, 255, 255, 0.2);
            }
            .play-pause-btn {
                width: 44px;
                height: 44px;
                font-size: 16px;
                background: var(--accent-color, #ff1e2d);
                border: none;
                border-radius: 50%;
                box-shadow: 0 0 15px var(--accent-color, #ff1e2d);
            }

            .add-card {
                flex-direction: column;
            }
            button#add-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body style="--accent-color: #ff1e2d;">

<!-- Живий анімований фон -->
<div class="animated-bg"></div>

<div class="desktop-layout">
    <!-- Бічна панель (ПК) -->
    <div class="sidebar">
        <div class="logo"><span id="logo-icon">🔴</span> Spotisanya</div>
        <div class="nav-link active">🏠 Головна</div>
        <div class="nav-link">🎵 Мій плейлист</div>

        <!-- Вибір теми оформлення -->
        <div class="theme-switcher">
            <div class="theme-title">Тема неону</div>
            <div class="theme-buttons">
                <button class="theme-btn theme-red" onclick="setTheme('#ff1e2d', '🔴')">Red</button>
                <button class="theme-btn theme-purple" onclick="setTheme('#9b51e0', '🟣')">Purple</button>
                <button class="theme-btn theme-blue" onclick="setTheme('#2f80ed', '🔵')">Blue</button>
            </div>
        </div>
    </div>

    <!-- Основний контент -->
    <div class="main-content">
        <div class="section-title">Додати трек до хмари</div>
        <div class="add-card">
            <input type="text" id="title" placeholder="Назва треку">
            <input type="text" id="url" placeholder="Пряме посилання на MP3">
            <button id="add-btn">Додати</button>
        </div>

        <div style="margin-top: 16px;">
            <div class="section-title">Треки у плейлисті</div>
            <div class="playlist-header">
                <div>#</div>
                <div>Назва</div>
                <div>✕</div>
            </div>
            <ul id="list"></ul>
        </div>
    </div>

    <!-- Нижня панель плеєра -->
    <div class="spotify-player-bar">
        <div class="current-info">
            <div class="vinyl-container" id="vinyl-disc">
                <div class="vinyl-inner"></div>
            </div>
            <div class="current-text-wrap">
                <div class="current-title" id="current-song-title">Нічого не вибрано</div>
                <div class="current-artist">Spotisanya Cloud</div>
            </div>
        </div>

        <div class="player-center-controls">
            <div class="player-buttons">
                <button class="ctrl-btn" id="prev-btn" title="Попередня">⏮</button>
                <button class="ctrl-btn play-pause-btn" id="play-pause-btn" title="Грати/Пауза">▶</button>
                <button class="ctrl-btn" id="next-btn" title="Наступна">⏭</button>
            </div>
            <div class="progress-bar-wrapper">
                <span class="time-text" id="current-time">0:00</span>
                <div class="progress-container" id="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <span class="time-text" id="duration-time">0:00</span>
            </div>
        </div>

        <div class="extra-controls"></div>
    </div>
</div>

<audio id="player"></audio>

<script>
    const BIN_ID = '6a7c3536da38895dfed9948e'; 
    const API_KEY = '$2a$10$RZSWlrF3nSMRAsv5Jlk1MOHs4qBWJ6ItuOqlU9rE1KSeii4Ck2XFu'; 
    const urlAPI = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    let currentSongs = [];
    let currentIndex = 0;
    const player = document.getElementById('player');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const progressBar = document.getElementById('progress-bar');
    const progressContainer = document.getElementById('progress-container');
    const currentSongTitle = document.getElementById('current-song-title');
    const currentTimeEl = document.getElementById('current-time');
    const durationTimeEl = document.getElementById('duration-time');
    const vinylDisc = document.getElementById('vinyl-disc');

    function setTheme(color, icon) {
        document.body.style.setProperty('--accent-color', color);
        document.getElementById('logo-icon').textContent = icon;
        localStorage.setItem('spotisanya_theme', JSON.stringify({ color, icon }));
    }

    const savedTheme = localStorage.getItem('spotisanya_theme');
    if (savedTheme) {
        const t = JSON.parse(savedTheme);
        setTheme(t.color, t.icon);
    }

    function formatTime(seconds) {
        if (isNaN(seconds)) return "0:00";
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    async function loadSongs() {
        try {
            const response = await fetch(urlAPI, { headers: { 'X-Master-Key': API_KEY }});
            const result = await response.json();
            currentSongs = result.record.songs || [];
            renderList();
        } catch (err) {
            console.error('Помилка завантаження:', err);
        }
    }

    function renderList() {
        const list = document.getElementById('list');
        list.innerHTML = '';
        
        if (currentSongs.length === 0) {
            list.innerHTML = '<li style="color: #666; justify-content: center; cursor: default; display: block; text-align: center; padding: 20px;">Плейлист порожній</li>';
            return;
        }

        currentSongs.forEach((song, index) => {
            const li = document.createElement('li');
            if (index === currentIndex) li.classList.add('active');

            li.innerHTML = `
                <span class="song-index">${index + 1}</span>
                <div class="equalizer">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
                <span class="song-name" title="${song.title}">${song.title}</span>
                <button class="del-btn" onclick="deleteSong(event, ${index})">✕</button>
            `;
            li.onclick = () => playSong(index);
            list.appendChild(li);
        });
    }

    function playSong(index) {
        if (index < 0 || index >= currentSongs.length) return;
        currentIndex = index;
        const song = currentSongs[currentIndex];
        
        player.src = song.url;
        player.play();
        currentSongTitle.textContent = song.title;
        playPauseBtn.textContent = '❚❚';
        vinylDisc.classList.add('playing');
        renderList();
        updateMediaSession(song);
    }

    playPauseBtn.onclick = (e) => {
        e.stopPropagation();
        if (currentSongs.length === 0) return;
        if (player.paused) {
            if (!player.src && currentSongs.length > 0) {
                playSong(0);
            } else {
                player.play();
                vinylDisc.classList.add('playing');
            }
            playPauseBtn.textContent = '❚❚';
        } else {
            player.pause();
            vinylDisc.classList.remove('playing');
            playPauseBtn.textContent = '▶';
        }
    };

    document.getElementById('next-btn').onclick = (e) => {
        e.stopPropagation();
        if (currentSongs.length === 0) return;
        let nextIndex = (currentIndex + 1) % currentSongs.length;
        playSong(nextIndex);
    };

    document.getElementById('prev-btn').onclick = (e) => {
        e.stopPropagation();
        if (currentSongs.length === 0) return;
        let prevIndex = (currentIndex - 1 + currentSongs.length) % currentSongs.length;
        playSong(prevIndex);
    };

    player.ontimeupdate = () => {
        if (player.duration) {
            const percent = (player.currentTime / player.duration) * 100;
            progressBar.style.width = percent + '%';
            currentTimeEl.textContent = formatTime(player.currentTime);
            durationTimeEl.textContent = formatTime(player.duration);
        }
    };

    progressContainer.onclick = (e) => {
        const width = progressContainer.clientWidth;
        const clickX = e.offsetX;
        if (player.duration) {
            player.currentTime = (clickX / width) * player.duration;
        }
    };

    player.onended = () => {
        let nextIndex = (currentIndex + 1) % currentSongs.length;
        if (currentSongs.length > 0) {
            playSong(nextIndex);
        }
    };

    function updateMediaSession(song) {
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: song.title,
                artist: 'Spotisanya',
                album: 'Мій плейлист'
            });

            navigator.mediaSession.setActionHandler('nexttrack', () => {
                let nextIndex = (currentIndex + 1) % currentSongs.length;
                playSong(nextIndex);
            });

            navigator.mediaSession.setActionHandler('previoustrack', () => {
                let prevIndex = (currentIndex - 1 + currentSongs.length) % currentSongs.length;
                playSong(prevIndex);
            });
            
            navigator.mediaSession.setActionHandler('play', () => {
                player.play();
                vinylDisc.classList.add('playing');
                playPauseBtn.textContent = '❚❚';
            });
            navigator.mediaSession.setActionHandler('pause', () => {
                player.pause();
                vinylDisc.classList.remove('playing');
                playPauseBtn.textContent = '▶';
            });
        }
    }

    async function deleteSong(event, index) {
        event.stopPropagation();
        try {
            const res = await fetch(urlAPI, { headers: { 'X-Master-Key': API_KEY }});
            const data = await res.json();
            let songs = data.record.songs;
            songs.splice(index, 1);
            
            await fetch(urlAPI, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify({ songs })
            });
            loadSongs();
        } catch (err) {
            alert('Помилка видалення');
        }
    }

    document.getElementById('add-btn').onclick = async () => {
        const title = document.getElementById('title').value.trim();
        const url = document.getElementById('url').value.trim();
        if (!title || !url) {
            alert('Заповніть обидва поля!');
            return;
        }
        
        try {
            const res = await fetch(urlAPI, { headers: { 'X-Master-Key': API_KEY }});
            const data = await res.json();
            const songs = data.record.songs || [];
            songs.push({ title, url });
            
            const updateRes = await fetch(urlAPI, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify({ songs })
            });

            if (updateRes.ok) {
                document.getElementById('title').value = '';
                document.getElementById('url').value = '';
                loadSongs();
            } else {
                alert('Помилка збереження');
            }
        } catch (err) {
            alert('Помилка: ' + err.message);
        }
    };

    loadSongs();
</script>
</body>
</html>
