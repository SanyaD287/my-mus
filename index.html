<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpotiSanya • Clean Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        :root {
            --accent: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.25);
            --accent-gradient: linear-gradient(135deg, #00ff88 0%, #00b8ff 100%);
            
            --bg-main: #070709;
            --bg-surface: rgba(18, 18, 24, 0.7);
            --bg-surface-hover: rgba(28, 28, 38, 0.85);
            
            --border-color: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(0, 255, 136, 0.3);
            
            --text-main: #f3f4f6;
            --text-muted: #8b8d98;
            
            --blur-glass: blur(20px);
            --font-family: 'Plus Jakarta Sans', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: var(--font-family);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .app-layout {
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* Бічна панель плейлистів */
        .sidebar {
            width: 260px;
            background: rgba(12, 12, 16, 0.85);
            backdrop-filter: var(--blur-glass);
            -webkit-backdrop-filter: var(--blur-glass);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 24px 16px;
            gap: 16px;
            z-index: 5;
            flex-shrink: 0;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-left: 4px;
        }

        .playlists-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
            flex: 1;
        }

        .playlist-item {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .playlist-item:hover {
            background: var(--bg-surface-hover);
            color: var(--text-main);
        }

        .playlist-item.active {
            background: var(--accent-glow);
            color: var(--accent);
            border: 1px solid var(--border-hover);
        }

        .playlist-del {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 12px;
            padding: 4px 6px;
            border-radius: 4px;
            box-shadow: none;
        }
        .playlist-del:hover {
            color: #ff4757;
            background: rgba(255, 71, 87, 0.1);
            transform: none;
        }

        .create-playlist-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed var(--border-color);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: none;
            transition: all 0.2s;
        }
        .create-playlist-btn:hover {
            border-color: var(--accent);
            background: var(--accent-glow);
            color: var(--accent);
            transform: none;
            filter: none;
        }

        /* Основний контент */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .main-content {
            padding: 40px 48px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 28px;
            padding-bottom: 180px;
        }

        .main-content::-webkit-scrollbar { width: 8px; }
        .main-content::-webkit-scrollbar-track { background: transparent; }
        .main-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
        .main-content::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 12px;
        }

        .add-card {
            background: var(--bg-surface);
            backdrop-filter: var(--blur-glass);
            -webkit-backdrop-filter: var(--blur-glass);
            padding: 24px;
            border-radius: 20px;
            display: flex;
            gap: 14px;
            align-items: center;
            border: 1px solid var(--border-color);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
            flex-wrap: wrap;
        }
        .add-card:focus-within { border-color: var(--border-hover); }

        input[type="text"] {
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-main);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            flex: 1;
            transition: all 0.3s;
        }
        input[type="text"]:focus { 
            border-color: var(--accent); 
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        button {
            background: var(--accent-gradient);
            color: #070709;
            border: none;
            padding: 14px 28px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 4px 20px var(--accent-glow);
            transition: transform 0.2s, filter 0.2s;
        }
        button:hover { filter: brightness(1.15); transform: translateY(-2px); }
        button:active { transform: translateY(0); }

        .secondary-btn {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            box-shadow: none;
        }
        .secondary-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255,255,255,0.15); }

        .drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            background: rgba(255, 255, 255, 0.01);
            transition: all 0.3s;
            cursor: pointer;
        }
        .drop-zone:hover {
            border-color: var(--accent);
            background: var(--accent-glow);
            color: var(--text-main);
        }

        .playlist-header {
            display: grid;
            grid-template-columns: 48px 1fr 140px;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 0 20px 12px 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 8px;
        }

        ul.songs-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        li {
            display: grid;
            grid-template-columns: 48px 1fr 140px;
            align-items: center;
            padding: 14px 20px;
            border-radius: 14px;
            background: var(--bg-surface);
            backdrop-filter: var(--blur-glass);
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: all 0.25s;
        }
        li:hover { 
            background: var(--bg-surface-hover); 
            border-color: var(--border-hover);
            transform: translateX(4px);
        }
        li.active {
            background: var(--accent-glow);
            border-color: var(--accent);
            box-shadow: 0 0 25px var(--accent-glow);
        }
        li.active .song-name { color: var(--accent); font-weight: 700; }
        
        .song-index { color: var(--text-muted); font-size: 14px; font-weight: 600; }
        .song-name {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 15px;
        }
        
        .action-btns {
            display: flex;
            gap: 4px;
            justify-content: flex-end;
            opacity: 0.4;
            transition: opacity 0.2s;
            position: relative;
        }
        li:hover .action-btns { opacity: 1; }

        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 13px;
            padding: 8px;
            border-radius: 8px;
            transition: background 0.2s, color 0.2s;
            box-shadow: none;
        }
        .action-btn:hover { background: rgba(255, 255, 255, 0.1); color: var(--text-main); transform: none; }
        .del-btn:hover { color: #ff4757 !important; background: rgba(255, 71, 87, 0.1) !important; }

        /* Випадаюче меню для додавання треку в плейлист */
        .playlist-menu {
            position: absolute;
            right: 0;
            top: 100%;
            background: #141419;
            border: 1px solid var(--border-hover);
            border-radius: 12px;
            padding: 6px;
            display: none;
            flex-direction: column;
            gap: 4px;
            z-index: 100;
            min-width: 150px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .playlist-menu.show { display: flex; }
        .playlist-option {
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 8px 12px;
            font-size: 12px;
            text-align: left;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: none;
            transition: background 0.2s;
        }
        .playlist-option:hover {
            background: var(--accent-glow);
            color: var(--accent);
            transform: none;
            filter: none;
        }

        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 10, 13, 0.9);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 48px;
            gap: 24px;
            z-index: 10;
            box-shadow: 0 -20px 40px rgba(0,0,0,0.6);
        }

        .current-info {
            width: 25%;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-center {
            width: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .ctrl-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 16px;
            cursor: pointer;
            padding: 6px;
            box-shadow: none;
            transition: color 0.2s, transform 0.2s;
        }
        .ctrl-btn:hover { color: var(--text-main); transform: scale(1.15); filter: none; }
        .ctrl-btn.active-mode { color: var(--accent); }

        .play-pause-btn {
            width: 44px;
            height: 44px;
            background: var(--accent-gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #070709;
            font-size: 14px;
            font-weight: 800;
            box-shadow: 0 4px 20px var(--accent-glow);
            transition: transform 0.2s, filter 0.2s;
        }
        .play-pause-btn:hover { filter: brightness(1.15); transform: scale(1.08); }

        .progress-container {
            width: 100%;
            max-width: 550px;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: var(--accent-gradient);
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .volume-wrapper {
            width: 25%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
        }
        .volume-slider {
            width: 110px;
            height: 4px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .expand-mobile-btn {
            display: none;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
        }

        @media (max-width: 768px) {
            .app-layout { flex-direction: column; overflow-y: auto; }
            .sidebar { width: 100%; height: auto; max-height: 220px; padding: 16px; }
            body { overflow-y: auto; }
            .main-content { padding: 20px; padding-bottom: 120px; gap: 20px; }
            .drop-zone, .playlist-header, .volume-wrapper { display: none !important; }
            .header-top { justify-content: space-between; margin-bottom: 5px; }
            .expand-mobile-btn { display: block; }

            .player-bar {
                position: fixed;
                bottom: 0; left: 0; width: 100%;
                background: rgba(13, 13, 18, 0.95);
                backdrop-filter: blur(20px);
                flex-direction: column;
                padding: 12px 16px;
                gap: 8px;
                z-index: 100;
            }
            .player-bar.expanded {
                height: 65vh;
                justify-content: space-evenly;
                border-top-left-radius: 24px;
                border-top-right-radius: 24px;
            }
            .player-bar.expanded .volume-wrapper {
                display: flex !important;
                width: 100%;
                justify-content: center;
            }
            .player-bar.expanded .volume-slider { width: 200px; }
            .player-bar.expanded .expand-mobile-btn { transform: rotate(180deg); }

            .current-info {
                width: 100%;
                font-size: 15px;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .player-center { width: 100%; gap: 6px; }
            .player-controls { gap: 20px; }
            .ctrl-btn { font-size: 18px; }
            .play-pause-btn { width: 42px; height: 42px; }
            .progress-container { max-width: 100%; height: 5px; }
            li { grid-template-columns: 36px 1fr 110px; padding: 12px 14px; }
        }
    </style>
</head>
<body>

<div class="app-layout">
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="section-title" style="margin-bottom: 0;">Плейлисти</div>
        </div>
        <button class="create-playlist-btn" id="create-playlist-btn">
            <span>+</span> Створити плейлист
        </button>
        <ul class="playlists-list" id="playlists-list-el">
            </ul>
    </div>

    <div class="content-area">
        <div class="main-content">
            <div class="header-top">
                <div class="app-title">⚡ SpotiSanya</div>
            </div>

            <div>
                <div class="section-title">Додати трек або джерело</div>
                <div class="add-card">
                    <input type="text" id="title" placeholder="Введіть назву треку...">
                    <input type="text" id="url" placeholder="Посилання на MP3 або потік...">
                    <button id="add-btn">Додати</button>
                    <input type="file" id="folder-input" webkitdirectory directory multiple style="display: none;">
                    <button id="folder-btn" class="secondary-btn">📂 Обрати папку</button>
                </div>
            </div>

            <div class="drop-zone" id="drop-zone">
                📥 Перетягніть ваші MP3 файли сюди
            </div>

            <div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <div class="section-title" id="active-playlist-title" style="margin-bottom: 0;">Всі треки</div>
                    <input type="text" id="search-input" placeholder="🔍 Швидкий пошук..." style="max-width: 240px; padding: 10px 16px; font-size: 13px;">
                </div>
                <div class="playlist-header">
                    <div>#</div>
                    <div>Назва треку</div>
                    <div style="text-align: right;">Дії</div>
                </div>
                <ul class="songs-list" id="list"></ul>
            </div>
        </div>

        <div class="player-bar" id="player-bar">
            <div class="current-info" id="current-song-title">
                <span>Нічого не грає</span>
                <button class="expand-mobile-btn" id="expand-btn">▲</button>
            </div>
            
            <div class="player-center">
                <div class="player-controls">
                    <button class="ctrl-btn" id="shuffle-btn" title="Випадковий порядок">🔀</button>
                    <button class="ctrl-btn" id="repeat-btn" title="Повтор треку">🔁</button>
                    <button class="ctrl-btn" id="prev-btn" title="Попередній">⏮</button>
                    <button class="ctrl-btn play-pause-btn" id="play-pause-btn" title="Грати / Пауза">▶</button>
                    <button class="ctrl-btn" id="next-btn" title="Наступний">⏭</button>
                </div>
                <div class="progress-container" id="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
            </div>

            <div class="volume-wrapper">
                <span>🔊</span>
                <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="1">
            </div>
        </div>
    </div>
</div>

<audio id="player" preload="auto" playsinline></audio>

<script>
    const BIN_ID = '6a7c3536da38895dfed9948e'; 
    const API_KEY = '$2a$10$RZSWlrF3nSMRAsv5Jlk1MOHs4qBWJ6ItuOqlU9rE1KSeii4Ck2XFu'; 
    const urlAPI = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    let currentSongs = [];
    let customPlaylists = []; 
    let currentPlaylistId = 'all'; 
    let currentIndex = 0;
    let searchQuery = '';
    let isRepeat = false;
    let isShuffle = false;

    const player = document.getElementById('player');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const progressBar = document.getElementById('progress-bar');
    const progressContainer = document.getElementById('progress-container');
    const currentSongTitle = document.getElementById('current-song-title');
    const volumeSlider = document.getElementById('volume-slider');
    const searchInput = document.getElementById('search-input');
    const repeatBtn = document.getElementById('repeat-btn');
    const shuffleBtn = document.getElementById('shuffle-btn');
    const playerBar = document.getElementById('player-bar');
    const expandBtn = document.getElementById('expand-btn');
    const createPlaylistBtn = document.getElementById('create-playlist-btn');
    const playlistsListEl = document.getElementById('playlists-list-el');
    const activePlaylistTitle = document.getElementById('active-playlist-title');

    expandBtn.onclick = (e) => {
        e.stopPropagation();
        playerBar.classList.toggle('expanded');
    };

    volumeSlider.oninput = (e) => { 
        player.volume = e.target.value; 
        localStorage.setItem('spotisanya_volume', player.volume);
    };

    const savedVol = localStorage.getItem('spotisanya_volume');
    if (savedVol !== null) {
        player.volume = parseFloat(savedVol);
        volumeSlider.value = savedVol;
    }

    function loadPlaylistsFromCache() {
        const saved = localStorage.getItem('spotisanya_playlists');
        if (saved) {
            try { customPlaylists = JSON.parse(saved); } catch(e) {}
        }
    }
    loadPlaylistsFromCache();

    function savePlaylistsCache() {
        localStorage.setItem('spotisanya_playlists', JSON.stringify(customPlaylists));
    }

    async function loadSongs() {
        loadFromCache();
        try {
            const response = await fetch(urlAPI, { headers: { 'X-Master-Key': API_KEY }});
            if (!response.ok) throw new Error('Помилка завантаження з хмари');
            const result = await response.json();
            const cloudSongs = result.record.songs;
            const cloudPlaylists = result.record.playlists;

            if (Array.isArray(cloudSongs)) {
                currentSongs = cloudSongs.map((s, i) => ({ id: s.id || ('song_' + i + '_' + Date.now()), ...s }));
                localStorage.setItem('spotisanya_cache', JSON.stringify(currentSongs));
            }
            if (Array.isArray(cloudPlaylists)) {
                customPlaylists = cloudPlaylists;
                savePlaylistsCache();
            }
        } catch (err) {
            console.warn('Використовуємо локальний кеш:', err);
        }
        renderPlaylistsSidebar();
        renderList();
        
        const savedIndex = localStorage.getItem('spotisanya_index');
        const savedTime = localStorage.getItem('spotisanya_time');
        if (savedIndex !== null && currentSongs[savedIndex]) {
            currentIndex = parseInt(savedIndex);
            const song = currentSongs[currentIndex];
            player.src = song.url;
            
            const titleSpan = currentSongTitle.querySelector('span') || currentSongTitle;
            titleSpan.textContent = song.title;

            renderList();
            if (savedTime !== null) {
                player.currentTime = parseFloat(savedTime);
            }
        }
    }

    function loadFromCache() {
        const cached = localStorage.getItem('spotisanya_cache');
        if (cached) {
            try { 
                currentSongs = JSON.parse(cached).map((s, i) => ({ id: s.id || ('song_' + i), ...s })); 
            } catch(e) {}
        }
    }
    loadSongs();

    async function syncCloud() {
        localStorage.setItem('spotisanya_cache', JSON.stringify(currentSongs));
        savePlaylistsCache();
        try {
            await fetch(urlAPI, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify({ songs: currentSongs, playlists: customPlaylists })
            });
        } catch(err) {
            console.error('Помилка синхронізації з хмарою:', err);
        }
    }

    function getActiveSongsList() {
        if (currentPlaylistId === 'all') {
            return currentSongs.map((song, originalIndex) => ({ ...song, originalIndex }));
        } else {
            const pl = customPlaylists.find(p => p.name === currentPlaylistId);
            if (!pl) return [];
            return pl.songIds
                .map(id => {
                    const originalIndex = currentSongs.findIndex(s => s.id === id);
                    if (originalIndex !== -1) return { ...currentSongs[originalIndex], originalIndex };
                    return null;
                })
                .filter(Boolean);
        }
    }

    function renderPlaylistsSidebar() {
        playlistsListEl.innerHTML = '';
        
        // Плейлист "Всі"
        const allLi = document.createElement('li');
        allLi.className = `playlist-item ${currentPlaylistId === 'all' ? 'active' : ''}`;
        allLi.innerHTML = `<span>🎵 Всі треки</span>`;
        allLi.onclick = () => {
            currentPlaylistId = 'all';
            activePlaylistTitle.textContent = 'Всі треки';
            renderPlaylistsSidebar();
            renderList();
        };
        playlistsListEl.appendChild(allLi);

        // Користувацькі плейлисти
        customPlaylists.forEach(pl => {
            const li = document.createElement('li');
            li.className = `playlist-item ${currentPlaylistId === pl.name ? 'active' : ''}`;
            li.innerHTML = `
                <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 8px;">📂 ${pl.name}</span>
                <button class="playlist-del" onclick="deletePlaylist(event, '${pl.name}')" title="Видалити плейлист">✕</button>
            `;
            li.onclick = () => {
                currentPlaylistId = pl.name;
                activePlaylistTitle.textContent = pl.name;
                renderPlaylistsSidebar();
                renderList();
            };
            playlistsListEl.appendChild(li);
        });
    }

    createPlaylistBtn.onclick = async () => {
        const name = prompt("Введіть назву нового плейлиста:");
        if (name && name.trim() !== "") {
            const trimmed = name.trim();
            if (trimmed.toLowerCase() === 'всі' || customPlaylists.some(p => p.name === trimmed)) {
                return alert('Плейлист з такою назвою вже існує!');
            }
            customPlaylists.push({ name: trimmed, songIds: [] });
            renderPlaylistsSidebar();
            await syncCloud();
        }
    };

    window.deletePlaylist = async function(event, name) {
        event.stopPropagation();
        if (confirm(`Видалити плейлист "${name}"?`)) {
            customPlaylists = customPlaylists.filter(p => p.name !== name);
            if (currentPlaylistId === name) {
                currentPlaylistId = 'all';
                activePlaylistTitle.textContent = 'Всі треки';
            }
            renderPlaylistsSidebar();
            renderList();
            await syncCloud();
        }
    };

    function renderList() {
        const list = document.getElementById('list');
        list.innerHTML = '';
        
        const activeList = getActiveSongsList();
        const filteredSongs = activeList.filter(song => song.title.toLowerCase().includes(searchQuery.toLowerCase()));

        if (filteredSongs.length === 0) {
            list.innerHTML = '<li style="color: var(--text-muted); justify-content: center; display: flex; text-align: center; padding: 24px; background: transparent; border: none; grid-column: span 3;">Список порожній або нічого не знайдено</li>';
            return;
        }

        filteredSongs.forEach((song, idx) => {
            const li = document.createElement('li');
            if (song.originalIndex === currentIndex) li.classList.add('active');

            let playlistsMenuHtml = '';
            if (customPlaylists.length > 0) {
                playlistsMenuHtml = `
                    <div class="playlist-menu" id="menu-${song.id}">
                        ${customPlaylists.map(pl => `
                            <button class="playlist-option" onclick="toggleSongInPlaylist(event, '${song.id}', '${pl.name}')">
                                ${pl.songIds.includes(song.id) ? '✓ ' : '+ '} ${pl.name}
                            </button>
                        `).join('')}
                    </div>
                `;
            }

            li.innerHTML = `
                <span class="song-index">${idx + 1}</span>
                <span class="song-name" title="${song.title}">${song.title}</span>
                <div class="action-btns">
                    ${customPlaylists.length > 0 ? `<button class="action-btn" onclick="toggleMenu(event, '${song.id}')" title="Додати в плейлист">＋</button>` : ''}
                    <button class="action-btn" onclick="renameSong(event, ${song.originalIndex})" title="Редагувати">✏️</button>
                    <button class="action-btn del-btn" onclick="deleteSong(event, ${song.originalIndex})" title="Видалити">✕</button>
                    ${playlistsMenuHtml}
                </div>
            `;
            li.onclick = () => playSong(song.originalIndex);
            list.appendChild(li);
        });
    }

    window.toggleMenu = function(event, songId) {
        event.stopPropagation();
        document.querySelectorAll('.playlist-menu').forEach(m => {
            if (m.id !== `menu-${songId}`) m.classList.remove('show');
        });
        const menu = document.getElementById(`menu-${songId}`);
        if (menu) menu.classList.toggle('show');
    };

    window.onclick = () => {
        document.querySelectorAll('.playlist-menu').forEach(m => m.classList.remove('show'));
    };

    window.toggleSongInPlaylist = async function(event, songId, playlistName) {
        event.stopPropagation();
        const pl = customPlaylists.find(p => p.name === playlistName);
        if (!pl) return;

        const indexInPl = pl.songIds.indexOf(songId);
        if (indexInPl > -1) {
            pl.songIds.splice(indexInPl, 1);
        } else {
            pl.songIds.push(songId);
        }
        renderList();
        await syncCloud();
    };

    searchInput.oninput = (e) => {
        searchQuery = e.target.value;
        renderList();
    };

    function updateMediaSession() {
        if ('mediaSession' in navigator && currentSongs.length > 0) {
            const song = currentSongs[currentIndex];
            
            navigator.mediaSession.metadata = new MediaMetadata({
                title: song.title,
                artist: 'SpotiSanya',
                album: currentPlaylistId === 'all' ? 'Всі треки' : currentPlaylistId
            });

            navigator.mediaSession.setActionHandler('play', () => { player.play(); playPauseBtn.textContent = '❚❚'; });
            navigator.mediaSession.setActionHandler('pause', () => { player.pause(); playPauseBtn.textContent = '▶'; });
            navigator.mediaSession.setActionHandler('previoustrack', () => { document.getElementById('prev-btn').click(); });
            navigator.mediaSession.setActionHandler('nexttrack', () => { document.getElementById('next-btn').click(); });
        }
    }

    function playSong(index) {
        if (index < 0 || index >= currentSongs.length) return;

        currentIndex = index;
        const song = currentSongs[currentIndex];
        
        player.src = song.url;
        player.play().then(() => {
            playPauseBtn.textContent = '❚❚';
        }).catch((err) => {
            console.warn("Автоматичне відтворення заблоковано:", err);
            playPauseBtn.textContent = '▶';
        });
        
        const titleSpan = currentSongTitle.querySelector('span') || currentSongTitle;
        titleSpan.textContent = song.title;

        localStorage.setItem('spotisanya_index', currentIndex);
        updateMediaSession();
        renderList();
    }

    playPauseBtn.onclick = () => {
        const activeList = getActiveSongsList();
        if (activeList.length === 0) return;
        if (player.paused) {
            if (!player.src) playSong(activeList[0].originalIndex);
            else player.play().then(() => { playPauseBtn.textContent = '❚❚'; }).catch(() => {});
        } else {
            player.pause();
            playPauseBtn.textContent = '▶';
        }
    };

    function getNextIndex() {
        const activeList = getActiveSongsList();
        if (activeList.length === 0) return currentIndex;

        const currentPos = activeList.findIndex(s => s.originalIndex === currentIndex);
        
        if (isShuffle) {
            let randomPos;
            do {
                randomPos = Math.floor(Math.random() * activeList.length);
            } while (randomPos === currentPos && activeList.length > 1);
            return activeList[randomPos].originalIndex;
        } else {
            const nextPos = (currentPos + 1) % activeList.length;
            return activeList[nextPos].originalIndex;
        }
    }

    function getPrevIndex() {
        const activeList = getActiveSongsList();
        if (activeList.length === 0) return currentIndex;

        const currentPos = activeList.findIndex(s => s.originalIndex === currentIndex);
        const prevPos = (currentPos - 1 + activeList.length) % activeList.length;
        return activeList[prevPos].originalIndex;
    }

    document.getElementById('next-btn').onclick = () => {
        const activeList = getActiveSongsList();
        if (activeList.length > 0) playSong(getNextIndex());
    };

    document.getElementById('prev-btn').onclick = () => {
        const activeList = getActiveSongsList();
        if (activeList.length > 0) playSong(getPrevIndex());
    };

    repeatBtn.onclick = () => {
        isRepeat = !isRepeat;
        repeatBtn.classList.toggle('active-mode', isRepeat);
    };

    shuffleBtn.onclick = () => {
        isShuffle = !isShuffle;
        shuffleBtn.classList.toggle('active-mode', isShuffle);
    };

    player.ontimeupdate = () => {
        if (player.duration) {
            progressBar.style.width = ((player.currentTime / player.duration) * 100) + '%';
            localStorage.setItem('spotisanya_time', player.currentTime);
        }
    };

    progressContainer.onclick = (e) => {
        if (player.duration) {
            player.currentTime = (e.offsetX / progressContainer.clientWidth) * player.duration;
        }
    };

    player.onended = () => {
        const activeList = getActiveSongsList();
        if (activeList.length === 0) return;
        if (isRepeat) {
            playSong(currentIndex);
        } else {
            playSong(getNextIndex());
        }
    };

    document.getElementById('add-btn').onclick = async () => {
        const titleInput = document.getElementById('title');
        const urlInput = document.getElementById('url');
        const title = titleInput.value.trim();
        const url = urlInput.value.trim();

        if (!url) return alert('Введіть посилання!');

        const newSongId = 'song_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
        const songTitle = title || (url.split('/').pop() || 'Трек');

        currentSongs.push({ id: newSongId, title: songTitle, url });

        titleInput.value = ''; 
        urlInput.value = '';
        renderList();
        await syncCloud();
    };

    const dropZoneEl = document.getElementById('drop-zone');
    dropZoneEl.ondragover = (e) => { e.preventDefault(); };
    dropZoneEl.ondrop = async (e) => {
        e.preventDefault();
        if (e.dataTransfer.files.length > 0) {
            const file = e.dataTransfer.files[0];
            if (file.type.includes('audio') || file.name.endsWith('.mp3')) {
                const newSongId = 'song_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
                const newIndex = currentSongs.length;
                currentSongs.push({ id: newSongId, title: file.name.replace(/\.[^/.]+$/, ""), url: URL.createObjectURL(file) });
                renderList();
                playSong(newIndex);
                await syncCloud();
            }
        }
    };

    const folderBtn = document.getElementById('folder-btn');
    const folderInput = document.getElementById('folder-input');
    folderBtn.onclick = () => folderInput.click();
    folderInput.onchange = async (e) => {
        let added = 0;
        let firstNewIndex = currentSongs.length;
        for (let file of e.target.files) {
            if (file.name.endsWith('.mp3') || file.name.endsWith('.wav')) {
                const newSongId = 'song_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
                currentSongs.push({ id: newSongId, title: file.name.replace(/\.[^/.]+$/, ""), url: URL.createObjectURL(file) });
                added++;
            }
        }
        if (added > 0) {
            renderList();
            if (!player.src) playSong(firstNewIndex);
            await syncCloud();
        }
        folderInput.value = '';
    };

    async function renameSong(event, index) {
        event.stopPropagation();
        const newTitle = prompt("Нова назва:", currentSongs[index].title);
        if (newTitle !== null && newTitle.trim() !== "") {
            currentSongs[index].title = newTitle.trim();
            renderList();
            if (index === currentIndex) {
                const titleSpan = currentSongTitle.querySelector('span') || currentSongTitle;
                titleSpan.textContent = currentSongs[index].title;
            }
            await syncCloud();
        }
    }

    async function deleteSong(event, index) {
        event.stopPropagation();
        if (confirm("Видалити цей трек зі списку?")) {
            const deletedSongId = currentSongs[index].id;
            currentSongs.splice(index, 1);
            
            customPlaylists.forEach(pl => {
                pl.songIds = pl.songIds.filter(id => id !== deletedSongId);
            });

            if (currentSongs.length === 0) {
                player.pause();
                player.src = '';
                currentSongTitle.querySelector('span').textContent = 'Нічого не грає';
                currentIndex = 0;
            } else if (index === currentIndex) {
                currentIndex = Math.min(index, currentSongs.length - 1);
                playSong(currentIndex);
            } else if (index < currentIndex) {
                currentIndex--;
            }
            renderPlaylistsSidebar();
            renderList();
            await syncCloud();
        }
    }
</script>
</body>
</html>
