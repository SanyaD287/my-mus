<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpotiSanya • Clean Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        :root {
            --accent: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.25);
            --accent-gradient: linear-gradient(135deg, #00ff88 0%, #00b8ff 100%);
            
            --bg-main: #070709;
            --bg-surface: rgba(18, 18, 24, 0.7);
            --bg-surface-hover: rgba(28, 28, 38, 0.85);
            --bg-card: #111116;
            
            --border-color: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(0, 255, 136, 0.3);
            
            --text-main: #f3f4f6;
            --text-muted: #8b8d98;
            
            --blur-glass: blur(20px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 184, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(0, 255, 136, 0.06) 0%, transparent 40%);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .app-layout {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        .main-content {
            padding: 40px 48px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 28px;
            padding-bottom: 180px;
        }

        .main-content::-webkit-scrollbar { width: 8px; }
        .main-content::-webkit-scrollbar-track { background: transparent; }
        .main-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
        .main-content::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 12px;
            filter: drop-shadow(0 0 25px rgba(0, 255, 136, 0.2));
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 12px;
        }

        .add-section-wrapper {
            transition: all 0.3s ease;
        }

        .add-card {
            background: var(--bg-surface);
            backdrop-filter: var(--blur-glass);
            -webkit-backdrop-filter: var(--blur-glass);
            padding: 24px;
            border-radius: 20px;
            display: flex;
            gap: 14px;
            align-items: center;
            border: 1px solid var(--border-color);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
            flex-wrap: wrap;
            transition: border-color 0.3s;
        }
        .add-card:focus-within { border-color: var(--border-hover); }

        input[type="text"] {
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-main);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            flex: 1;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        input[type="text"]:focus { 
            border-color: var(--accent); 
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        button {
            background: var(--accent-gradient);
            color: #070709;
            border: none;
            padding: 14px 28px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 4px 20px var(--accent-glow);
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), filter 0.2s;
        }
        button:hover { filter: brightness(1.15); transform: translateY(-2px); }
        button:active { transform: translateY(0); }

        .secondary-btn {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            box-shadow: none;
        }
        .secondary-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255,255,255,0.15); }

        .drop-zone {
            border: 2px dashed rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            background: rgba(255, 255, 255, 0.01);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }
        .drop-zone:hover {
            border-color: var(--accent);
            background: rgba(0, 255, 136, 0.02);
            color: var(--text-main);
            box-shadow: inset 0 0 20px var(--accent-glow);
        }

        .playlist-header {
            display: grid;
            grid-template-columns: 48px 1fr 120px;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 0 20px 12px 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 8px;
        }

        ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        li {
            display: grid;
            grid-template-columns: 48px 1fr 120px;
            align-items: center;
            padding: 14px 20px;
            border-radius: 14px;
            background: var(--bg-surface);
            backdrop-filter: var(--blur-glass);
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        li:hover { 
            background: var(--bg-surface-hover); 
            border-color: rgba(255, 255, 255, 0.12);
            transform: translateX(4px);
        }
        li.active {
            background: rgba(0, 255, 136, 0.07);
            border-color: var(--accent);
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.1);
        }
        li.active .song-name { color: var(--accent); font-weight: 700; text-shadow: 0 0 10px var(--accent-glow); }
        
        .song-index { color: var(--text-muted); font-size: 14px; font-weight: 600; }
        .song-name {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 15px;
            transition: color 0.2s;
        }
        
        .action-btns {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
            opacity: 0.4;
            transition: opacity 0.2s;
        }
        li:hover .action-btns { opacity: 1; }

        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 13px;
            padding: 8px;
            border-radius: 8px;
            transition: background 0.2s, color 0.2s;
        }
        .action-btn:hover { background: rgba(255, 255, 255, 0.1); color: var(--text-main); }
        .del-btn:hover { color: #ff4757 !important; background: rgba(255, 71, 87, 0.1) !important; }

        /* Vinyl Record Styles (PC) */
        .vinyl-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            user-select: none;
        }
        .vinyl-disc {
            width: 220px;
            height: 220px;
            background: #111;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 0 0 15px #1a1a1a, inset 0 0 0 20px #111, inset 0 0 0 35px #1c1c1c, inset 0 0 0 40px #111;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            animation: spin 10s linear infinite;
            animation-play-state: paused;
            transition: transform 0.1s ease-out;
        }
        .vinyl-disc.playing {
            animation-play-state: running;
        }
        .vinyl-disc:active { cursor: grabbing; }
        .vinyl-label {
            width: 80px;
            height: 80px;
            background: var(--accent-gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            position: relative;
        }
        .vinyl-hole {
            width: 16px;
            height: 16px;
            background: var(--bg-main);
            border-radius: 50%;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Player Bar */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 10, 13, 0.9);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 48px;
            gap: 24px;
            z-index: 10;
            box-shadow: 0 -20px 40px rgba(0,0,0,0.6);
            transition: transform 0.3s ease;
        }

        .current-info {
            width: 25%;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: -0.2px;
            cursor: pointer;
        }

        .player-center {
            width: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .ctrl-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 16px;
            cursor: pointer;
            padding: 6px;
            box-shadow: none;
            transition: color 0.2s, transform 0.2s;
        }
        .ctrl-btn:hover { color: var(--text-main); transform: scale(1.15); filter: none; }
        .ctrl-btn.active-mode { color: var(--accent); text-shadow: 0 0 10px var(--accent-glow); }

        .play-pause-btn {
            width: 44px;
            height: 44px;
            background: var(--accent-gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #070709;
            font-size: 14px;
            font-weight: 800;
            box-shadow: 0 4px 20px var(--accent-glow);
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), filter 0.2s;
        }
        .play-pause-btn:hover { filter: brightness(1.15); transform: scale(1.08); }

        .progress-container {
            width: 100%;
            max-width: 550px;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: var(--accent-gradient);
            border-radius: 3px;
            width: 0%;
            box-shadow: 0 0 10px var(--accent-glow);
            transition: width 0.1s linear;
        }

        .volume-wrapper {
            width: 25%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
        }
        .volume-slider {
            width: 110px;
            height: 4px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .expand-mobile-btn {
            display: none;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
            box-shadow: none;
        }

        /* Mobile Layout Adjustments */
        @media (max-width: 768px) {
            body { background: var(--bg-main); overflow-y: auto; }
            .app-layout { height: 100vh; }
            .main-content { padding: 20px; padding-bottom: 120px; gap: 20px; }
            .add-section-wrapper, .drop-zone, .playlist-header, .vinyl-container, .volume-wrapper {
                display: none !important;
            }
            .header-top { justify-content: space-between; margin-bottom: 5px; }
            
            .expand-mobile-btn {
                display: block;
            }

            /* Compact Player Bar at bottom for Mobile */
            .player-bar {
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                background: rgba(13, 13, 18, 0.95);
                backdrop-filter: blur(20px);
                flex-direction: column;
                padding: 12px 16px;
                gap
