<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Хмарний Плейлист</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { width: 350px; background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        input, button { width: 100%; margin-top: 10px; padding: 10px; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: #fff; box-sizing: border-box; }
        button { background: #1db954; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #1aa34a; }
        ul { list-style: none; padding: 0; margin-top: 15px; }
        li { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #333; font-size: 14px; }
        .del-btn { background: #e91e63; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; width: auto; margin-top: 0; }
        .song-name { cursor: pointer; flex-grow: 1; margin-right: 10px; }
    </style>
</head>
<body>

<div class="box">
    <h3>Мій Плейлист</h3>
    <audio id="player" controls style="width: 100%;"></audio>
    <input type="text" id="title" placeholder="Назва пісні">
    <input type="text" id="url" placeholder="Посилання на MP3">
    <button id="add-btn">Додати пісню</button>
    <ul id="list"></ul>
</div>

<script>
    const BIN_ID = '6a7c3536da38895dfed9948e'; 
    const API_KEY = '$2a$10$RZSWlrF3nSMRAsv5Jlk1MOHs4qBWJ6ItuOqlU9rE1KSeii4Ck2XFu'; 
    const urlAPI = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    async function loadSongs() {
        const response = await fetch(urlAPI, { headers: { 'X-Master-Key': API_KEY }});
        const result = await response.json();
        const songs = result.record.songs || [];
        const list = document.getElementById('list');
        list.innerHTML = '';
        
        songs.forEach((song, index) => {
            const li = document.createElement('li');
            li.innerHTML = `
                <span class="song-name">${song.title}</span>
                <button class="del-btn" onclick="deleteSong(${index})">Видалити</button>
            `;
            li.querySelector('.song-name').onclick = () => {
                const player = document.getElementById('player');
                player.src = song.url;
                player.play();
            };
            list.appendChild(li);
        });
    }

    async function deleteSong(index) {
        const res = await fetch(urlAPI, { headers: { 'X-Master-Key': API_KEY }});
        const data = await res.json();
        const songs = data.record.songs;
        songs.splice(index, 1);
        
        await fetch(urlAPI, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
            body: JSON.stringify({ songs })
        });
        loadSongs();
    }

    document.getElementById('add-btn').onclick = async () => {
        const title = document.getElementById('title').value;
        const url = document.getElementById('url').value;
        if (!title || !url) return alert('Заповніть поля!');
        
        const res = await fetch(urlAPI, { headers: { 'X-Master-Key': API_KEY }});
        const data = await res.json();
        const songs = data.record.songs || [];
        songs.push({ title, url });
        
        await fetch(urlAPI, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
            body: JSON.stringify({ songs })
        });
        document.getElementById('title').value = '';
        document.getElementById('url').value = '';
        loadSongs();
    };
    loadSongs();
</script>
</body>
</html>
