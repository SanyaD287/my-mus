<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotisanya</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- ДЕСКТОПНИЙ МАКЕТ (ПК) --- */
        .desktop-layout {
            display: grid;
            grid-template-columns: 240px 1fr;
            grid-template-rows: 1fr 90px;
            height: 100vh;
            width: 100vw;
        }

        /* Бічна панель (Sidebar) */
        .sidebar {
            background-color: #000000;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-right: 1px solid #1a1a1a;
            grid-row: 1 / 2;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.5px;
        }
        .logo span {
            color: #e50914;
        }
        .nav-link {
            color: #b3b3b3;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: color 0.2s;
            cursor: pointer;
        }
        .nav-link:hover, .nav-link.active {
            color: #fff;
        }

        /* Основна область контенту */
        .main-content {
            background: linear-gradient(180deg, #1f0808 0%, #0f0f0f 100%);
            padding: 24px 32px;
            overflow-y: auto;
            grid-column: 2 / 3;
            grid-row: 1 / 2;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .section-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 16px;
        }

        /* Додавання треків */
        .add-card {
            background: #181818;
            padding: 16px;
            border-radius: 8px;
            display: flex;
            gap: 12px;
            align-items: center;
            border: 1px solid #281010;
        }
        input {
            padding: 10px 14px;
            border-radius: 4px;
            border: 1px solid #333;
            background: #242424;
            color: #fff;
            font-size: 14px;
            outline: none;
            flex: 1;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #e50914;
            background: #2a2a2a;
        }
        button#add-btn {
            background: #e50914;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 500px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }
        button#add-btn:hover {
            background: #b20710;
            transform: scale(1.04);
        }

        /* Список треків (Плейлист) */
        .playlist-header {
            display: grid;
            grid-template-columns: 40px 1fr 50px;
            color: #b3b3b3;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 0 16px 8px 16px;
            border-bottom: 1px solid #282828;
            margin-bottom: 8px;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        li {
            display: grid;
            grid-template-columns: 40px 1fr 50px;
            align-items: center;
            padding: 8px 16px;
            border-radius: 4px;
            transition: background 0.2s;
            cursor: pointer;
        }
        li:hover {
            background: rgba(229, 9, 20, 0.08);
        }
        li.active {
            background: rgba(229, 9, 20, 0.18);
            border-left: 3px solid #e50914;
        }
        li.active .song-name {
            color: #e50914;
            font-weight: 700;
        }
        .song-index {
            color: #b3b3b3;
            font-size: 14px;
        }
        .song-name {
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
        }
        .del-btn {
            background: transparent;
            border: none;
            color: #b3b3b3;
            cursor: pointer;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.2s, color 0.2s;
        }
        li:hover .del-btn {
            opacity: 1;
        }
        .del-btn:hover {
            color: #e50914;
        }

        /* Нижня панель плеєра */
        .spotify-player-bar {
            grid-column: 1 / 3;
            grid-row: 2 / 3;
            background-color: #121212;
            border-top: 1px solid #222;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 10;
        }
        .current-info {
            width: 30%;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .current-title {
            font-size: 14px;
            font-weight: 500;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .current-artist {
            font-size: 11px;
            color: #b3b3b3;
        }

        /* Центр керування плеєром */
        .player-center-controls {
            width: 40%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .player-buttons {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .ctrl-btn {
            background: transparent;
            border: none;
            color: #b3b3b3;
            font-size: 16px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .ctrl-btn:hover {
            color: #e50914;
        }
        .play-pause-btn {
            width: 34px;
            height: 34px;
            background: #e50914;
            color: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            box-shadow: 0 2px 10px rgba(229, 9, 20, 0.4);
            transition: transform 0.1s, background-color 0.2s;
        }
        .play-pause-btn:hover {
            transform: scale(1.06);
            background: #b20710;
            color: #fff;
        }

        /* Таймлайн */
        .progress-bar-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            max-width: 500px;
        }
        .time-text {
            font-size: 11px;
            color: #b3b3b3;
            min-width: 35px;
            text-align: center;
        }
        .progress-container {
            flex: 1;
            height: 4px;
            background: #333;
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }
        .progress-container:hover .progress-bar {
            background: #e50914;
        }
        .progress-bar {
            height: 100%;
            background: #fff;
            border-radius: 2px;
            width: 0%;
            position: relative;
        }

        .extra-controls {
            width: 30%;
        }

        /* --- АДАПТИВНІСТЬ ДЛЯ ТЕЛЕФОНІВ --- */
        @media (max-width: 768px) {
            .desktop-layout {
                display: flex;
                flex-direction: column;
                height: 100vh;
            }
            .sidebar {
                display: none;
            }
            .main-content {
                flex: 1;
                padding: 16px 16px 110px 16px; /* Відступ знизу, щоб контент не перекривався плеєром */
                overflow-y: auto;
            }
            .spotify-player-bar {
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                height: 100px;
                flex-direction: column;
                justify-content: center;
                gap: 8px;
                padding: 10px 16px;
                border-top: 1px solid #222;
                background-color: #121212;
            }
            .current-info {
                width: 100%;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
            .current-title {
                font-size: 13px;
                max-width: 70%;
            }
            .current-artist {
                display: block;
                font-size: 11px;
            }
            .player-center-controls {
                width: 100%;
                flex-direction: column;
                gap: 6px;
            }
            .player-buttons {
                gap: 24px;
            }
            .progress-bar-wrapper {
                display: flex;
                width: 100%;
                max-width: 100%;
            }
            .extra-controls {
                display: none;
            }
            .play-pause-btn {
                width: 36px;
                height: 36px;
                font-size: 13px;
                background: #e50914;
                color: #fff;
            }
            .ctrl-btn {
                font-size: 18px;
                color: #fff;
            }
            .add-card {
                flex-direction: column;
            }
            button#add-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="desktop-layout">
    <!-- Бічна панель (тільки ПК) -->
    <div class="sidebar">
        <div class="logo"><span>🔴</span> Spotisanya</div>
        <div class="nav-link active">🏠 Головна</div>
        <div class="nav-link">🎵 Мій плейлист</div>
    </div>

    <!-- Основний контент -->
    <div class="main-content">
        <div class="section-title">Додати трек до хмари</div>
        <div class="add-card">
            <input type="text" id="title" placeholder="Назва треку">
            <input type="text" id="url" placeholder="Пряме посилання на MP3">
            <button id="add-btn">Додати</button>
        </div>

        <div style="margin-top: 16px;">
            <div class="section-title">Треки у плейлисті</div>
            <div class="playlist-header">
                <div>#</div>
                <div>Назва</div>
                <div>✕</div>
            </div>
            <ul id="list"></ul>
        </div>
    </div>

    <!-- Нижня панель плеєра -->
    <div class="spotify-player-bar">
        <div class="current-info">
            <div class="current-title" id="current-song-title">Нічого не вибрано</div>
            <div class="current-artist">Spotisanya</div>
        </div>

        <div class="player-center-controls">
            <div class="player-buttons">
                <button class="ctrl-btn" id="prev-btn" title="Попередня">⏮</button>
                <button class="ctrl-btn play-pause-btn" id="play-pause-btn" title="Грати/Пауза">▶</button>
                <button class="ctrl-btn" id="next-btn" title="Наступна">⏭</button>
            </div>
            <div class="progress-bar-wrapper">
                <span class="time-text" id="current-time">0:00</span>
                <div class="progress-container" id="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <span class="time-text" id="duration-time">0:00</span>
            </div>
        </div>

        <div class="extra-controls"></div>
    </div>
</div>

<!-- Прихований аудіо елемент -->
<audio id="player"></audio>

<script>
    const BIN_ID = '6a7c3536da38895dfed9948e'; 
    const API_KEY = '$2a$10$RZSWlrF3nSMRAsv5Jlk1MOHs4qBWJ6ItuOqlU9rE1KSeii4Ck2XFu'; 
    const urlAPI = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    let currentSongs = [];
    let currentIndex = 0;
    const player = document.getElementById('player');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const progressBar = document.getElementById('progress-bar');
    const progressContainer = document.getElementById('progress-container');
    const currentSongTitle = document.getElementById('current-song-title');
    const currentTimeEl = document.getElementById('current-time');
    const durationTimeEl = document.getElementById('duration-time');

    function formatTime(seconds) {
        if (isNaN(seconds)) return "0:00";
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    async function loadSongs() {
        try {
            const response = await fetch(urlAPI, { headers: { 'X-Master-Key': API_KEY }});
            const result = await response.json();
            currentSongs = result.record.songs || [];
            renderList();
        } catch (err) {
            console.error('Помилка завантаження:', err);
        }
    }

    function renderList() {
        const list = document.getElementById('list');
        list.innerHTML = '';
        
        if (currentSongs.length === 0) {
            list.innerHTML = '<li style="color: #777; justify-content: center; cursor: default; display: block; text-align: center; padding: 20px;">Плейлист порожній</li>';
            return;
        }

        currentSongs.forEach((song, index) => {
            const li = document.createElement('li');
            if (index === currentIndex) li.classList.add('active');

            li.innerHTML = `
                <span class="song-index">${index + 1}</span>
                <span class="song-name" title="${song.title}">${song.title}</span>
                <button class="del-btn" onclick="deleteSong(event, ${index})">✕</button>
            `;
            li.onclick = () => playSong(index);
            list.appendChild(li);
        });
    }

    function playSong(index) {
        if (index < 0 || index >= currentSongs.length) return;
        currentIndex = index;
        const song = currentSongs[currentIndex];
        
        player.src = song.url;
        player.play();
        currentSongTitle.textContent = song.title;
        playPauseBtn.textContent = '❚❚';
        renderList();
        updateMediaSession(song);
    }

    playPauseBtn.onclick = (e) => {
        e.stopPropagation();
        if (currentSongs.length === 0) return;
        if (player.paused) {
            if (!player.src && currentSongs.length > 0) {
                playSong(0);
            } else {
                player.play();
            }
            playPauseBtn.textContent = '❚❚';
        } else {
            player.pause();
            playPauseBtn.textContent = '▶';
        }
    };

    document.getElementById('next-btn').onclick = (e) => {
        e.stopPropagation();
        if (currentSongs.length === 0) return;
        let nextIndex = (currentIndex + 1) % currentSongs.length;
        playSong(nextIndex);
    };

    document.getElementById('prev-btn').onclick = (e) => {
        e.stopPropagation();
        if (currentSongs.length === 0) return;
        let prevIndex = (currentIndex - 1 + currentSongs.length) % currentSongs.length;
        playSong(prevIndex);
    };

    player.ontimeupdate = () => {
        if (player.duration) {
            const percent = (player.currentTime / player.duration) * 100;
            progressBar.style.width = percent + '%';
            currentTimeEl.textContent = formatTime(player.currentTime);
            durationTimeEl.textContent = formatTime(player.duration);
        }
    };

    progressContainer.onclick = (e) => {
        const width = progressContainer.clientWidth;
        const clickX = e.offsetX;
        if (player.duration) {
            player.currentTime = (clickX / width) * player.duration;
        }
    };

    player.onended = () => {
        let nextIndex = (currentIndex + 1) % currentSongs.length;
        if (currentSongs.length > 0) {
            playSong(nextIndex);
        }
    };

    function updateMediaSession(song) {
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: song.title,
                artist: 'Spotisanya',
                album: 'Мій плейлист'
            });

            navigator.mediaSession.setActionHandler('nexttrack', () => {
                let nextIndex = (currentIndex + 1) % currentSongs.length;
                playSong(nextIndex);
            });

            navigator.mediaSession.setActionHandler('previoustrack', () => {
                let prevIndex = (currentIndex - 1 + currentSongs.length) % currentSongs.length;
                playSong(prevIndex);
            });
            
            navigator.mediaSession.setActionHandler('play', () => {
                player.play();
                playPauseBtn.textContent = '❚❚';
            });
            navigator.mediaSession.setActionHandler('pause', () => {
                player.pause();
                playPauseBtn.textContent = '▶';
            });
        }
    }

    async function deleteSong(event, index) {
        event.stopPropagation();
        try {
            const res = await fetch(urlAPI, { headers: { 'X-Master-Key': API_KEY }});
            const data = await res.json();
            let songs = data.record.songs;
            songs.splice(index, 1);
            
            await fetch(urlAPI, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify({ songs })
            });
            loadSongs();
        } catch (err) {
            alert('Помилка видалення');
        }
    }

    document.getElementById('add-btn').onclick = async () => {
        const title = document.getElementById('title').value.trim();
        const url = document.getElementById('url').value.trim();
        if (!title || !url) {
            alert('Заповніть обидва поля!');
            return;
        }
        
        try {
            const res = await fetch(urlAPI, { headers: { 'X-Master-Key': API_KEY }});
            const data = await res.json();
            const songs = data.record.songs || [];
            songs.push({ title, url });
            
            const updateRes = await fetch(urlAPI, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify({ songs })
            });

            if (updateRes.ok) {
                document.getElementById('title').value = '';
                document.getElementById('url').value = '';
                loadSongs();
            } else {
                alert('Помилка збереження');
            }
        } catch (err) {
            alert('Помилка: ' + err.message);
        }
    };

    loadSongs();
</script>
</body>
</html>
