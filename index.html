<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpotiSanya Lite</title>
    <style>
        :root {
            --accent: #1db954;
            --bg-main: #121212;
            --bg-card: #181818;
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .app-layout {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        .main-content {
            padding: 24px 32px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 110px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .add-card {
            background: var(--bg-card);
            padding: 16px;
            border-radius: 12px;
            display: flex;
            gap: 10px;
            align-items: center;
            border: 1px solid var(--border-color);
            flex-wrap: wrap;
        }

        input[type="text"] {
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #242424;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            flex: 1;
        }
        input[type="text"]:focus { border-color: var(--accent); }

        button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 500px;
            font-weight: 700;
            cursor: pointer;
        }
        button:hover { filter: brightness(1.1); }

        .secondary-btn {
            background: #242424;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
        }

        .playlist-header {
            display: grid;
            grid-template-columns: 40px 1fr 100px;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 0 16px 8px 16px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 8px;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        li {
            display: grid;
            grid-template-columns: 40px 1fr 100px;
            align-items: center;
            padding: 10px 16px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.02);
            cursor: pointer;
            border: 1px solid transparent;
        }
        li:hover { background: rgba(255, 255, 255, 0.04); }
        li.active {
            background: rgba(255, 255, 255, 0.06);
            border-left: 4px solid var(--accent);
        }
        li.active .song-name { color: var(--accent); font-weight: 700; }
        .song-index { color: var(--text-muted); font-size: 14px; }
        .song-name {
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .action-btns {
            display: flex;
            gap: 4px;
            justify-content: flex-end;
        }
        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 12px;
            padding: 4px 6px;
            border-radius: 4px;
        }
        .action-btn:hover { background: rgba(255,255,255,0.1); color: var(--text-main); }
        .del-btn:hover { color: #ff4d4d !important; }

        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #000;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            gap: 16px;
            z-index: 10;
        }
        .current-info {
            width: 25%;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .player-center {
            width: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .player-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .ctrl-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 16px;
            cursor: pointer;
            padding: 4px 8px;
        }
        .play-pause-btn {
            width: 36px;
            height: 36px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 14px;
        }
        .progress-container {
            width: 100%;
            max-width: 400px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }
        .progress-bar {
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            width: 0%;
        }
        .volume-wrapper {
            width: 25%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
        }
        .volume-slider {
            width: 80px;
            height: 4px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .player-bar { flex-direction: column; gap: 8px; }
            .current-info, .player-center, .volume-wrapper { width: 100%; justify-content: center; }
            .main-content { padding-bottom: 160px; }
        }
    </style>
</head>
<body>

<div class="app-layout">
    <div class="main-content">
        <div class="section-title">Додати трек</div>
        <div class="add-card">
            <input type="text" id="title" placeholder="Назва треку">
            <input type="text" id="url" placeholder="Посилання на MP3">
            <button id="add-btn">Додати</button>
            <input type="file" id="folder-input" webkitdirectory directory multiple style="display: none;">
            <button id="folder-btn" class="secondary-btn">📂 Папка</button>
        </div>

        <div class="drop-zone" id="drop-zone">
            📥 Перетягніть MP3 файли сюди
        </div>

        <div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <div class="section-title" style="margin-bottom: 0;">Плейлист</div>
                <input type="text" id="search-input" placeholder="🔍 Пошук..." style="max-width: 220px; padding: 6px 10px; font-size: 13px;">
            </div>
            <div class="playlist-header">
                <div>#</div>
                <div>Назва</div>
                <div style="text-align: right;">Дії</div>
            </div>
            <ul id="list"></ul>
        </div>
    </div>

    <div class="player-bar">
        <div class="current-info" id="current-song-title">Нічого не вибрано</div>
        
        <div class="player-center">
            <div class="player-controls">
                <button class="ctrl-btn" id="prev-btn">⏮</button>
                <button class="ctrl-btn play-pause-btn" id="play-pause-btn">▶</button>
                <button class="ctrl-btn" id="next-btn">⏭</button>
            </div>
            <div class="progress-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>

        <div class="volume-wrapper">
            <span>🔊</span>
            <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="1">
        </div>
    </div>
</div>

<audio id="player" preload="auto"></audio>

<script>
    const BIN_ID = '6a7c3536da38895dfed9948e'; 
    const API_KEY = '$2a$10$RZSWlrF3nSMRAsv5Jlk1MOHs4qBWJ6ItuOqlU9rE1KSeii4Ck2XFu'; 
    const urlAPI = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    let currentSongs = [];
    let currentIndex = 0;
    let searchQuery = '';

    const player = document.getElementById('player');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const progressBar = document.getElementById('progress-bar');
    const progressContainer = document.getElementById('progress-container');
    const currentSongTitle = document.getElementById('current-song-title');
    const volumeSlider = document.getElementById('volume-slider');
    const searchInput = document.getElementById('search-input');

    volumeSlider.oninput = (e) => { 
        player.volume = e.target.value; 
        localStorage.setItem('spotisanya_volume', player.volume);
    };

    const savedVol = localStorage.getItem('spotisanya_volume');
    if (savedVol !== null) {
        player.volume = parseFloat(savedVol);
        volumeSlider.value = savedVol;
    }

    async function loadSongs() {
        try {
            const response = await fetch(urlAPI, { headers: { 'X-Master-Key': API_KEY }});
            const result = await response.json();
            const cloudSongs = result.record.songs;

            if (Array.isArray(cloudSongs) && cloudSongs.length > 0) {
                currentSongs = cloudSongs;
                localStorage.setItem('spotisanya_cache', JSON.stringify(currentSongs));
            } else {
                loadFromCache();
            }
        } catch (err) {
            loadFromCache();
        }
        renderList();
    }

    function loadFromCache() {
        const cached = localStorage.getItem('spotisanya_cache');
        if (cached) currentSongs = JSON.parse(cached);
    }
    loadSongs();

    async function syncCloud() {
        try {
            await fetch(urlAPI, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify({ songs: currentSongs })
            });
            localStorage.setItem('spotisanya_cache', JSON.stringify(currentSongs));
        } catch(err) {}
    }

    function renderList() {
        const list = document.getElementById('list');
        list.innerHTML = '';
        
        const filteredSongs = currentSongs.map((song, originalIndex) => ({ ...song, originalIndex }))
            .filter(song => song.title.toLowerCase().includes(searchQuery.toLowerCase()));

        if (filteredSongs.length === 0) {
            list.innerHTML = '<li style="color: var(--text-muted); justify-content: center; display: block; text-align: center; padding: 20px;">Нічого не знайдено</li>';
            return;
        }

        filteredSongs.forEach((song) => {
            const li = document.createElement('li');
            if (song.originalIndex === currentIndex) li.classList.add('active');

            li.innerHTML = `
                <span class="song-index">${song.originalIndex + 1}</span>
                <span class="song-name" title="${song.title}">${song.title}</span>
                <div class="action-btns">
                    <button class="action-btn" onclick="renameSong(event, ${song.originalIndex})" title="Редагувати">✏️</button>
                    <button class="action-btn del-btn" onclick="deleteSong(event, ${song.originalIndex})" title="Видалити">✕</button>
                </div>
            `;
            li.onclick = () => playSong(song.originalIndex);
            list.appendChild(li);
        });
    }

    searchInput.oninput = (e) => {
        searchQuery = e.target.value;
        renderList();
    };

    function playSong(index) {
        if (index < 0 || index >= currentSongs.length) return;
        currentIndex = index;
        const song = currentSongs[currentIndex];
        
        player.src = song.url;
        player.load();
        player.play().then(() => {
            playPauseBtn.textContent = '❚❚';
        }).catch(() => {});
        
        currentSongTitle.textContent = song.title;
        renderList();
    }

    playPauseBtn.onclick = () => {
        if (currentSongs.length === 0) return;
        if (player.paused) {
            if (!player.src) playSong(0);
            else player.play().then(() => { playPauseBtn.textContent = '❚❚'; });
        } else {
            player.pause();
            playPauseBtn.textContent = '▶';
        }
    };

    document.getElementById('next-btn').onclick = () => {
        if (currentSongs.length > 0) playSong((currentIndex + 1) % currentSongs.length);
    };
    document.getElementById('prev-btn').onclick = () => {
        if (currentSongs.length > 0) playSong((currentIndex - 1 + currentSongs.length) % currentSongs.length);
    };

    player.ontimeupdate = () => {
        if (player.duration) {
            progressBar.style.width = ((player.currentTime / player.duration) * 100) + '%';
        }
    };

    progressContainer.onclick = (e) => {
        if (player.duration) {
            player.currentTime = (e.offsetX / progressContainer.clientWidth) * player.duration;
        }
    };

    player.onended = () => {
        if (currentSongs.length > 0) playSong((currentIndex + 1) % currentSongs.length);
    };

    document.getElementById('add-btn').onclick = async () => {
        const title = document.getElementById('title').value.trim();
        const url = document.getElementById('url').value.trim();
        if (!title || !url) return alert('Заповніть поля!');

        currentSongs.push({ title, url });
        document.getElementById('title').value = '';
        document.getElementById('url').value = '';
        renderList();
        await syncCloud();
    };

    const dropZoneEl = document.getElementById('drop-zone');
    dropZoneEl.ondragover = (e) => { e.preventDefault(); };
    dropZoneEl.ondrop = async (e) => {
        e.preventDefault();
        if (e.dataTransfer.files.length > 0) {
            const file = e.dataTransfer.files[0];
            if (file.type.includes('audio') || file.name.endsWith('.mp3')) {
                currentSongs.push({ title: file.name.replace(/\.[^/.]+$/, ""), url: URL.createObjectURL(file) });
                renderList();
                playSong(currentSongs.length - 1);
                await syncCloud();
            }
        }
    };

    const folderBtn = document.getElementById('folder-btn');
    const folderInput = document.getElementById('folder-input');
    folderBtn.onclick = () => folderInput.click();
    folderInput.onchange = async (e) => {
        let added = 0;
        for (let file of e.target.files) {
            if (file.name.endsWith('.mp3') || file.name.endsWith('.wav')) {
                currentSongs.push({ title: file.name.replace(/\.[^/.]+$/, ""), url: URL.createObjectURL(file) });
                added++;
            }
        }
        if (added > 0) {
            renderList();
            if (!player.src) playSong(currentSongs.length - added);
            await syncCloud();
        }
        folderInput.value = '';
    };

    async function renameSong(event, index) {
        event.stopPropagation();
        const newTitle = prompt("Нова назва:", currentSongs[index].title);
        if (!newTitle || !newTitle.trim()) return;
        currentSongs[index].title = newTitle.trim();
        renderList();
        if (index === currentIndex) currentSongTitle.textContent = newTitle.trim();
        await syncCloud();
    }

    async function deleteSong(event, index) {
        event.stopPropagation();
        if (!confirm("Видалити трек?")) return;
        currentSongs.splice(index, 1);
        renderList();
        await syncCloud();
    }
</script>
</body>
</html>
